<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Compare</title>
<script>try{var S=JSON.parse(localStorage.getItem('sadevfs2')).set;document.documentElement.dataset.t=S.dark?'d':'l';document.documentElement.style.setProperty('--ac',S.acc||'#0067c0')}catch(e){}</script>
<style>:root{--ac:#0067c0;--bg:#f3f5f9;--fg:#141824;--cd:#fff;--bd:#d5dae3;--mu:#6b7385}[data-t=d]{--bg:#1b1f2a;--fg:#e8ebf2;--cd:#262b38;--bd:#394055;--mu:#9aa3b8}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:13px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;outline:0}button{cursor:pointer}button:hover,input:focus,select:focus{border-color:var(--ac)}.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb{display:flex;gap:6px;padding:6px 8px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}.sb{padding:3px 10px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);background:var(--cd)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fl{flex:1;min-height:0;overflow:auto}.mu{color:var(--mu)}.cp{display:flex;gap:8px;padding:8px;height:36%}.cp textarea{flex:1;resize:none;font:13px Consolas,monospace;white-space:pre}#df{font:13px Consolas,monospace;white-space:pre-wrap;user-select:text}#df div{padding:1px 10px}.ad{background:color-mix(in srgb,#107c10 22%,transparent)}.rm{background:color-mix(in srgb,#c42b1c 22%,transparent)}.ln{color:var(--mu);display:inline-block;width:42px}</style></head><body><div class=tb><button id=go class=p>Linganisha</button><button id=sw>⇄ Badilisha pande</button><label><input type=checkbox id=ws style="width:auto"> Puuza nafasi</label><label><input type=checkbox id=ic style="width:auto"> Puuza herufi kubwa/ndogo</label><button id=f1>📂 A</button><button id=f2>📂 B</button><input type=file id=fi hidden></div><div class=cp><textarea id=a placeholder="Maandishi A (asili)"></textarea><textarea id=b placeholder="Maandishi B (mapya)"></textarea></div><div class=fl id=df></div><div class=sb id=sm>Bandika maandishi mawili kisha bonyeza Linganisha</div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const nm=s=>{if($('#ws').checked)s=s.replace(/\s+/g,' ').trim();if($('#ic').checked)s=s.toLowerCase();return s};
function diff(x,y){const a=x.map(nm),b=y.map(nm),n=a.length,m=b.length;if(n*m>6e6)throw'Maandishi ni marefu sana (mistari '+n+' × '+m+')';const w=m+1,L=new Uint16Array((n+1)*w);for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i*w+j]=a[i]==b[j]?L[(i+1)*w+j+1]+1:Math.max(L[(i+1)*w+j],L[i*w+j+1]);
const o=[];let i=0,j=0;while(i<n&&j<m){if(a[i]==b[j]){o.push(['=',x[i],i+1,j+1]);i++;j++}else if(L[(i+1)*w+j]>=L[i*w+j+1]){o.push(['-',x[i],i+1,'']);i++}else{o.push(['+',y[j],'',j+1]);j++}}while(i<n)o.push(['-',x[i],++i,'']);while(j<m)o.push(['+',y[j],'',++j]);return o}
$('#go').onclick=()=>{try{const o=diff($('#a').value.split('\n'),$('#b').value.split('\n')),ad=o.filter(r=>r[0]=='+').length,rm=o.filter(r=>r[0]=='-').length;$('#df').innerHTML=o.map(r=>`<div class="${r[0]=='+'?'ad':r[0]=='-'?'rm':''}"><span class=ln>${r[2]}</span><span class=ln>${r[3]}</span>${r[0]=='='?'  ':r[0]+' '}${String(r[1]).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('');$('#sm').textContent=ad||rm?`Mistari iliyoongezwa: ${ad} · Iliyoondolewa: ${rm}`:'✔ Maandishi yanafanana'}catch(e){$('#sm').textContent=e}};
$('#sw').onclick=()=>{const t=$('#a').value;$('#a').value=$('#b').value;$('#b').value=t};let tg;[['f1','a'],['f2','b']].forEach(([k,t])=>$('#'+k).onclick=()=>{tg=t;$('#fi').click()});$('#fi').onchange=async e=>{const f=e.target.files[0];if(f)$('#'+tg).value=await f.text();e.target.value=''};</script></body></html>
