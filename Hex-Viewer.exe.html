<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hex Viewer</title>
<script>try{var S=JSON.parse(localStorage.getItem('sadevfs2')).set;document.documentElement.dataset.t=S.dark?'d':'l';document.documentElement.style.setProperty('--ac',S.acc||'#0067c0')}catch(e){}</script>
<style>:root{--ac:#0067c0;--bg:#f3f5f9;--fg:#141824;--cd:#fff;--bd:#d5dae3;--mu:#6b7385}[data-t=d]{--bg:#1b1f2a;--fg:#e8ebf2;--cd:#262b38;--bd:#394055;--mu:#9aa3b8}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:13px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;outline:0}button{cursor:pointer}button:hover,input:focus,select:focus{border-color:var(--ac)}.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb{display:flex;gap:6px;padding:6px 8px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}.sb{padding:3px 10px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);background:var(--cd)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fl{flex:1;min-height:0;overflow:auto}.mu{color:var(--mu)}.hx{flex:1;overflow:auto;padding:8px 12px;font:13px Consolas,monospace;white-space:pre;user-select:text;background:var(--cd)}.of{color:var(--mu)}.ac{color:var(--mu)}mark{background:var(--ac);color:#fff}.tb input{width:120px}</style></head><body><div class=tb><button id=op class=p>📂 Fungua faili</button><input type=file id=fi hidden><button id=pv>‹</button><button id=nx>›</button><input id=go placeholder="Nenda: 0x1F0 au 512"><input id=fd placeholder="Tafuta: maandishi au hex 'FF D8'" style="width:190px"><button id=fb>Tafuta</button></div><div class=hx id=hx>Fungua au buruta faili hapa…</div><div class=sb id=b>Hakuna faili</div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const PG=4096;let F=null,off=0,hit=null;const h2=n=>n.toString(16).toUpperCase().padStart(2,'0');
$('#op').onclick=()=>$('#fi').click();$('#fi').onchange=e=>load(e.target.files[0]);addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0])});
function load(f){if(!f)return;F=f;off=0;hit=null;show()}
async function show(){if(!F)return;const u=new Uint8Array(await F.slice(off,off+PG).arrayBuffer());let o='Offset    '+[...Array(16).keys()].map(h2).join(' ')+'   ASCII\n';for(let i=0;i<u.length;i+=16){const r=u.slice(i,i+16);let hx='',as='';r.forEach((b,j)=>{const a=off+i+j,inH=hit&&a>=hit.s&&a<hit.s+hit.l;hx+=(inH?'<mark>'+h2(b)+'</mark>':h2(b))+' ';as+=b>=32&&b<127?String.fromCharCode(b).replace('&','&amp;').replace('<','&lt;'):'.'});o+='<span class=of>'+(off+i).toString(16).toUpperCase().padStart(8,'0')+'</span>  '+hx+' '.repeat((16-r.length)*3)+' <span class=ac>'+as+'</span>\n'}
$('#hx').innerHTML=o;$('#hx').scrollTop=0;$('#b').textContent=`${F.name} · ${F.size.toLocaleString()} byte · ukurasa ${Math.floor(off/PG)+1}/${Math.max(1,Math.ceil(F.size/PG))}`}
$('#pv').onclick=()=>{off=Math.max(0,off-PG);show()};$('#nx').onclick=()=>{if(F&&off+PG<F.size){off+=PG;show()}};
$('#go').onkeydown=e=>{if(e.key!='Enter'||!F)return;const v=$('#go').value.trim(),n=/^0x/i.test(v)?parseInt(v,16):parseInt(v,10);if(isNaN(n)||n<0||n>=F.size)return;off=Math.floor(n/16)*16-(Math.floor(n/16)*16)%PG;hit={s:n,l:1};show()};
async function find(){if(!F)return;const v=$('#fd').value;if(!v)return;const hexOk=/^([0-9a-f]{2}\s*)+$/i.test(v.trim()),pat=hexOk?Uint8Array.from(v.trim().split(/\s+/).flatMap(x=>x.match(/../g)).map(x=>parseInt(x,16))):new TextEncoder().encode(v),from=hit?hit.s+1:0,CH=1<<20;
for(let p=from;p<F.size;p+=CH-pat.length){const u=new Uint8Array(await F.slice(p,p+CH).arrayBuffer());for(let i=0;i<=u.length-pat.length;i++){let k=0;while(k<pat.length&&u[i+k]==pat[k])k++;if(k==pat.length){const a=p+i;hit={s:a,l:pat.length};off=a-a%PG;await show();$('#b').textContent+=' · imepatikana @0x'+a.toString(16).toUpperCase();return}}}
hit=null;$('#b').textContent='Haijapatikana (bonyeza Tafuta tena kuanza upya)'}
$('#fb').onclick=find;$('#fd').onkeydown=e=>{if(e.key=='Enter')find()};</script></body></html>
