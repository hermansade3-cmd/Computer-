<!DOCTYPE html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sade Computer</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font:13px 'Segoe UI',system-ui,sans-serif;user-select:none;background:radial-gradient(ellipse at 30% 90%,#0a2a8a 0,transparent 55%),radial-gradient(ellipse at 70% 20%,#4fc3f7 0,transparent 50%),linear-gradient(160deg,#0b1d6e,#2a7de1 60%,#9be0ff)}
#desk{position:absolute;inset:0 0 48px 0;padding:8px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px}
.ic{width:80px;padding:6px 2px;text-align:center;color:#fff;border-radius:4px;cursor:pointer;text-shadow:0 1px 3px #000;word-break:break-word;font-size:12px}
.ic:hover,.ic.s{background:rgba(255,255,255,.22)}.ic b{display:block;font-size:32px;font-weight:400}
#tb{position:absolute;bottom:0;left:0;right:0;height:48px;background:rgba(238,240,246,.85);backdrop-filter:blur(30px);border-top:1px solid #fff6;color:#111;display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:99999;overflow:hidden}
#tb button{background:none;border:0;color:#111;width:42px;height:40px;border-radius:6px;cursor:pointer;font-size:22px;position:relative}
#tb button:hover{background:#fffa}#tb button.on{background:#ffffffb0}
#ctr{display:flex;align-items:center;gap:2px;min-width:0}#tasks,#pins{display:flex;gap:2px;overflow:hidden}
#tasks button::after{content:'';position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;background:#777;border-radius:2px}
#tasks button.on::after{width:16px;margin-left:-8px;background:#0067c0}
#st{display:grid!important;grid-template-columns:1fr 1fr;gap:2px;padding:11px!important}#st i{background:#0078d4;border-radius:1px}
#wd,#tray{flex:1;display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.15}#tray{justify-content:flex-end}#clk{text-align:right;padding:2px 8px}
.w{position:absolute;background:#fff;border-radius:9px;border:1px solid #0003;box-shadow:0 12px 40px #0006;display:flex;flex-direction:column;overflow:hidden;min-width:260px;min-height:160px;resize:both;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.w.mx{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.h{background:#f3f3f3;color:#111;padding-left:12px;height:34px;display:flex;align-items:center;gap:6px;font-size:12px;touch-action:none}
.h span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.h i{font-style:normal;width:46px;height:34px;line-height:34px;text-align:center;cursor:pointer}
.h i:hover{background:#0000000f}.h i.x:hover{background:#c42b1c;color:#fff}
.b{flex:1;display:flex;flex-direction:column;min-height:0;color:#111;overflow:auto}
.bar{background:#f9f9f9;padding:5px;display:flex;gap:5px;align-items:center;border-bottom:1px solid #e5e5e5}
.bar button{border:0;background:none;border-radius:5px;padding:4px 10px;cursor:pointer;font:inherit}.bar button:hover{background:#0000000d}
.ad{flex:1;background:#fff;border:1px solid #ddd;border-radius:5px;padding:4px 10px;overflow:hidden;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,92px);gap:6px;padding:10px;align-content:start;overflow:auto;flex:1}
.it{text-align:center;padding:6px;border-radius:4px;cursor:pointer;word-break:break-all;font-size:12px}
.it:hover,.it.s{background:#cfe6ff}.it b{display:block;font-size:42px;font-weight:400}
.lst{display:flex;flex-direction:column;gap:0;padding:0}
.lst .it{display:grid;grid-template-columns:34px 1fr 70px;align-items:center;text-align:left;padding:5px 10px;border-radius:0;border-bottom:1px solid #f0f0f0;word-break:normal}
.lst .it b{font-size:22px;text-align:center}.lst .it em{font-style:normal;color:#888;font-size:11px;text-align:right}
pre{padding:12px;font:12px Consolas,monospace;white-space:pre-wrap;user-select:text}
#menu{position:absolute;left:50%;transform:translateX(-50%);bottom:58px;width:580px;max-width:96vw;height:640px;max-height:calc(100vh - 70px);background:rgba(243,243,246,.93);backdrop-filter:blur(40px);color:#111;border-radius:12px;border:1px solid #fff8;box-shadow:0 12px 50px #0006;display:none;flex-direction:column;overflow:hidden;z-index:99998}
#menu input{margin:22px 28px 6px;padding:10px 14px;border-radius:20px;border:1px solid #ddd;border-bottom:2px solid #0067c0;font:inherit;outline:0;user-select:text}
.sc{flex:1;overflow:auto;padding:6px 28px}.sc h4{margin:12px 0 8px}
.pg6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sa{text-align:center;padding:9px 2px;border-radius:6px;font-size:11px;cursor:pointer;word-break:break-word}.sa b{display:block;font-size:30px;font-weight:400}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.rc{display:flex;gap:10px;align-items:center;padding:8px;border-radius:6px;font-size:12px;cursor:pointer;word-break:break-all}.rc b{font-size:26px;font-weight:400}
.sa:hover,.rc:hover{background:#0000000d}
.ft{display:flex;justify-content:space-between;align-items:center;padding:12px 30px;background:#e9ebf1;border-top:1px solid #ddd}
.ft span{padding:8px 10px;border-radius:6px;cursor:pointer}.ft span:hover{background:#0000000f}
#lock{position:fixed;inset:0;z-index:999999;background:inherit;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:14vh;transition:transform .5s ease-in-out;cursor:pointer;text-shadow:0 2px 12px #0008}
#lock h1{font-size:96px;font-weight:300}#lock p{font-size:24px}#lock small{position:absolute;bottom:40px;font-size:14px}
#lock.up{transform:translateY(-100%);visibility:hidden;transition:transform .5s ease-in-out,visibility 0s .5s}
@media(max-width:760px){
#wd,#tray .tr,#sr{display:none}#pins button:nth-child(n+4){display:none}#ctr{flex:1;justify-content:center}#tray{flex:0 0 auto}#clk{font-size:11px;padding:0 4px}
#menu{width:100vw;max-width:100vw;bottom:48px;border-radius:12px 12px 0 0;height:75vh}.pg6{grid-template-columns:repeat(4,1fr)}.rg{grid-template-columns:1fr}
.h{height:40px}.h i{height:40px;line-height:40px;width:52px}.w{min-width:0}#lock h1{font-size:72px}
}
</style></head><body>
<div id="desk"></div>
<div id="menu"><input id="q" placeholder="Tafuta faili au programu..." autocomplete="off"><div class="sc" id="sc"></div><div class="ft"><span>👤 Sade</span><span id="lk">🔒 Funga</span></div></div>
<div id="tb"><div id="wd"><span style="font-size:26px">☀️</span><span>27°C<br>Jua</span></div>
<div id="ctr"><button id="st" title="Start"><i></i><i></i><i></i><i></i></button><button id="sr" title="Tafuta">🔍</button><span id="pins"></span><div id="tasks"></div></div>
<div id="tray"><span class="tr">📶 🔊 🔋</span><div id="clk"></div></div></div>
<div id="lock"><h1 id="lt"></h1><p id="ld"></p><small>Bonyeza popote kufungua</small></div>
<script>
/* ===== MAFAILI YOTE ===== (kila faili linafunguliwa kama <jina>.html mf. notes.txt.html) */
const FOLD={
"Nyaraka (Documents)":"notes.txt,report.doc,report.docx,manual.pdf,letter.rtf,document.odt,presentation.ppt,presentation.pptx,budget.xls,budget.xlsx,data.csv",
"Picha (Pictures)":"picha1.jpg,picha2.jpeg,nembo.png,mchezo.gif,old.bmp,mpya.webp,mchoro.svg,app.ico",
"Video (Videos)":"video1.mp4,filamu.mkv,zamani.avi,apple.mov,windows.wmv,wavuti.webm",
"Muziki (Music)":"wimbo.mp3,ubora.wav,aac-sauti.aac,flac-sauti.flac,ogg-sauti.ogg,app-sauti.m4a",
"Programu (Programs)":"cmd.exe,calc.exe,notepad.exe,paint.exe,setup.msi,vipengele.dll,driver.sys,anza.bat,amri.cmd,script.ps1,Calculator.lnk,Microsoft-Edge.exe,Microsoft-Copilot.exe,Microsoft-Office.exe,Microsoft-Word.exe,Microsoft-Excel.exe,Microsoft-PowerPoint.exe,Microsoft-Outlook.exe,Microsoft-OneNote.exe,Mozilla-Firefox.exe,Google-Chrome.exe,Microsoft-Games.exe",
"Code (Dev)":"index.html,style.css,app.js,config.json,data.xml,hello.py,Hello.java,main.cpp,index.php,query.sql,app.ts,README.md",
"Zilizobanwa (Archives)":"mafaili.zip,backup.rar,picha.7z,source.tar,logs.gz",
"Database":"app.db,watu.sqlite,watu.sqlite3,ofisi.mdb,mauzo.accdb,database.bak",
"Mfumo (System)":"mfumo.log,muda.tmp,settings.ini,config.cfg,data.dat,usajili.reg,kazi.cab,hati.vbs,hitilafu.dmp",
"Diski (Disks)":"windows.iso,diski.img,mashine.vhd,mashine.vhdx,vmware.vmdk,paketi.ova,paketi.ovf"
};
const ico={};
[["📄","txt tmp"],["📘","doc docx"],["📕","pdf"],["📝","rtf md"],["📃","odt"],["📙","ppt pptx"],["📗","xls xlsx"],["📊","csv"],["🖼️","jpg jpeg png bmp webp"],["🎞️","gif"],["🎨","svg css"],["⭐","ico"],["🎬","mp4 mkv avi mov wmv webm"],["🎵","mp3 wav aac flac ogg m4a"],["⚙️","exe ini cfg"],["📦","msi cab"],["🧩","dll"],["🛠️","sys"],["📟","bat cmd ps1"],["🔗","lnk"],["🌐","html"],["🟨","js"],["🧾","json xml"],["🐍","py"],["☕","java"],["➕","cpp"],["🐘","php"],["🗃️","sql"],["🟦","ts"],["🗜️","zip rar 7z tar gz"],["🗄️","db sqlite sqlite3 mdb accdb"],["💾","bak"],["📜","log vbs"],["🔢","dat"],["🧬","reg"],["💥","dmp"],["💿","iso img"],["💽","vhd vhdx vmdk"],["🖥️","ova ovf"]].forEach(([i,s])=>s.split(" ").forEach(e=>ico[e]=i));
const ICN={"Microsoft-Edge.exe":"🌐","Microsoft-Copilot.exe":"✨","Microsoft-Office.exe":"🏢","Microsoft-Word.exe":"📘","Microsoft-Excel.exe":"📗","Microsoft-PowerPoint.exe":"📙","Microsoft-Outlook.exe":"📧","Microsoft-OneNote.exe":"📓","Mozilla-Firefox.exe":"🦊","Google-Chrome.exe":"🌍","Microsoft-Games.exe":"🎮"};
const ext=n=>n.split(".").pop().toLowerCase();
const fi=n=>ICN[n]||ico[ext(n)]||"📄";
</script>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mob=()=>innerWidth<760;
let Z=10,wins=[];
function win(title,icon,w,h,body){
 const el=E("div","w"),hd=E("div","h","<span>"+icon+" &nbsp;"+esc(title)+"</span><i>─</i><i>☐</i><i class='x'>✕</i>"),b=E("div","b");
 b.append(body);el.append(hd,b);
 const n=wins.length%8*26;
 el.style.cssText=`left:${40+n}px;top:${30+n}px;width:${Math.min(w,innerWidth-10)}px;height:${Math.min(h,innerHeight-70)}px;z-index:${++Z}`;
 document.body.append(el);
 const tk=E("button","",icon);tk.title=title;$("#tasks").append(tk);
 const o={el,tk};wins.push(o);
 const focus=()=>{el.style.zIndex=++Z;el.style.display="";wins.forEach(x=>x.tk.classList.toggle("on",x===o))};
 const [mi,mx,cl]=hd.querySelectorAll("i");
 mi.onclick=e=>{e.stopPropagation();el.style.display="none";tk.classList.remove("on")};
 mx.onclick=e=>{e.stopPropagation();el.classList.toggle("mx")};
 cl.onclick=e=>{e.stopPropagation();el.remove();tk.remove();wins=wins.filter(x=>x!==o)};
 tk.onclick=()=>{if(el.style.display==="none"||!tk.classList.contains("on"))focus();else mi.click()};
 el.addEventListener("pointerdown",focus);
 hd.ondblclick=()=>el.classList.toggle("mx");
 hd.addEventListener("pointerdown",e=>{
  if(e.target.tagName==="I"||el.classList.contains("mx"))return;
  const sx=e.clientX-el.offsetLeft,sy=e.clientY-el.offsetTop;hd.setPointerCapture(e.pointerId);
  hd.onpointermove=v=>{el.style.left=Math.max(-100,v.clientX-sx)+"px";el.style.top=Math.max(0,v.clientY-sy)+"px"};
  hd.onpointerup=()=>{hd.onpointermove=null};
 });
 focus();if(mob())el.classList.add("mx");
 return o;
}
/* ===== FUNGUA FAILI: <jina>.html kutoka repository ===== */
function openFile(name){
 const url=name+".html",fr=E("iframe");
 fr.style.cssText="flex:1;border:0;width:100%;background:#fff";
 win(name,fi(name),760,520,fr);
 const miss=()=>fr.replaceWith(E("pre","","Faili halijapatikana kwenye repository:\n"+esc(url)+"\n\nHakikisha "+esc(url)+" lipo folda moja na index.html (herufi kubwa/ndogo zinahesabika)."));
 fetch(url,{method:"HEAD"}).then(r=>r.status===404?miss():fr.src=url).catch(()=>fr.src=url);
}
/* ===== FOLDA ===== */
function openFolder(f){
 const names=FOLD[f].split(","),wrap=E("div");
 wrap.style.cssText="display:flex;flex-direction:column;flex:1;min-height:0";
 const bar=E("div","bar","<button>▦ Gridi</button><button>☰ Orodha</button><span class='ad'>📁 "+esc(f)+" ("+names.length+")</span>"),g=E("div","grid");
 const draw=l=>{g.className="grid"+(l?" lst":"");g.innerHTML=names.map(n=>`<div class="it" data-n="${esc(n)}"><b>${fi(n)}</b>${l?`<span>${esc(n)}</span><em>${ext(n).toUpperCase()}</em>`:esc(n)}</div>`).join("")};
 const [bg,bl]=bar.querySelectorAll("button");bg.onclick=()=>draw(0);bl.onclick=()=>draw(1);
 g.addEventListener(mob()?"click":"dblclick",e=>{const it=e.target.closest(".it");if(it)openFile(it.dataset.n)});
 g.addEventListener("click",e=>{const it=e.target.closest(".it");if(!it)return;g.querySelectorAll(".s").forEach(x=>x.classList.remove("s"));it.classList.add("s")});
 draw(0);wrap.append(bar,g);win(f,"📁",640,440,wrap);
}
/* ===== DESKTOP ===== */
const desk=$("#desk");
Object.keys(FOLD).forEach(f=>{const d=E("div","ic","<b>📁</b>"+esc(f));d.onclick=()=>{desk.querySelectorAll(".s").forEach(x=>x.classList.remove("s"));d.classList.add("s");if(mob())openFolder(f)};d.ondblclick=()=>openFolder(f);desk.append(d)});
desk.addEventListener("click",e=>{if(e.target===desk)desk.querySelectorAll(".s").forEach(x=>x.classList.remove("s"));menu.style.display="none"});
/* ===== START MENU ===== */
const menu=$("#menu"),sc=$("#sc"),q=$("#q");
const PIN=["Microsoft-Edge.exe","Microsoft-Copilot.exe","Microsoft-Office.exe","Microsoft-Word.exe","Microsoft-Excel.exe","Microsoft-PowerPoint.exe","Microsoft-Outlook.exe","Microsoft-OneNote.exe","Mozilla-Firefox.exe","Google-Chrome.exe","Microsoft-Games.exe","notepad.exe"];
const REC=["notes.txt","report.docx","budget.xlsx","manual.pdf","index.html","README.md"];
const sa=n=>`<div class="sa" data-n="${esc(n)}"><b>${fi(n)}</b>${esc(n.replace(/\.[^.]+$/,""))}</div>`;
const rc=n=>`<div class="rc" data-n="${esc(n)}"><b>${fi(n)}</b>${esc(n)}</div>`;
function build(t){
 t=(t||"").toLowerCase();
 if(t){const l=Object.values(FOLD).flatMap(s=>s.split(",")).filter(n=>n.toLowerCase().includes(t)).slice(0,40);sc.innerHTML=`<h4>Matokeo (${l.length})</h4><div class="rg">${l.map(rc).join("")}</div>`}
 else sc.innerHTML=`<h4>Zilizobanwa</h4><div class="pg6">${PIN.map(sa).join("")}</div><h4>Zinazopendekezwa</h4><div class="rg">${REC.map(rc).join("")}</div>`;
}
sc.onclick=e=>{const it=e.target.closest("[data-n]");if(it){menu.style.display="none";openFile(it.dataset.n)}};
q.oninput=()=>build(q.value);
const toggle=()=>{const o=menu.style.display==="flex";menu.style.display=o?"none":"flex";$("#st").classList.toggle("on",!o);if(!o){q.value="";build();if(!mob())q.focus()}};
$("#st").onclick=e=>{e.stopPropagation();toggle()};$("#sr").onclick=e=>{e.stopPropagation();toggle()};
menu.onclick=e=>e.stopPropagation();
document.addEventListener("click",()=>{menu.style.display="none";$("#st").classList.remove("on")});
$("#lk").onclick=()=>{menu.style.display="none";$("#lock").classList.remove("up")};
$("#lock").onclick=()=>$("#lock").classList.add("up");
["Microsoft-Edge.exe","Google-Chrome.exe","Microsoft-Word.exe","Microsoft-Excel.exe"].forEach(n=>{const b=E("button","",fi(n));b.title=n;b.onclick=e=>{e.stopPropagation();openFile(n)};$("#pins").append(b)});
/* ===== SAA ===== */
const tick=()=>{const d=new Date(),t=d.toLocaleTimeString("sw",{hour:"2-digit",minute:"2-digit"});$("#clk").innerHTML=t+"<br>"+d.toLocaleDateString("sw");$("#lt").textContent=t;$("#ld").textContent=d.toLocaleDateString("sw",{weekday:"long",day:"numeric",month:"long"})};
tick();setInterval(tick,1000);build();
</script></body></html>
