<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mozilla Firefox</title>
<style>
:root{
  --strip:#1c1b22; --bar:#2b2a33; --field:#1c1b22; --field-h:#42414d; --tab:#42414d; --tab-act:#2b2a33;
  --text:#fbfbfe; --dim:#bfbfc9; --accent:#00ddff; --violet:#9059ff; --orange:#ff9400; --page:#1c1b22; --card:#2b2a33; --line:#52525e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--strip);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}

/* tab strip */
#strip{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:var(--strip);height:42px;flex:none}
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;min-width:120px;max-width:220px;height:34px;padding:0 8px 0 12px;border-radius:8px 8px 0 0;background:transparent;color:var(--dim);cursor:pointer;flex:0 1 200px}
.tab:hover{background:#2b2a33aa}
.tab.on{background:var(--tab-act);color:var(--text)}
.tab .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tab .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--dim)}
.tab .x:hover{background:var(--field-h);color:var(--text)}
#plus{width:30px;height:30px;margin:0 0 2px 4px;border-radius:6px;font-size:20px;color:var(--dim);flex:none}
#plus:hover{background:var(--field-h);color:var(--text)}

/* toolbar */
#tool{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--bar);flex:none;border-bottom:1px solid #0003}
.ib{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-size:19px;color:var(--text);flex:none}
.ib:hover:not(:disabled){background:var(--field-h)}
.ib:disabled{opacity:.35;cursor:default}
#urlwrap{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;border-radius:8px;background:var(--field);border:1px solid transparent}
#urlwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px #00ddff44}
#urlwrap .lock{font-size:13px;color:var(--dim)}
#url{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;outline:none}
#url::placeholder{color:var(--dim)}
#star.on{color:var(--orange)}

/* bookmarks bar */
#marks{display:flex;gap:2px;padding:3px 8px;background:var(--bar);border-bottom:1px solid #0004;overflow-x:auto;scrollbar-width:none;flex:none;min-height:30px;align-items:center}
.mk{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:5px;font-size:12.5px;white-space:nowrap;color:var(--text)}
.mk:hover{background:var(--field-h)}
.mk i{width:12px;height:12px;border-radius:3px;background:var(--violet);display:inline-block}
#marks .empty{font-size:12px;color:var(--dim);padding:3px 9px}

#views{flex:1;position:relative;min-height:0;background:var(--page)}
.view{position:absolute;inset:0;overflow:auto;display:none}
.view.on{display:block}
.view iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.pagebar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#3a2f6b;font-size:12.5px;position:sticky;top:0;z-index:2}
.pagebar a{color:var(--accent);margin-left:auto;white-space:nowrap}
.framebox{height:calc(100% - 33px)}

/* new tab page */
.nt{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:7vh 20px 40px;background:linear-gradient(160deg,#2a1a5e 0%,#1c1b22 55%,#3d1e1e 100%) center/cover no-repeat}
.nt .shade{position:absolute;inset:0;background:linear-gradient(#0000002b,#000000a8);pointer-events:none}
.nt>*{position:relative}
.logo{width:92px;height:92px;margin-bottom:12px;filter:drop-shadow(0 6px 18px #0008)}
.ntname{font-size:30px;font-weight:300;letter-spacing:.2px;margin-bottom:22px;text-shadow:0 2px 10px #000a}
.sbox{display:flex;align-items:center;gap:10px;width:min(640px,100%);height:50px;padding:0 18px;border-radius:26px;background:#2b2a33e6;border:1px solid #ffffff22;backdrop-filter:blur(8px)}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #00ddff40}
.sbox input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;min-width:0}
.sbox button{color:var(--accent);font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,96px);justify-content:center;gap:18px 14px;width:min(720px,100%);margin-top:34px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;text-align:center}
.tile b{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;font-size:28px;font-weight:600;color:#fff;box-shadow:0 4px 14px #0007;transition:transform .15s}
.tile:hover b{transform:translateY(-3px)}
.credit{margin-top:auto;padding-top:34px;font-size:11.5px;color:#fffc;text-shadow:0 1px 4px #000}

/* results */
.res{max-width:880px;margin:0 auto;padding:16px 18px 60px}
.rtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.rt{padding:9px 16px;color:var(--dim);border-bottom:3px solid transparent;margin-bottom:-1px}
.rt.on{color:var(--text);border-color:var(--accent)}
.answer{background:linear-gradient(135deg,#3a2f6b,#2b2a33);border-radius:12px;padding:14px 16px;margin-bottom:18px;line-height:1.55}
.answer small{display:block;color:var(--accent);margin-bottom:6px;font-size:12px}
.hit{padding:12px 0;border-bottom:1px solid #ffffff12}
.hit .u{font-size:12px;color:#7fd6a4;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit a{font-size:18px;color:#8fb8ff;text-decoration:none;display:block;margin-bottom:4px}
.hit a:hover{text-decoration:underline}
.hit p{color:var(--dim);line-height:1.5;font-size:14px}
.grid{columns:3 200px;column-gap:10px}
.grid a{display:block;margin-bottom:10px;border-radius:8px;overflow:hidden;position:relative;background:var(--card)}
.grid img{width:100%;display:block}
.grid span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;background:linear-gradient(#0000,#000b);opacity:0;transition:opacity .15s}
.grid a:hover span{opacity:1}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vid{border-radius:10px;overflow:hidden;background:var(--card)}
.vid video{width:100%;display:block;background:#000;aspect-ratio:16/9}
.vid div{padding:8px 10px;font-size:12.5px;color:var(--dim)}
.msg{padding:50px 20px;text-align:center;color:var(--dim);line-height:1.6}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:60px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.tile b{transition:none}}

/* menu + dialogs */
#menu{position:fixed;right:8px;top:calc(92px + env(safe-area-inset-top,0px));width:260px;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 30px #000a;display:none;z-index:20}
#menu.on{display:block}
#menu button{display:flex;width:100%;gap:12px;padding:9px 10px;border-radius:6px;text-align:left;align-items:center}
#menu button:hover{background:var(--field-h)}
#menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
#dlg{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:30;padding:16px}
#dlg.on{display:grid}
.panel{width:min(520px,100%);max-height:80vh;overflow:auto;background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:18px;font-weight:600;margin-bottom:12px}
.panel .row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff12}
.panel .row a{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8fb8ff;text-decoration:none}
.panel label{display:block;font-size:12.5px;color:var(--dim);margin:10px 0 4px}
.panel input{width:100%;height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--text);font:inherit}
.btn{height:36px;padding:0 16px;border-radius:6px;background:var(--field-h);margin-top:14px}
.btn.pri{background:var(--accent);color:#0c0c0d;font-weight:600}
.btn+.btn{margin-left:8px}
@media (max-width:640px){.tab{min-width:96px}#tool{gap:2px;padding:6px}.hide-s{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="strip"><div id="tabs" role="tablist"></div><button id="plus" title="Kichupo kipya (Ctrl+T)" aria-label="Kichupo kipya">+</button></div>
  <div id="tool">
    <button class="ib" id="back" title="Rudi nyuma" aria-label="Rudi nyuma">←</button>
    <button class="ib" id="fwd" title="Songa mbele" aria-label="Songa mbele">→</button>
    <button class="ib" id="reload" title="Pakia upya" aria-label="Pakia upya">⟳</button>
    <button class="ib hide-s" id="home" title="Nyumbani" aria-label="Nyumbani">⌂</button>
    <div id="urlwrap"><span class="lock" id="lock">🔍</span><input id="url" type="text" placeholder="Tafuta au andika anwani" autocomplete="off" spellcheck="false" aria-label="Upau wa anwani"><button class="ib" id="star" title="Weka alamisho" aria-label="Weka alamisho" style="width:30px;height:30px;font-size:17px">☆</button></div>
    <button class="ib" id="mbtn" title="Fungua menyu" aria-label="Menyu">≡</button>
  </div>
  <div id="marks"></div>
  <div id="views"></div>
</div>

<div id="menu">
  <button data-m="new"><span>＋</span>Kichupo kipya</button>
  <button data-m="hist"><span>🕘</span>Historia</button>
  <button data-m="marks"><span>★</span>Alamisho</button>
  <hr>
  <button data-m="full"><span>⛶</span>Skrini nzima</button>
  <button data-m="set"><span>⚙</span>Mipangilio</button>
</div>
<div id="dlg"><div class="panel" id="panel"></div></div>

<script>
/* ===== Mipangilio ya huduma ===== */
const CFG = {
  // Funguo za kutafuta mtandao (zinajaribiwa kwa mpangilio hadi moja ifanye kazi)
  webKeys: [
    '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',
    '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',
    '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',
    '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',
    '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',
    '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'
  ],
  picKey: '57792634-5e89dd610e4c1c840f815c524'
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('mf_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mf_'+k, JSON.stringify(v)); }catch(e){} }
};
let marks = store.get('marks', [
  {t:'Wikipedia', u:'https://sw.wikipedia.org'},
  {t:'Habari', u:'https://www.bbc.com/swahili'}
]);
let history = store.get('hist', []);

/* ===== Huduma za data ===== */
async function webSearch(q){
  const custom = store.get('customKey', '');
  const good = store.get('goodKey', '');
  const order = [custom, good, ...CFG.webKeys].filter((k,i,a) => k && a.indexOf(k) === i);
  let lastErr;
  for(const key of order){
    try{
      const r = await fetch('https://api.tavily.com/search', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body: JSON.stringify({query:q, max_results:10, include_answer:true, search_depth:'basic'})
      });
      if(r.status === 401 || r.status === 403){ lastErr = new Error('key'); continue; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      store.set('goodKey', key);
      return await r.json();
    }catch(e){ lastErr = e; if(e.message !== 'key') { if(e instanceof TypeError) continue; throw e; } }
  }
  throw lastErr || new Error('Imeshindwa');
}
async function picSearch(q, kind){
  const key = store.get('customPic','') || CFG.picKey;
  const base = kind === 'vid' ? 'https://pixabay.com/api/videos/' : 'https://pixabay.com/api/';
  const r = await fetch(base+'?key='+encodeURIComponent(key)+'&q='+encodeURIComponent(q)+'&per_page='+(kind==='vid'?12:30)+'&safesearch=true');
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

/* ===== Vichupo ===== */
const tabs = []; let cur = null, uid = 0;
const TILES = [
  ['Wikipedia','https://sw.wikipedia.org','W','#5b6dc8'],
  ['YouTube','https://www.youtube.com','▶','#d93025'],
  ['Habari','https://www.bbc.com/swahili','B','#b80000'],
  ['Ramani','https://www.openstreetmap.org','◉','#2e8b57'],
  ['GitHub','https://github.com','G','#444'],
  ['Hali ya hewa','https://wttr.in','☀','#e08a00'],
  ['Mitandao','https://www.mozilla.org/sw/firefox/','F','#9059ff']
];

function newTab(entry){
  const t = {id:++uid, title:'Kichupo kipya', hist:[], idx:-1, el:document.createElement('div')};
  t.el.className = 'view';
  $('#views').appendChild(t.el);
  tabs.push(t);
  go(t, entry || {t:'new'});
  activate(t);
  return t;
}
function activate(t){
  cur = t;
  tabs.forEach(x => x.el.classList.toggle('on', x === t));
  drawTabs(); syncBar();
}
function closeTab(t){
  const i = tabs.indexOf(t);
  t.el.remove(); tabs.splice(i,1);
  if(!tabs.length){ newTab(); return; }
  if(cur === t) activate(tabs[Math.min(i, tabs.length-1)]); else drawTabs();
}
function drawTabs(){
  $('#tabs').innerHTML = tabs.map(t =>
    `<div class="tab ${t===cur?'on':''}" role="tab" data-id="${t.id}"><span class="tt">${esc(t.title)}</span><button class="x" data-x="${t.id}" aria-label="Funga kichupo">×</button></div>`).join('');
}
$('#tabs').addEventListener('click', e => {
  const x = e.target.closest('[data-x]');
  if(x){ e.stopPropagation(); closeTab(tabs.find(t => t.id == x.dataset.x)); return; }
  const tb = e.target.closest('.tab'); if(tb) activate(tabs.find(t => t.id == tb.dataset.id));
});
$('#tabs').addEventListener('auxclick', e => {
  const tb = e.target.closest('.tab'); if(tb && e.button === 1) closeTab(tabs.find(t => t.id == tb.dataset.id));
});

/* ===== Urambazaji ===== */
function go(t, entry, replace){
  if(!replace){ t.hist = t.hist.slice(0, t.idx+1); t.hist.push(entry); t.idx = t.hist.length-1; }
  else t.hist[t.idx] = entry;
  render(t);
}
function looksUrl(s){ return /^https?:\/\//i.test(s) || (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s) && !/\s/.test(s)); }
function submit(text, t = cur){
  text = text.trim(); if(!text) return;
  if(looksUrl(text)) go(t, {t:'p', url:/^https?:\/\//i.test(text) ? text : 'https://'+text});
  else go(t, {t:'s', q:text, k:'web'});
}
function syncBar(){
  if(!cur) return;
  const e = cur.hist[cur.idx];
  $('#url').value = e.t === 's' ? e.q : e.t === 'p' ? e.url : '';
  $('#lock').textContent = e.t === 'p' ? (e.url.startsWith('https') ? '🔒' : '⚠') : '🔍';
  $('#back').disabled = cur.idx <= 0;
  $('#fwd').disabled = cur.idx >= cur.hist.length-1;
  const on = e.t === 'p' && marks.some(m => m.u === e.url);
  $('#star').textContent = on ? '★' : '☆'; $('#star').classList.toggle('on', on);
}
$('#back').onclick = () => { if(cur.idx > 0){ cur.idx--; render(cur); } };
$('#fwd').onclick = () => { if(cur.idx < cur.hist.length-1){ cur.idx++; render(cur); } };
$('#reload').onclick = () => render(cur);
$('#home').onclick = () => go(cur, {t:'new'});
$('#plus').onclick = () => { newTab(); $('#url').focus(); };
$('#url').addEventListener('keydown', e => { if(e.key === 'Enter'){ submit(e.target.value); e.target.blur(); } });
$('#url').addEventListener('focus', e => e.target.select());

/* ===== Uchoraji wa kurasa ===== */
let wallpaper = null;
async function loadWallpaper(){
  if(wallpaper) return wallpaper;
  const c = store.get('wall', null);
  if(c && Date.now() - c.at < 6*3600e3){ wallpaper = c; return c; }
  try{
    const terms = ['mountains landscape','forest sunrise','ocean sunset','savanna africa','night sky'];
    const j = await picSearch(terms[Math.floor(Math.random()*terms.length)], 'img');
    const hits = (j.hits || []).filter(h => h.imageWidth > h.imageHeight);
    const h = hits[Math.floor(Math.random()*hits.length)];
    if(h){ wallpaper = {url:h.largeImageURL, who:h.user, at:Date.now()}; store.set('wall', wallpaper); return wallpaper; }
  }catch(e){}
  return null;
}
const FOX = `<svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9059ff"/><stop offset="1" stop-color="#3a1fa8"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#e8221f"/></linearGradient></defs><circle cx="50" cy="50" r="34" fill="url(#g1)"/><path d="M14 52C12 28 30 8 56 10c-10 4-14 10-14 16 8-4 18-2 24 6-8 0-14 4-14 12 0 10 8 14 16 14 10 0 18-8 18-20 6 10 4 26-6 38-12 14-34 18-50 6-8-6-12-16-16-30z" fill="url(#g2)"/></svg>`;

async function render(t){
  const e = t.hist[t.idx];
  if(e.t === 'new'){
    t.title = 'Kichupo kipya';
    t.el.innerHTML = `<div class="nt" style="position:relative"><div class="shade"></div>${FOX}<div class="ntname">Mozilla Firefox</div>
      <form class="sbox" id="nf-${t.id}"><span>🔍</span><input type="text" placeholder="Tafuta kwenye mtandao" aria-label="Tafuta" autocomplete="off"><button type="submit" aria-label="Tafuta">→</button></form>
      <div class="tiles">${TILES.map(x => `<a class="tile" href="#" data-u="${x[1]}"><b style="background:${x[3]}">${x[2]}</b>${x[0]}</a>`).join('')}</div>
      <div class="credit" id="cr-${t.id}"></div></div>`;
    t.el.querySelector('form').onsubmit = ev => { ev.preventDefault(); submit(ev.target.querySelector('input').value, t); };
    t.el.querySelectorAll('.tile').forEach(a => a.onclick = ev => { ev.preventDefault(); go(t, {t:'p', url:a.dataset.u}); });
    const w = await loadWallpaper();
    if(w && t.hist[t.idx] === e){
      t.el.querySelector('.nt').style.backgroundImage = `url(${w.url})`;
      const cr = t.el.querySelector('.credit'); if(cr) cr.textContent = 'Picha na ' + w.who;
    }
  }
  else if(e.t === 's'){
    t.title = e.q;
    t.el.innerHTML = `<div class="res"><div class="rtabs">${[['web','Mtandao'],['img','Picha'],['vid','Video']].map(k => `<button class="rt ${e.k===k[0]?'on':''}" data-k="${k[0]}">${k[1]}</button>`).join('')}</div><div class="body"><div class="spin" role="status" aria-label="Inapakia"></div></div></div>`;
    t.el.querySelectorAll('.rt').forEach(b => b.onclick = () => go(t, {t:'s', q:e.q, k:b.dataset.k}, true));
    pushHist(e.q);
    const body = t.el.querySelector('.body');
    try{
      if(e.k === 'web'){
        const j = await webSearch(e.q);
        if(t.hist[t.idx] !== e) return;
        const rs = j.results || [];
        body.innerHTML = (j.answer ? `<div class="answer"><small>Jibu la haraka</small>${esc(j.answer)}</div>` : '') +
          (rs.length ? rs.map(r => `<div class="hit"><div class="u">${esc(r.url)}</div><a href="#" data-u="${esc(r.url)}">${esc(r.title)}</a><p>${esc((r.content||'').slice(0,260))}${(r.content||'').length>260?'…':''}</p></div>`).join('') : `<div class="msg">Hakuna matokeo ya “${esc(e.q)}”.<br>Jaribu maneno mengine.</div>`);
        body.querySelectorAll('.hit a').forEach(a => a.onclick = ev => { ev.preventDefault(); go(t, {t:'p', url:a.dataset.u}); });
      } else if(e.k === 'img'){
        const j = await picSearch(e.q, 'img');
        if(t.hist[t.idx] !== e) return;
        const hs = j.hits || [];
        body.innerHTML = hs.length ? `<div class="grid">${hs.map(h => `<a href="${esc(h.largeImageURL)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(h.webformatURL)}" alt="${esc(h.tags)}"><span>${esc(h.tags)}</span></a>`).join('')}</div>` : `<div class="msg">Hakuna picha za “${esc(e.q)}”.<br>Jaribu neno la Kiingereza, mfano “sea”.</div>`;
      } else {
        const j = await picSearch(e.q, 'vid');
        if(t.hist[t.idx] !== e) return;
        const hs = j.hits || [];
        body.innerHTML = hs.length ? `<div class="vids">${hs.map(h => { const v = h.videos.tiny || h.videos.small || h.videos.medium; return `<div class="vid"><video controls preload="none" poster="${esc('https://i.vimeocdn.com/video/'+h.picture_id+'_640x360.jpg')}" src="${esc(v.url)}"></video><div>${esc(h.tags)}</div></div>`; }).join('')}</div>` : `<div class="msg">Hakuna video za “${esc(e.q)}”.<br>Jaribu neno la Kiingereza.</div>`;
      }
    }catch(err){
      if(t.hist[t.idx] === e) body.innerHTML = `<div class="msg">Imeshindwa kupakia matokeo.<br>Angalia muunganisho wa intaneti kisha bonyeza ⟳.<br><small>Ikiendelea, fungua Mipangilio uweke ufunguo mpya.</small></div>`;
    }
  }
  else {
    let host = e.url; try{ host = new URL(e.url).hostname; }catch(x){}
    t.title = host;
    t.el.innerHTML = `<div class="pagebar"><span>Ukurasa ukionekana tupu, tovuti hiyo haikubali kufunguliwa hapa.</span><a href="${esc(e.url)}" target="_blank" rel="noopener">Fungua nje ↗</a></div><div class="framebox"><iframe src="${esc(e.url)}" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads" title="${esc(host)}"></iframe></div>`;
    pushHist(e.url, host);
  }
  drawTabs(); if(t === cur) syncBar();
}
function pushHist(u, title){
  if(history[0] && history[0].u === u) return;
  history.unshift({u, t:title || u, at:Date.now()}); history = history.slice(0, 80); store.set('hist', history);
}

/* ===== Alamisho ===== */
function drawMarks(){
  $('#marks').innerHTML = marks.length ? marks.map((m,i) => `<a class="mk" href="#" data-i="${i}"><i></i>${esc(m.t)}</a>`).join('') : '<span class="empty">Bonyeza ☆ kuweka ukurasa kwenye alamisho</span>';
  $('#marks').querySelectorAll('.mk').forEach(a => a.onclick = ev => { ev.preventDefault(); go(cur, {t:'p', url:marks[a.dataset.i].u}); });
}
$('#star').onclick = () => {
  const e = cur.hist[cur.idx]; if(e.t !== 'p') return;
  const i = marks.findIndex(m => m.u === e.url);
  if(i >= 0) marks.splice(i,1); else marks.push({t:cur.title, u:e.url});
  store.set('marks', marks); drawMarks(); syncBar();
};

/* ===== Menyu na madirisha ===== */
const menu = $('#menu'), dlg = $('#dlg'), panel = $('#panel');
$('#mbtn').onclick = ev => { ev.stopPropagation(); menu.classList.toggle('on'); };
document.addEventListener('click', ev => { if(!menu.contains(ev.target)) menu.classList.remove('on'); });
dlg.addEventListener('click', ev => { if(ev.target === dlg) dlg.classList.remove('on'); });
function openDlg(html){ panel.innerHTML = html; dlg.classList.add('on'); panel.querySelectorAll('[data-close]').forEach(b => b.onclick = () => dlg.classList.remove('on')); }
function listRows(items, rm){
  return items.length ? items.map((x,i) => `<div class="row"><a href="#" data-u="${esc(x.u)}">${esc(x.t)}</a>${rm?`<button data-d="${i}" aria-label="Ondoa">✕</button>`:''}</div>`).join('') : '<div class="msg">Hakuna kitu hapa bado.</div>';
}
function bindRows(rm){
  panel.querySelectorAll('.row a').forEach(a => a.onclick = ev => { ev.preventDefault(); dlg.classList.remove('on'); go(cur, {t:'p', url:a.dataset.u}); });
  if(rm) panel.querySelectorAll('[data-d]').forEach(b => b.onclick = () => rm(+b.dataset.d));
}
menu.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if(!b) return; menu.classList.remove('on');
  const m = b.dataset.m;
  if(m === 'new') newTab();
  if(m === 'full'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
  if(m === 'hist'){
    const show = () => { openDlg(`<h2>Historia</h2>${listRows(history.slice(0,40).map(h => ({t:h.t,u:/^https?:/.test(h.u)?h.u:''})).filter(h=>h.u))}<button class="btn" id="clr">Futa historia</button><button class="btn" data-close>Funga</button>`); bindRows(); $('#clr').onclick = () => { history = []; store.set('hist', history); show(); }; };
    show();
  }
  if(m === 'marks'){
    const show = () => { openDlg(`<h2>Alamisho</h2>${listRows(marks, true)}<button class="btn" data-close>Funga</button>`); bindRows(i => { marks.splice(i,1); store.set('marks', marks); drawMarks(); syncBar(); show(); }); };
    show();
  }
  if(m === 'set'){
    openDlg(`<h2>Mipangilio</h2><p style="color:var(--dim);line-height:1.5">Weka funguo zako mwenyewe ukitaka. Ukiziacha tupu, funguo za kawaida zitatumika.</p>
      <label for="ck">Ufunguo wa kutafuta mtandao</label><input id="ck" value="${esc(store.get('customKey',''))}" placeholder="tvly-..." autocomplete="off">
      <label for="pk">Ufunguo wa picha na video</label><input id="pk" value="${esc(store.get('customPic',''))}" autocomplete="off">
      <button class="btn pri" id="sv">Hifadhi</button><button class="btn" data-close>Funga</button>`);
    $('#sv').onclick = () => { store.set('customKey', $('#ck').value.trim()); store.set('customPic', $('#pk').value.trim()); dlg.classList.remove('on'); };
  }
});

/* ===== Njia za mkato ===== */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if((e.ctrlKey || e.metaKey) && k === 't'){ e.preventDefault(); newTab(); $('#url').focus(); }
  else if((e.ctrlKey || e.metaKey) && k === 'w'){ e.preventDefault(); closeTab(cur); }
  else if((e.ctrlKey || e.metaKey) && k === 'l'){ e.preventDefault(); $('#url').focus(); }
  else if(e.key === 'F5'){ e.preventDefault(); render(cur); }
  else if(e.key === 'Escape'){ dlg.classList.remove('on'); menu.classList.remove('on'); }
});

drawMarks();
newTab();
</script>
</body>
</html>
