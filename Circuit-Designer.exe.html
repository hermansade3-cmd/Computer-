<script>

let P=[],W=[],PR=[],sel=null,tool='sel',run=true,t=0,ws=null,mouse=[0,0],drag=null,hist=[],dt=1e-3,state={};

const fm=(v,u)=>{const a=Math.abs(v);if(a===0)return '0'+u;const s=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']].find(x=>a>=x[0]*.9999)||[1e-12,'p'];return (+(v/s[0]).toPrecision(3))+s[1]+u};

function nets(){const par={},f=k=>par[k]===k?k:(par[k]=f(par[k])),u=(a,b)=>{par[f(a)]=f(b)},pts=new Set();

const root=gnd.length?f(gnd[0]):(()=>{const v=P.find(p=>p.k==='V'||p.k==='AC');return v?f(ND(...pins(v)[0])):null})(),id={},cnt=1;let c=cnt;if(root)id[root]=0;else c=0;

let NET=null,VN=[];
function step(){if(!NET)NET=nets();const N=NET.cnt-1;const els=P.filter(p=>p.k!=='GND');const vs=els.filter(p=>p.k==='V'||p.k==='AC');const M=N+vs.length;if(N<1)return;
let vk=VN.length===N+1?VN.slice():new Array(N+1).fill(0);const gm=1e-12;let x;
for(let it=0;it<40;it++){const A=Array.from({length:M},()=>new Array(M).fill(0)),z=new Array(M).fill(0);
for(let i=0;i<N;i++)A[i][i]+=gm;
const sg=(a,b,gg)=>{if(a>0)A[a-1][a-1]+=gg;if(b>0)A[b-1][b-1]+=gg;if(a>0&&b>0){A[a-1][b-1]-=gg;A[b-1][a-1]-=gg}},si=(a,b,i)=>{if(a>0)z[a-1]-=i;if(b>0)z[b-1]+=i};

else if(p.k==='I')si(a,b,p.v);else if(p.k==='ZD'){const q=gz((vk[a]||0)-(vk[b]||0),p.v);sg(a,b,q[1]);si(a,b,q[0]-q[1]*q[2])}else if(p.k==='D'||p.k==='LED'){const nv=(p.k==='LED'?2:1)*.02585,Is=p.k==='LED'?1e-18:1e-12,vd=Math.min((vk[a]||0)-(vk[b]||0),p.k==='LED'?3:.9),e=Math.exp(vd/nv),gg=Is/nv*e+1e-12;sg(a,b,gg);si(a,b,Is*(e-1)-gg*vd)}
else if(p.k==='V'||p.k==='AC'){const r=N+k++,V=p.k==='V'?p.v:p.v*Math.sin(2*Math.PI*(p.f||50)*t);if(b>0){A[b-1][r]+=1;A[r][b-1]+=1}if(a>0){A[a-1][r]-=1;A[r][a-1]-=1}z[r]=V}});
x=solve(A,z);const nx=[0,...x.slice(0,N)];let d=0;for(let i=0;i<=N;i++)d=Math.max(d,Math.abs(nx[i]-(vk[i]||0)));vk=nx;if(d<1e-7)break}
VN=vk;let k=0;els.forEach(p=>{if(multiD(p,vk,NET,state[p.id]||(state[p.id]={v:0,i:0})))return;const[pa,pb]=pins(p),va=vk[NET.id(ND(...pa))]||0,vb=vk[NET.id(ND(...pb))]||0,S=state[p.id],v=va-vb;let i=0;
if(p.k==='R')i=v/Math.max(p.v,1e-6);else if(p.k==='SW')i=v*(p.on?1e3:1e-9);else if(p.k==='C'){i=p.v/dt*(v-S.v);S.v=v}else if(p.k==='L'){i=dt/p.v*v+S.i;S.i=i}else if(p.k==='I')i=p.v;
else if(p.k==='ZD')i=gz(v,p.v)[0];else if(p.k==='D'||p.k==='LED'){const nv=(p.k==='LED'?2:1)*.02585,Is=p.k==='LED'?1e-18:1e-12;i=Is*(Math.exp(Math.min(v,p.k==='LED'?3:.9)/nv)-1)}else{i=-x[N+k++]}
S.i=p.k==='L'?S.i:i;S.cur=i;S.dv=v});t+=dt;PR.forEach((q,j)=>{const h=(state['p'+j]=state['p'+j]||[]);h.push(VN[NET.id(ND(...q))]||0);if(h.length>600)h.shift()})}
// ---------- Drawing ----------
const vc=v=>{const a=Math.min(1,Math.abs(v)/12);return v>=0?`rgb(${60+190*a|0},${200-100*a|0},${80})`:`rgb(80,${160-60*a|0},${200+50*a|0})`};
function sym(p){const c=TY[p.k].c;g.strokeStyle=c;g.fillStyle=c;g.lineWidth=2;g.beginPath();const S=state[p.id]||{cur:0};
if(p.k==='GND'){g.moveTo(0,0);g.lineTo(0,10);g.moveTo(-14,10);g.lineTo(14,10);g.moveTo(-9,15);g.lineTo(9,15);g.moveTo(-4,20);g.lineTo(4,20);g.stroke();return}
if(p.k==='NPN'||p.k==='PNP'){g.moveTo(-40,0);g.lineTo(-8,0);g.moveTo(-8,-18);g.lineTo(-8,18);g.moveTo(-8,-8);g.lineTo(20,-24);g.lineTo(20,-40);g.moveTo(-8,8);g.lineTo(20,24);g.lineTo(20,40);g.stroke();g.beginPath();const u=p.k==='NPN'?1:-1;g.moveTo(20,24);g.lineTo(u>0?8:6,u>0?25:14);g.lineTo(u>0?14:12,u>0?14:25);if(u<0){g.moveTo(-1,12);g.lineTo(6,14);g.lineTo(2,20)}g.fill();g.beginPath();g.arc(2,0,26,0,7);g.globalAlpha=.25;g.stroke();g.globalAlpha=1;return}
if(p.k==='OA'){g.moveTo(-40,-20);g.lineTo(-20,-20);g.moveTo(-40,20);g.lineTo(-20,20);g.moveTo(20,0);g.lineTo(40,0);g.moveTo(-20,-36);g.lineTo(-20,36);g.lineTo(24,0);g.closePath();g.stroke();g.font='bold 13px sans-serif';g.textAlign='center';g.fillText('+',-14,-16);g.fillText('−',-14,24);return}

if(p.k==='R'){g.moveTo(-20,0);for(let i=0;i<6;i++)g.lineTo(-20+i*6.7+3.3,i%2?7:-7);g.lineTo(20,0)}
else if(p.k==='C'){g.moveTo(-20,0);g.lineTo(-4,0);g.moveTo(-4,-12);g.lineTo(-4,12);g.moveTo(4,-12);g.lineTo(4,12);g.moveTo(4,0);g.lineTo(20,0)}
else if(p.k==='L'){for(let i=0;i<4;i++)g.arc(-15+i*10,0,5,Math.PI,0)}
else if(p.k==='SW'){g.moveTo(-20,0);g.lineTo(p.on?20:15,p.on?0:-14)}
else if(p.k==='D'||p.k==='LED'||p.k==='ZD'){if(p.k==='ZD'){g.moveTo(10,-10);g.lineTo(15,-14);g.moveTo(10,10);g.lineTo(5,14)}g.moveTo(-10,-10);g.lineTo(-10,10);g.lineTo(10,0);g.closePath();g.moveTo(10,-10);g.lineTo(10,10);g.moveTo(-20,0);g.lineTo(-10,0);g.moveTo(10,0);g.lineTo(20,0);
if(p.k==='LED'){const b=Math.min(1,Math.max(0,S.cur||0)/.015);if(b>.02){g.stroke();g.beginPath();const gr=g.createRadialGradient(0,0,2,0,0,36);gr.addColorStop(0,`rgba(255,80,60,${.9*b})`);gr.addColorStop(1,'rgba(255,60,40,0)');g.fillStyle=gr;g.arc(0,0,36,0,7);g.fill();g.beginPath()}g.moveTo(-2,-14);g.lineTo(6,-22);g.moveTo(4,-12);g.lineTo(12,-20)}}
else{g.moveTo(16,0);g.arc(0,0,16,0,7);if(p.k==='V'){g.moveTo(-16,0);g.lineTo(-26,0)}g.stroke();g.beginPath();g.font='bold 14px sans-serif';g.textAlign='center';if(p.k==='V'){g.fillText('+',7,5);g.fillText('−',-8,5)}else if(p.k==='AC'){g.moveTo(-10,0);g.bezierCurveTo(-5,-12,-1,-12,0,0);g.bezierCurveTo(1,12,5,12,10,0)}else{g.moveTo(-8,0);g.lineTo(8,0);g.lineTo(3,-4);g.moveTo(8,0);g.lineTo(3,4)}}
g.stroke()}
function draw(){const r=cv.getBoundingClientRect();if(cv.width!==r.width|0||cv.height!==r.height|0){cv.width=r.width;cv.height=r.height}g.clearRect(0,0,cv.width,cv.height);g.fillStyle='#1d3150';for(let x=0;x<cv.width;x+=G)for(let y=0;y<cv.height;y+=G)g.fillRect(x,y,1,1);
W.forEach(w=>{const v=NET?VN[NET.id(ND(w[0],w[1]))]||0:0;g.strokeStyle=run&&NET?vc(v):'#4c8';g.lineWidth=2.5;g.beginPath();g.moveTo(w[0],w[1]);g.lineTo(w[2],w[3]);g.stroke()});
P.forEach(p=>{g.save();g.translate(p.x,p.y);g.rotate(p.r*Math.PI/2);if(p===sel){g.fillStyle='#ffffff14';g.fillRect(-46,-24,92,48)}sym(p);g.restore();
g.fillStyle='#d8f0e0';g.font='11px sans-serif';g.textAlign='center';const lbl=p.k==='GND'?'GND':p.k==='SW'?(p.on?'ON':'OFF'):p.k==='D'||p.k==='LED'?p.k:fm(p.v,TY[p.k].u)+(p.k==='AC'?'@'+(p.f||50)+'Hz':'');g.fillText(lbl,p.x,p.y+(p.r%2?-0:-24)-(p.r%2?(-34):0));
const S=state[p.id];if(S&&run&&p.k!=='GND'){g.fillStyle='#ffd166';g.fillText(fm(S.cur||0,'A'),p.x+(p.r%2?30:0),p.y+(p.r%2?4:30))}});
pins({k:'x',x:0,y:0,r:0});P.forEach(p=>pins(p).forEach(a=>{g.fillStyle='#fff';g.fillRect(a[0]-2,a[1]-2,4,4)}));
PR.forEach((q,j)=>{g.strokeStyle='#ff0';g.beginPath();g.arc(q[0],q[1],6,0,7);g.stroke();g.fillStyle='#ff0';g.font='bold 11px sans-serif';g.fillText('P'+(j+1)+' '+(NET&&VN.length?fm(VN[NET.id(ND(...q))]||0,'V'):''),q[0]+10,q[1]-8)});

scope()}

// ---------- UI ----------
function tools(){const T=$('#tools');T.innerHTML='';[['sel','↖ Chagua'],['wire','〰 Waya'],['probe','🔎 Probe'],...Object.keys(TY).map(k=>[k,TY[k].n])].forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.className=tool===k?'on':'';b.onclick=()=>{tool=k;ws=null;tools()};T.append(b)})}
const snap=v=>Math.round(v/G)*G,pos=e=>{const r=cv.getBoundingClientRect();return[snap(e.clientX-r.left),snap(e.clientY-r.top)]};
const hit=(x,y)=>P.find(p=>Math.hypot(p.x-x,p.y-y)<(p.k==='GND'?16:28));
let UH=[],RH=[];const ch=(nh)=>{NET=null;VN=[];state={};t=0;PR.forEach((_,j)=>state['p'+j]=[]);auto();if(nh!==1){UH.push(dump());if(UH.length>60)UH.shift();RH=[]}};
const auto=()=>{localStorage.setItem('cd_auto',JSON.stringify({P,W,PR}))};
let uid=1;cv.onmousedown=e=>{const[x,y]=pos(e);if(e.button===2){ws=null;tool='sel';tools();return}
if(tool==='sel'){const p=hit(x,y);sel=p||null;if(p)drag={p,ox:x-p.x,oy:y-p.y,moved:0};info()}
else if(tool==='wire'){if(!ws)ws=[x,y];else{if(ws[1]!==ws[1]||ws[0]!==x)if(ws[0]!==x)W.push([ws[0],ws[1],x,ws[1]]);if(ws[1]!==y)W.push([x,ws[1],x,y]);ws=[x,y];ch()}}
else if(tool==='probe'){PR.push([x,y]);if(PR.length>4)PR.shift();ch()}
else{const p={id:uid++,k:tool,x,y,r:0,v:TY[tool].v,f:TY[tool].f,on:1};P.push(p);sel=p;tool='sel';tools();ch();info()}};
cv.onmousemove=e=>{mouse=pos(e);if(NET&&VN.length){const id=NET.id(ND(...mouse));if(id!==undefined&&isFinite(VN[id]))$('#st').textContent='🔎 Voltage kwenye ('+mouse+') = '+fm(VN[id],'V')}if(drag){const[x,y]=mouse;if(x-drag.ox!==drag.p.x||y-drag.oy!==drag.p.y){drag.p.x=x-drag.ox;drag.p.y=y-drag.oy;drag.moved=1;NET=null}}};
onmouseup=()=>{if(drag){if(drag.moved)ch();else if(drag.p.k==='SW'){drag.p.on=!drag.p.on;info()}drag=null}};
cv.ondblclick=e=>{const p=hit(...pos(e));if(p&&!['GND','D','LED','SW'].includes(p.k)){const s=prompt(TY[p.k].n+' ('+TY[p.k].u+'): mf. 4.7k, 100u, 9',fm(p.v,''));const v=parse(s);if(!isNaN(v)){p.v=v;ch()}if(p.k==='AC'){const f=parse(prompt('Frequency (Hz)',p.f||50));if(f>0)p.f=f}info()}else if(!p){const q=pos(e),i=W.findIndex(w=>(w[0]===w[2]&&w[0]===q[0]&&q[1]>=Math.min(w[1],w[3])&&q[1]<=Math.max(w[1],w[3]))||(w[1]===w[3]&&w[1]===q[1]&&q[0]>=Math.min(w[0],w[2])&&q[0]<=Math.max(w[0],w[2])));if(i>=0){W.splice(i,1);ch()}}};
cv.oncontextmenu=e=>e.preventDefault();
onkeydown=e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.ctrlKey&&e.key==='z'){$('#un').click();return}if(e.ctrlKey&&e.key==='y'){$('#rd').click();return}if(e.key==='Escape'){ws=null;tool='sel';tools()}else if(e.key==='r'&&sel){sel.r=(sel.r+1)%4;ch()}else if((e.key==='Delete'||e.key==='Backspace')&&sel){P=P.filter(p=>p!==sel);sel=null;ch();info()}else if(e.key===' '){e.preventDefault();if(sel&&sel.k==='SW'){sel.on=!sel.on;info()}else $('#run').click()}else if(e.key==='w'){tool='wire';tools()}};
function info(){const p=sel;$('#nfo').textContent=p?`${TY[p.k].n}\nThamani: ${p.k==='SW'?(p.on?'Imefungwa':'Wazi'):fm(p.v,TY[p.k].u)}\n`+(state[p.id]?`I = ${fm(state[p.id].cur||0,'A')}\nV = ${fm(state[p.id].dv||0,'V')}\nP = ${fm(Math.abs((state[p.id].cur||0)*(state[p.id].dv||0)),'W')}`:''):`Vipengele: ${P.length}  Waya: ${W.length}\nNodi: ${NET?NET.cnt:0}\nMuda: ${t.toFixed(3)} s`;}
$('#run').onclick=()=>{run=!run;$('#run').textContent=run?'⏸ Pumzika':'▶ Endesha';$('#run').className=run?'on':''};$('#rst').onclick=()=>{state={};VN=[];t=0;PR.forEach((_,j)=>state['p'+j]=[])};$('#dt').onchange=e=>dt=+e.target.value;
$('#clr').onclick=()=>{if(confirm('Futa mzunguko wote?')){P=[];W=[];PR=[];sel=null;ch()}};
const dump=()=>JSON.stringify({P,W,PR});const loadJ=(s,nh)=>{const o=JSON.parse(s);P=o.P;W=o.W;PR=o.PR||[];uid=Math.max(0,...P.map(p=>p.id))+1;sel=null;ch(nh)};
$('#un').onclick=()=>{if(UH.length>1){RH.push(UH.pop());loadJ(UH[UH.length-1],1)}};$('#rd').onclick=()=>{if(RH.length){const x=RH.pop();UH.push(x);loadJ(x,1)}};
$('#nl').onclick=()=>{if(!NET)NET=nets();const nm={R:'R',C:'C',L:'L',V:'V',AC:'V',I:'I',SW:'R',D:'D',LED:'D',ZD:'D',NPN:'Q',PNP:'Q',OA:'X'};let o='* Sade Circuit Designer\n';P.filter(p=>p.k!=='GND').forEach(p=>{const n=pins(p).map(a=>NET.id(ND(...a))).join(' ');o+=(nm[p.k]||'X')+p.id+' '+n+' '+(p.k==='AC'?'SIN(0 '+p.v+' '+(p.f||50)+')':p.k==='SW'?(p.on?'0.001':'1G'):p.k==='NPN'?'NPN':p.k==='PNP'?'PNP':p.k==='OA'?'OPAMP':['LED','D','ZD'].includes(p.k)?'DMOD':p.v)+'\n'});o+='.tran 1m 1\n.end\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o]));a.download='mzunguko.cir';a.click()};
$('#sv').onclick=()=>{localStorage.setItem('cd_save',dump());$('#st').textContent='Imehifadhiwa ✔'};$('#ld').onclick=()=>{const s=localStorage.getItem('cd_save');s?loadJ(s):alert('Hakuna iliyohifadhiwa')};
$('#ex2').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()]));a.download='mzunguko.json';a.click()};$('#ps').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL();a.download='mzunguko.png';a.click()};
const mk=(k,x,y,r,v,f)=>({id:uid++,k,x,y,r,v:v??TY[k].v,f,on:1});
const EXS={'LED + Resistor':()=>({P:[mk('V',120,200,3,9),mk('R',200,160,0,330),mk('LED',280,200,1),mk('GND',200,240,0)],W:[[120,160,160,160],[240,160,280,160],[280,240,120,240]],PR:[[240,160]]}),
'RC Charging':()=>({P:[mk('V',120,200,3,5),mk('SW',200,160,0),mk('R',320,160,0,1000),mk('C',400,200,1,1e-3),mk('GND',260,240,0)],W:[[120,160,160,160],[240,160,280,160],[360,160,400,160],[400,240,120,240]],PR:[[400,160]]}),
'Voltage Divider':()=>({P:[mk('V',120,200,3,12),mk('R',200,160,0,10000),mk('R',280,200,1,5000),mk('GND',200,240,0)],W:[[120,160,160,160],[240,160,280,160],[280,240,120,240]],PR:[[280,160]]}),
'Half-wave Rectifier':()=>({P:[mk('AC',120,200,3,10,50),mk('D',220,160,0),mk('R',300,200,1,1000),mk('GND',200,240,0)],W:[[120,160,180,160],[260,160,300,160],[300,240,120,240]],PR:[[120,160],[300,160]]}),
'Transistor Switch':()=>({P:[mk('V',120,200,3,9),mk('R',200,220,0,47000),mk('NPN',320,220,0,100),mk('R',260,100,0,330),mk('LED',340,140,1),mk('GND',340,300,0)],W:[[160,220,160,160],[120,160,160,160],[240,220,280,220],[120,160,120,100],[120,100,220,100],[300,100,340,100],[340,260,340,300],[120,240,120,300],[120,300,340,300]],PR:[[340,180]]}),
'Inverting Op-Amp':()=>({P:[mk('AC',100,240,3,1,100),mk('R',180,200,0,1000),mk('OA',300,200,0,12),mk('R',300,140,0,10000),mk('GND',260,180,0),mk('GND',100,280,0)],W:[[100,200,140,200],[220,200,220,220],[220,220,260,220],[260,140,220,140],[220,140,220,200],[340,140,340,200]],PR:[[100,200],[340,200]]}),
'Zener Regulator':()=>({P:[mk('V',120,200,3,12),mk('R',200,160,0,330),mk('ZD',280,200,3,5.1),mk('R',360,200,1,1000),mk('GND',200,240,0)],W:[[120,160,160,160],[240,160,280,160],[280,240,120,240],[280,160,360,160],[360,240,280,240]],PR:[[280,160]]}),
'RLC Series':()=>({P:[mk('AC',120,200,3,5,159),mk('R',200,160,0,10),mk('L',320,160,0,.01),mk('C',440,200,1,1e-4),mk('GND',200,240,0)],W:[[120,160,160,160],[240,160,280,160],[360,160,440,160],[440,240,120,240]],PR:[[440,160],[120,160]]})};
Object.keys(EXS).forEach(k=>$('#ex').add(new Option(k,k)));$('#ex').onchange=e=>{if(e.target.value){loadJ(JSON.stringify(EXS[e.target.value]()));e.target.value=''}};
let fr=0;(function loop(){if(run&&P.length)try{for(let i=0;i<8;i++)step()}catch(x){$('#st').textContent='Kosa la simulation: '+x.message}if(++fr%6===0)info();draw();requestAnimationFrame(loop)})();
try{const a=localStorage.getItem('cd_auto');a&&JSON.parse(a).P.length?loadJ(a):loadJ(JSON.stringify(EXS['LED + Resistor']()))}catch(e){loadJ(JSON.stringify(EXS['LED + Resistor']()))}
tools();
</script></body></html>
