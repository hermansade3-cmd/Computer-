<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hash Checker</title>
<script>try{var S=JSON.parse(localStorage.getItem('sadevfs2')).set;document.documentElement.dataset.t=S.dark?'d':'l';document.documentElement.style.setProperty('--ac',S.acc||'#0067c0')}catch(e){}</script>
<style>:root{--ac:#0067c0;--bg:#f3f5f9;--fg:#141824;--cd:#fff;--bd:#d5dae3;--mu:#6b7385}[data-t=d]{--bg:#1b1f2a;--fg:#e8ebf2;--cd:#262b38;--bd:#394055;--mu:#9aa3b8}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:13px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;outline:0}button{cursor:pointer}button:hover,input:focus,select:focus{border-color:var(--ac)}.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb{display:flex;gap:6px;padding:6px 8px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}.sb{padding:3px 10px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);background:var(--cd)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fl{flex:1;min-height:0;overflow:auto}.mu{color:var(--mu)}.cv{padding:14px;max-width:700px;margin:auto;width:100%}.dz{border:2px dashed var(--bd);border-radius:10px;padding:22px;text-align:center;cursor:pointer;color:var(--mu)}.dz.on{border-color:var(--ac)}.rw{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.rw b{width:70px}.rw code{flex:1;font:12px Consolas,monospace;word-break:break-all;user-select:text}textarea{width:100%;height:70px;margin-top:10px;resize:vertical}</style></head><body><div class="fl cv"><div class=dz id=dz>📂 Buruta faili hapa au gusa kuchagua<input type=file id=fi hidden></div><textarea id=tx placeholder="…au andika maandishi hapa kupata hash yake"></textarea><div id=rs style="margin-top:12px"></div><input id=cmp placeholder="Bandika hash unayotarajia ili kulinganisha" style="width:100%;margin-top:10px"><div id=ok style="padding:8px 0;font-weight:600"></div></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const T=new Uint32Array(256).map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return((c^-1)>>>0).toString(16).padStart(8,'0')};
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');let H={};
async function run(u8,label){$('#rs').innerHTML='<p class=mu>Inahesabu…</p>';H={};const o=[];for(const[n,a]of[['SHA-1','SHA-1'],['SHA-256','SHA-256'],['SHA-384','SHA-384'],['SHA-512','SHA-512']])H[n]=hx(await crypto.subtle.digest(a,u8));H.CRC32=crc(u8);$('#rs').innerHTML=(label?'<p><b>'+label.replace(/</g,'&lt;')+'</b> · '+u8.length.toLocaleString()+' byte</p>':'')+Object.entries(H).map(([k,v])=>`<div class=rw><b>${k}</b><code>${v}</code><button data-v="${v}">📋</button></div>`).join('');$$('#rs button').forEach(b=>b.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(b.dataset.v));chk()}
function chk(){const v=$('#cmp').value.trim().toLowerCase().replace(/\s/g,'');if(!v||!Object.keys(H).length){$('#ok').textContent='';return}const m=Object.entries(H).find(([k,x])=>x==v);$('#ok').style.color=m?'#107c10':'#c42b1c';$('#ok').textContent=m?'✔ Inalingana ('+m[0]+')':'✘ Haifanani na hash yoyote'}
async function file(f){if(!f)return;if(f.size>3e8)return alert('Faili ni kubwa sana (zaidi ya 300 MB).');$('#tx').value='';run(new Uint8Array(await f.arrayBuffer()),f.name)}
$('#dz').onclick=()=>$('#fi').click();$('#fi').onchange=e=>file(e.target.files[0]);$('#dz').ondragover=e=>{e.preventDefault();$('#dz').classList.add('on')};$('#dz').ondragleave=()=>$('#dz').classList.remove('on');$('#dz').ondrop=e=>{e.preventDefault();$('#dz').classList.remove('on');file(e.dataTransfer.files[0])};
$('#tx').oninput=()=>{const v=$('#tx').value;v?run(new TextEncoder().encode(v),'Maandishi'):($('#rs').innerHTML='',H={},chk())};$('#cmp').oninput=chk;</script></body></html>
