<!DOCTYPE html><html lang="sw"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code</title><style>:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--ac:#2563eb;--ac2:#7c3aed;--bd:#e3e7f0;--hv:#e8efff}

*{box-sizing:border-box;margin:0}body{font:14px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);height:100vh;display:flex;flex-direction:column;color:var(--tx)}
.t{display:flex;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}.t b{flex:1;min-width:90px;font-size:15px;font-weight:600}
button,label.b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:500;box-shadow:0 2px 8px #2563eb40;transition:.15s}button:hover,label.b:hover{transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:scale(.97)}
input,select,textarea{padding:8px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2563eb30}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:16px}.cd{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001}.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px}.gr b{display:block;font-size:20px;margin-top:6px}.pg{flex:1;overflow:auto;padding:12px}.r{display:flex;gap:10px;align-items:center;margin-bottom:8px}small{color:var(--mut)}#o::after{display:none}#o{display:inline-block;background:#fff;padding:16px;margin-top:14px}/*px*/:root{--ac:#6366f1;--ac2:#ec4899;--ac3:#06b6d4}
body::before{content:'';position:fixed;inset:-25%;z-index:-1;background:conic-gradient(from 0deg,#6366f155,#ec489944,#06b6d455,#6366f155);filter:blur(90px);animation:sp 28s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.t{background:color-mix(in srgb,var(--card) 55%,transparent)!important;backdrop-filter:blur(24px) saturate(1.8);border-bottom:1px solid #ffffff30}
.t b{font-size:17px;font-weight:700}.gt{background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac3));-webkit-background-clip:text;background-clip:text;color:transparent}input[type=checkbox],input[type=range]{accent-color:var(--ac)}
.cd:not([style*=background]),#g>div:not([style*=background]),#l>a,#l>div:not([style*=background]),#w>div{background:color-mix(in srgb,var(--card) 62%,transparent)!important;backdrop-filter:blur(18px) saturate(1.6);border:1px solid #ffffff40!important;box-shadow:0 8px 32px #1e1b4b22,inset 0 1px 0 #ffffff60!important}
.cd,#g>div,#l>a,#l>div,#w>div,.gr>div{position:relative;overflow:hidden}
.cd::after,#g>div::after,#l>a::after,#l>div::after,#w>div::after,.gr>div::after{content:'';position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),#ffffff38,transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.cd:hover::after,#g>div:hover::after,#l>a:hover::after,#l>div:hover::after,#w>div:hover::after,.gr>div:hover::after{opacity:1}
#g div.td{background:linear-gradient(135deg,var(--ac),var(--ac2))!important}#o.cd{background:#fff!important;backdrop-filter:none}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.97)}}
.pg .cd,#l>a,#l>div,#g>div:not(.cd){animation:in .5s cubic-bezier(.2,.9,.3,1.2) backwards}
:is(.pg .cd,#l>a,#l>div,#g>div):nth-child(2){animation-delay:.06s}:is(.pg .cd,#l>a,#l>div,#g>div):nth-child(3){animation-delay:.12s}:is(.pg .cd,#l>a,#l>div,#g>div):nth-child(n+4){animation-delay:.18s}
button,label.b{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--ac),var(--ac2),var(--ac3));background-size:200% 200%;animation:bg 6s ease infinite;box-shadow:0 6px 20px #6366f155,inset 0 1px 0 #fff5}
@keyframes bg{50%{background-position:100% 50%}}button:hover,label.b:hover{box-shadow:0 10px 28px #ec489966}
.rp{position:absolute;border-radius:50%;background:#fff7;transform:scale(0);animation:rp .6s linear;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
input,select,textarea{background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(8px)}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px #6366f130,0 0 24px #6366f140}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--ac),var(--ac2))}
h1{filter:drop-shadow(0 0 18px #6366f166)}#o .e{filter:drop-shadow(0 8px 24px #0006);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
#g img:hover{filter:saturate(1.3) brightness(1.05);box-shadow:0 12px 30px #6366f155}video,#m{box-shadow:0 0 0 1px #fff3,0 20px 60px #6366f166}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important}}</style>
<div class=t><b>🔳 QR Code</b></div><div class=pg><input id=q placeholder="Andika kiungo au maandishi" style="width:100%"><br><br><button id=g>Tengeneza</button> <button id=d>⬇ Pakua PNG</button><br><div id=o class=cd></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function mk(){if(typeof QRCode=='undefined')return $('#o').textContent='Maktaba ya QR haijapakiwa — unganisha mtandao.';$('#o').innerHTML='';new QRCode($('#o'),{text:$('#q').value||' ',width:220,height:220})}$('#g').onclick=mk;$('#q').oninput=mk;
$('#d').onclick=()=>{const c=$('#o canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qr.png';a.click()};</script><script>/*px*/document.querySelectorAll(".t b").forEach(b=>{const t=b.textContent,i=t.indexOf(" ");if(i>0&&/^\P{ASCII}/u.test(t))b.innerHTML="<span>"+t.slice(0,i)+"</span> <span class=gt>"+t.slice(i+1)+"</span>"});addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.cd,#g>div,#l>a,#l>div,#w>div,.gr>div');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}});
addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button,label.b');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='rp';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.append(s);setTimeout(()=>s.remove(),600)});</script>
