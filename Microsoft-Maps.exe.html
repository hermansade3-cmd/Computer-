<!DOCTYPE html><html lang="sw"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramani</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><style>:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--ac:#2563eb;--ac2:#7c3aed;--bd:#e3e7f0;--hv:#e8efff}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2d;--tx:#e8ecf5;--mut:#9aa3b8;--bd:#2a3145;--hv:#26304a}}
*{box-sizing:border-box;margin:0}body{font:14px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);height:100vh;display:flex;flex-direction:column;color:var(--tx)}
.t{display:flex;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}.t b{flex:1;min-width:90px;font-size:15px;font-weight:600}
button,label.b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:500;box-shadow:0 2px 8px #2563eb40;transition:.15s}button:hover,label.b:hover{transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:scale(.97)}
input,select,textarea{padding:8px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2563eb30}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:16px}#m{flex:1;margin:10px;border-radius:16px;box-shadow:0 4px 20px #0003}.leaflet-container{border-radius:16px}</style>
<div class=t><b>🗺️ Ramani (Maps)</b><input id=q placeholder="Tafuta mahali (mf. Arusha)" style="flex:2"><button id=s>🔍 Tafuta</button><button id=h>📍 Mimi</button></div><div id=m></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s),M=L.map('m').setView([-6.79,39.21],12);let P;
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(M);
function pin(la,lo,t,z){P&&P.remove();P=L.marker([la,lo]).addTo(M).bindPopup(t).openPopup();M.setView([la,lo],z||14)}
$('#s').onclick=async()=>{const q=$('#q').value.trim();if(!q)return;try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();r[0]?pin(+r[0].lat,+r[0].lon,r[0].display_name):alert('Mahali halijapatikana')}catch(e){alert('Imeshindwa — angalia mtandao')}};
$('#q').onkeydown=e=>e.key=='Enter'&&$('#s').click();
$('#h').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>pin(p.coords.latitude,p.coords.longitude,'Ulipo hapa',15),()=>alert('Ruhusa ya location imekataliwa')):alert('Haipatikani');
</script>
