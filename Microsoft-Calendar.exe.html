<!DOCTYPE html><html lang="sw"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalenda</title><style>:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--ac:#2563eb;--ac2:#7c3aed;--bd:#e3e7f0;--hv:#e8efff}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2d;--tx:#e8ecf5;--mut:#9aa3b8;--bd:#2a3145;--hv:#26304a}}
*{box-sizing:border-box;margin:0}body{font:14px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);height:100vh;display:flex;flex-direction:column;color:var(--tx)}
.t{display:flex;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}.t b{flex:1;min-width:90px;font-size:15px;font-weight:600}
button,label.b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:500;box-shadow:0 2px 8px #2563eb40;transition:.15s}button:hover,label.b:hover{transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:scale(.97)}
input,select,textarea{padding:8px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2563eb30}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:16px}
#g{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:6px;grid-auto-rows:minmax(48px,1fr)}#g b{text-align:center;font-size:12px;color:var(--mut);grid-auto-rows:auto}#g div{background:var(--card);border-radius:14px;padding:8px;cursor:pointer;border:1px solid var(--bd);transition:.15s}#g div:hover{background:var(--hv);transform:translateY(-2px)}#g .td{background:linear-gradient(135deg,var(--ac),var(--ac2))!important;color:#fff}.td small{color:#fff}small{display:block;font-size:11px;color:var(--ac)}</style>
<div class=t><button id=p>◀</button><b id=h style="text-align:center"></b><button id=n>▶</button></div><div id=g></div>
<script>
const $=s=>document.querySelector(s);let d=new Date(),E={};try{E=JSON.parse(localStorage.sadecal||'{}')}catch(_){}
function draw(){const y=d.getFullYear(),m=d.getMonth(),t=new Date(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();$('#h').textContent=d.toLocaleDateString('sw-TZ',{month:'long',year:'numeric'});
let h=['Jpi','Jtt','Jne','Jtn','Alh','Ijm','Jmo'].map(x=>'<b>'+x+'</b>').join('')+'<i></i>'.repeat(f);
for(let i=1;i<=n;i++){const k=y+'-'+(m+1)+'-'+i;h+='<div data-k="'+k+'"'+(i==t.getDate()&&m==t.getMonth()&&y==t.getFullYear()?' class=td':'')+'>'+i+(E[k]?'<small>📌 '+E[k].length+'</small>':'')+'</div>'}$('#g').innerHTML=h}
$('#g').onclick=e=>{const c=e.target.closest('[data-k]');if(!c)return;const k=c.dataset.k;const t=prompt('Tukio la '+k+(E[k]?'\n\n'+E[k].join('\n'):'')+'\n\n(andika tukio jipya, au "futa" kufuta yote)');if(!t)return;t=='futa'?delete E[k]:(E[k]=E[k]||[]).push(t);localStorage.sadecal=JSON.stringify(E);draw()};
$('#p').onclick=()=>{d.setMonth(d.getMonth()-1);draw()};$('#n').onclick=()=>{d.setMonth(d.getMonth()+1);draw()};draw();
</script>
