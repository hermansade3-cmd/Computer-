<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Studio Code</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1e1e1e;color:#ccc;font:13px Segoe UI,system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}#main{flex:1;display:flex;min-height:0}
#ab{width:48px;background:#333;display:flex;flex-direction:column;align-items:center;padding-top:6px}#ab div{width:48px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;opacity:.6;border-left:2px solid transparent}#ab div.on,#ab div:hover{opacity:1;border-color:#fff}
#sb{width:230px;background:#252526;display:flex;flex-direction:column;min-width:0}#sb h4{margin:0;padding:10px 14px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:500}
#tree{flex:1;overflow:auto}.f{padding:3px 14px;cursor:pointer;display:flex;gap:6px;white-space:nowrap}.f:hover{background:#2a2d2e}.f.on{background:#37373d}.f b{margin-left:auto;font-weight:400;opacity:0;cursor:pointer}.f:hover b{opacity:.8}
#ed{flex:1;display:flex;flex-direction:column;min-width:0}#tabs{display:flex;background:#252526;overflow-x:auto;min-height:35px}.t{padding:8px 12px;background:#2d2d2d;border-right:1px solid #252526;cursor:pointer;display:flex;gap:8px;white-space:nowrap}.t.on{background:#1e1e1e;color:#fff;border-top:1px solid #0078d4}.t i{font-style:normal;opacity:.6}.t i:hover{opacity:1}
#wrap{flex:1;display:flex;position:relative;min-height:0}#gut,#code{font:14px/21px Consolas,monospace;padding:8px 0}#gut{width:46px;text-align:right;color:#858585;padding-right:10px;overflow:hidden;white-space:pre;user-select:none}
#hl,#code{position:absolute;left:46px;right:0;top:0;bottom:0;margin:0;padding:8px 10px;font:14px/21px Consolas,monospace;white-space:pre;overflow:auto;tab-size:2;border:0;outline:0}
#hl{pointer-events:none;overflow:hidden;color:#d4d4d4}#code{background:transparent;color:transparent;caret-color:#fff;resize:none}#code::selection{background:#264f78;color:transparent}
.k{color:#569cd6}.s{color:#ce9178}.c{color:#6a9955}.n{color:#b5cea8}.f2{color:#dcdcaa}.t2{color:#4ec9b0}
#term{height:170px;background:#1e1e1e;border-top:1px solid #444;display:none;flex-direction:column}#term.on{display:flex}#to{flex:1;overflow:auto;padding:6px 10px;font:13px Consolas,monospace;white-space:pre-wrap}#ti{background:#1e1e1e;color:#fff;border:0;border-top:1px solid #333;padding:6px 10px;font:13px Consolas,monospace;outline:0}
#st{height:22px;background:#007acc;color:#fff;display:flex;gap:16px;padding:0 10px;align-items:center;font-size:12px}#st span{cursor:pointer}
#find{display:none;position:absolute;right:20px;top:4px;background:#252526;border:1px solid #444;padding:6px;z-index:5;gap:4px}#find input{background:#3c3c3c;color:#fff;border:1px solid #555;padding:3px 6px;width:130px}
#pal{position:fixed;top:40px;left:50%;transform:translateX(-50%);width:420px;background:#252526;border:1px solid #454545;display:none;z-index:9;box-shadow:0 4px 20px #000a}#pal input{width:100%;background:#3c3c3c;color:#fff;border:0;padding:8px;outline:0}#pal div{padding:6px 10px;cursor:pointer}#pal div:hover,#pal div.on{background:#04395e}
#pv{display:none;flex:1;border:0;background:#fff}
button{background:#0e639c;color:#fff;border:0;padding:4px 10px;cursor:pointer;margin:2px}
</style></head><body><div id="app"><div id="main">
<div id="ab"><div class="on" data-a="ex" title="Explorer">📄</div><div data-a="se" title="Tafuta (Ctrl+Shift+F)">🔍</div><div data-a="run" title="Run (F5)">▶️</div><div data-a="tm" title="Terminal (Ctrl+`)">⌨️</div><div data-a="th" title="Theme" style="margin-top:auto">🎨</div></div>
<div id="sb"><h4 id="sbh">Explorer</h4><div id="tree"></div><div id="sbx" style="padding:8px;display:none"></div></div>
<div id="ed"><div id="tabs"></div><div id="wrap"><div id="gut"></div><pre id="hl"></pre><textarea id="code" spellcheck="false" autocapitalize="off"></textarea><iframe id="pv"></iframe>
<div id="find" style="display:none"><input id="fi" placeholder="Tafuta"><input id="fr" placeholder="Badilisha"><button id="fn">▶</button><button id="fa">Zote</button></div></div>
<div id="term"><div id="to"></div><input id="ti" placeholder="$ amri: help, ls, cat, new, rm, run, clear, date, echo"></div></div></div>
<div id="st"><span id="sp">Ln 1, Col 1</span><span id="sl">Plain</span><span>UTF-8</span><span id="ss">Spaces: 2</span><span style="margin-left:auto" id="sm">Tayari</span></div></div>
<div id="pal"><input id="pi" placeholder="Andika amri…"><div id="pl"></div></div>
<script>
const $=s=>document.querySelector(s);let FS=JSON.parse(localStorage.getItem('vsc_fs')||'null')||{'index.html':'<!DOCTYPE html>\n<html>\n<body>\n  <h1 id="t">Habari Dunia</h1>\n  <script src="app.js"><\/script>\n</body>\n</html>','style.css':'body {\n  font-family: sans-serif;\n  background: #f4f4f4;\n}\nh1 { color: #0078d4; }','app.js':'// JavaScript\nconst t = document.getElementById("t");\nt.onclick = () => alert("Karibu Sade VS Code!");\nconsole.log("Imeanza");','hello.py':'# Python\nprint("Habari")','README.md':'# Mradi\nAndika hapa.'};
let open=Object.keys(FS).slice(0,2),cur=open[0],th=0;const save=()=>localStorage.setItem('vsc_fs',JSON.stringify(FS));
const lang=f=>({js:'js',html:'html',css:'css',py:'py',json:'js',md:'md'}[f.split('.').pop()]||'txt');
const KW={js:'const let var function return if else for while class new this import export from async await try catch throw switch case break default typeof null true false undefined of in',py:'def class return if elif else for while import from as try except raise with lambda None True False and or not in is pass break continue print',css:'',html:''};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hi(s,l){let o=esc(s);if(l==='html')return o.replace(/(&lt;\/?)([\w-]+)/g,'$1<span class=k>$2</span>').replace(/([\w-]+)=(&quot;|")/g,'<span class=t2>$1</span>=$2').replace(/("[^"]*")/g,'<span class=s>$1</span>');
const re=l==='py'?/(#.*$)|("""[\s\S]*?"""|"[^"\n]*"|'[^'\n]*')|\b(\d+\.?\d*)\b|\b([A-Za-z_]\w*)(?=\()|\b([A-Za-z_]\w*)\b/gm:/(\/\/.*$|\/\*[\s\S]*?\*\/)|("[^"\n]*"|'[^'\n]*'|`[^`]*`)|\b(\d+\.?\d*)\b|\b([A-Za-z_]\w*)(?=\()|\b([A-Za-z_]\w*)\b/gm;
if(l==='md')return o.replace(/^(#+ .*)$/gm,'<span class=k>$1</span>');
const kw=new Set((KW[l]||'').split(' '));if(l==='css')return o.replace(/([\w-]+)(?=\s*:)/g,'<span class=t2>$1</span>').replace(/^([^{}\n:]+)(?=\{)/gm,'<span class=f2>$1</span>');
return o.replace(re,(m,c,st,n,f,w)=>c?`<span class=c>${c}</span>`:st?`<span class=s>${st}</span>`:n?`<span class=n>${n}</span>`:f?(kw.has(f)?`<span class=k>${f}</span>`:`<span class=f2>${f}</span>`):w&&kw.has(w)?`<span class=k>${w}</span>`:m)}
function draw(){const c=$('#code');$('#hl').innerHTML=hi(c.value,lang(cur))+'\n';const n=c.value.split('\n').length;$('#gut').textContent=Array.from({length:n},(_,i)=>i+1).join('\n');sync();FS[cur]=c.value;save()}
function sync(){$('#hl').scrollTop=$('#code').scrollTop;$('#hl').scrollLeft=$('#code').scrollLeft;$('#gut').scrollTop=$('#code').scrollTop}
function pos(){const c=$('#code'),b=c.value.slice(0,c.selectionStart).split('\n');$('#sp').textContent='Ln '+b.length+', Col '+(b[b.length-1].length+1)}
function tabs(){$('#tabs').innerHTML='';open.forEach(f=>{const t=document.createElement('div');t.className='t'+(f===cur?' on':'');t.innerHTML=f+' <i>✕</i>';t.onclick=e=>{if(e.target.tagName==='I'){open=open.filter(x=>x!==f);if(cur===f)cur=open[0];if(!open.length){cur=null}render();return}cur=f;render()};$('#tabs').append(t)})}
function tree(){$('#tree').innerHTML='';Object.keys(FS).sort().forEach(f=>{const d=document.createElement('div');d.className='f'+(f===cur?' on':'');d.innerHTML='📄 '+f+'<b title="Futa">🗑</b>';d.onclick=e=>{if(e.target.tagName==='B'){if(confirm('Futa '+f+'?')){delete FS[f];open=open.filter(x=>x!==f);if(cur===f)cur=open[0];save();render()}return}if(!open.includes(f))open.push(f);cur=f;render()};$('#tree').append(d)})}
function render(){tabs();tree();const c=$('#code');$('#pv').style.display='none';if(!cur){c.value='';c.disabled=true;$('#hl').innerHTML='';return}c.disabled=false;c.value=FS[cur]||'';$('#sl').textContent=lang(cur).toUpperCase();draw();pos()}
function newF(n){n=n||prompt('Jina la faili:');if(!n)return;if(!FS[n])FS[n]='';if(!open.includes(n))open.push(n);cur=n;save();render()}
$('#code').addEventListener('input',()=>{draw();pos()});$('#code').addEventListener('scroll',sync);$('#code').addEventListener('click',pos);$('#code').addEventListener('keyup',pos);
$('#code').addEventListener('keydown',e=>{const c=e.target,s=c.selectionStart,v=c.value;const ins=t=>{document.execCommand('insertText',false,t)};
if(e.key==='Tab'){e.preventDefault();ins('  ')}
else if(e.key==='Enter'){e.preventDefault();const ln=v.slice(v.lastIndexOf('\n',s-1)+1,s),ind=ln.match(/^\s*/)[0],ex=/[{(\[:]$/.test(ln.trim())?'  ':'';ins('\n'+ind+ex)}
else if('([{"\''.includes(e.key)&&c.selectionStart===c.selectionEnd){const p={'(':')','[':']','{':'}','"':'"',"'":"'"}[e.key];e.preventDefault();ins(e.key+p);c.selectionStart=c.selectionEnd=s+1}
else if(e.ctrlKey&&e.key==='/'){e.preventDefault();const a=v.lastIndexOf('\n',s-1)+1,b=v.indexOf('\n',s),ln=v.slice(a,b<0?v.length:b),m=lang(cur)==='py'?'# ':'// ';c.setSelectionRange(a,b<0?v.length:b);ins(ln.trim().startsWith(m.trim())?ln.replace(m,''):m+ln)}});
function run(){if(!cur)return;const l=lang(cur);if(l==='html'){const h=FS[cur].replace(/<script src="([^"]+)"><\/script>/g,(m,s)=>FS[s]!=null?'<script>'+FS[s]+'<\/script>':m).replace(/<link[^>]*href="([^"]+\.css)"[^>]*>/g,(m,s)=>FS[s]!=null?'<style>'+FS[s]+'</style>':m);$('#pv').srcdoc=h.includes('style.css')&&!h.includes('<style>')?h.replace('</head>','<style>'+(FS['style.css']||'')+'</style></head>'):h;$('#pv').style.display='block';}else if(l==='js'){term(true);const lg=[];const f=new Function('console',FS[cur]);try{f({log:(...a)=>lg.push(a.map(x=>typeof x==='object'?JSON.stringify(x):x).join(' ')),error:(...a)=>lg.push('ERR '+a.join(' ')),warn:(...a)=>lg.push(a.join(' '))});}catch(e){lg.push('❌ '+e.message)}out(lg.join('\n')||'(hakuna output)')}else if(l==='py'){term(true);out('ℹ️ Tumia programu ya Python IDE kuendesha Python halisi (Python-IDE.exe)')}else out('Haiwezi kuendeshwa')}
function term(on){$('#term').classList.toggle('on',on===undefined?!$('#term').classList.contains('on'):on)}
function out(t){$('#to').textContent+=t+'\n';$('#to').scrollTop=1e9}
$('#ti').onkeydown=e=>{if(e.key!=='Enter')return;const v=e.target.value.trim();e.target.value='';out('$ '+v);const[a,...r]=v.split(/\s+/);({help:()=>out('help ls cat <f> new <f> rm <f> run clear date echo'),ls:()=>out(Object.keys(FS).join('  ')),cat:()=>out(FS[r[0]]??'hakuna faili'),new:()=>newF(r[0]),rm:()=>{delete FS[r[0]];save();render()},run:()=>run(),clear:()=>$('#to').textContent='',date:()=>out(new Date().toString()),echo:()=>out(r.join(' '))}[a]||(()=>out('amri haijulikani: '+a)))()};
function dl(){const b=new Blob([FS[cur]]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cur;a.click()}
const find=()=>{const f=$('#find');f.style.display=f.style.display==='flex'?'none':'flex';$('#fi').focus()};
$('#fn').onclick=()=>{const c=$('#code'),q=$('#fi').value,i=c.value.indexOf(q,c.selectionEnd);const j=i<0?c.value.indexOf(q):i;if(j>=0){c.focus();c.setSelectionRange(j,j+q.length)}};
$('#fa').onclick=()=>{const c=$('#code');c.value=c.value.split($('#fi').value).join($('#fr').value);draw()};
const CMD=[['Faili Jipya',()=>newF()],['Endesha (Run)',run],['Terminal',()=>term()],['Tafuta/Badilisha',find],['Pakua faili',dl],['Theme: Giza/Mwanga',()=>themeT()],['Funga tab zote',()=>{open=[];cur=null;render()}],['Pakia faili',()=>{const i=document.createElement('input');i.type='file';i.multiple=true;i.onchange=()=>[...i.files].forEach(f=>f.text().then(t=>{FS[f.name]=t;newF(f.name)}));i.click()}]];
function pal(){const p=$('#pal');p.style.display='block';$('#pi').value='';$('#pi').focus();fl('')}
function fl(q){$('#pl').innerHTML='';CMD.filter(c=>c[0].toLowerCase().includes(q.toLowerCase())).forEach(c=>{const d=document.createElement('div');d.textContent=c[0];d.onclick=()=>{$('#pal').style.display='none';c[1]()};$('#pl').append(d)})}
$('#pi').oninput=e=>fl(e.target.value);$('#pi').onkeydown=e=>{if(e.key==='Escape')$('#pal').style.display='none';if(e.key==='Enter'){const d=$('#pl div');d&&d.click()}};
function themeT(){th=!th;document.documentElement.style.filter=th?'invert(1) hue-rotate(180deg)':''}
function search(){const q=$('#sbx');$('#sbh').textContent='Tafuta';$('#tree').style.display='none';q.style.display='block';q.innerHTML='<input id="gs" placeholder="Tafuta kwenye mafaili yote" style="width:100%;background:#3c3c3c;color:#fff;border:1px solid #555;padding:5px"><div id="gr"></div>';$('#gs').oninput=e=>{const v=e.target.value;$('#gr').innerHTML='';if(!v)return;Object.entries(FS).forEach(([f,t])=>t.split('\n').forEach((l,i)=>{if(l.includes(v)){const d=document.createElement('div');d.style.cssText='padding:3px;cursor:pointer;font-size:12px';d.textContent=f+':'+(i+1)+'  '+l.trim().slice(0,40);d.onclick=()=>{if(!open.includes(f))open.push(f);cur=f;render()};$('#gr').append(d)}}))}}
document.querySelectorAll('#ab div').forEach(d=>d.onclick=()=>{const a=d.dataset.a;if(a==='ex'||a==='se'){document.querySelectorAll('#ab div').forEach(x=>x.classList.remove('on'));d.classList.add('on');if(a==='ex'){$('#sbh').textContent='Explorer';$('#tree').style.display='';$('#sbx').style.display='none'}else search()}else if(a==='run')run();else if(a==='tm')term();else themeT()});
$('#sbh').ondblclick=()=>newF();
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='s'){e.preventDefault();save();$('#sm').textContent='Imehifadhiwa ✔'}else if(e.ctrlKey&&e.shiftKey&&e.key==='P'||e.key==='F1'){e.preventDefault();pal()}else if(e.ctrlKey&&e.key==='f'){e.preventDefault();find()}else if(e.ctrlKey&&e.key==='`'){e.preventDefault();term()}else if(e.key==='F5'){e.preventDefault();run()}else if(e.ctrlKey&&e.key==='n'){e.preventDefault();newF()}});
render();
</script></body></html>
