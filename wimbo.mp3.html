
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #10151e;
    color: #ffffff;
    min-height: 100vh;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 230px;
    background: #171e2a;
    padding: 25px 15px;
    border-right: 1px solid #293244;
    flex-shrink: 0;
}

.logo {
    font-size: 23px;
    font-weight: 700;
    margin-bottom: 35px;
    color: #68b8ff;
}

.menu-title {
    font-size: 11px;
    color: #8492a8;
    margin: 20px 10px 10px;
    letter-spacing: 1px;
}

.menu button {
    width: 100%;
    border: none;
    background: transparent;
    color: #c5cedb;
    padding: 13px 12px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
}

.menu button:hover,
.menu button.active {
    background: #283b55;
    color: #ffffff;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    padding: 28px;
    padding-bottom: 220px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.topbar h1 {
    margin: 0;
    font-size: 28px;
}

.add-btn {
    background: #1685e8;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 9px;
    font-weight: 600;
    cursor: pointer;
}

.add-btn:hover {
    background: #369cff;
}

#fileInput {
    display: none;
}

/* SEARCH */

.search {
    width: 100%;
    max-width: 500px;
    background: #1b2432;
    border: 1px solid #303b4d;
    padding: 14px;
    color: white;
    border-radius: 10px;
    outline: none;
    margin-bottom: 25px;
}

.search:focus {
    border-color: #1685e8;
}

/* LIBRARY */

.library-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.library-header h2 {
    font-size: 19px;
}

.count {
    color: #91a2b9;
    font-size: 13px;
}

.song-list {
    background: #171e2a;
    border: 1px solid #293244;
    border-radius: 12px;
    overflow: hidden;
}

.song {
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) 65px;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid #293244;
    cursor: pointer;
}

.song:last-child {
    border-bottom: none;
}

.song:hover {
    background: #222e40;
}

.song.playing {
    background: #203c5d;
}

.song-number {
    color: #8492a8;
    font-size: 13px;
    text-align: center;
}

.song-name {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.song-info {
    font-size: 12px;
    color: #91a2b9;
    margin-top: 5px;
}

.song-duration {
    font-size: 12px;
    color: #91a2b9;
    text-align: right;
}

.empty {
    padding: 45px 20px;
    text-align: center;
    color: #9aa9bd;
    line-height: 1.8;
}

/* PLAYER */

.player {
    position: fixed;
    bottom: 0;
    left: 230px;
    right: 0;
    background: #1a2230;
    border-top: 1px solid #303b4d;
    padding: 16px 25px;
    z-index: 5;
}

.player-top {
    display: flex;
    align-items: center;
    gap: 15px;
}

.cover {
    width: 55px;
    height: 55px;
    flex-shrink: 0;
    border-radius: 9px;
    background: linear-gradient(135deg, #1685e8, #6944b5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
}

.now-playing {
    flex: 1;
    min-width: 0;
}

.now-playing-title {
    font-weight: 600;
    font-size: 14px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.now-playing-artist {
    color: #94a4b9;
    font-size: 12px;
    margin-top: 5px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.controls button {
    border: none;
    color: white;
    background: transparent;
    font-size: 21px;
    cursor: pointer;
    padding: 8px;
}

.controls button:hover {
    color: #68b8ff;
}

.controls .play {
    background: #1685e8;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
}

.progress-area {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-size: 11px;
    color: #9aa9bd;
}

input[type="range"] {
    accent-color: #1685e8;
    cursor: pointer;
}

#progress {
    flex: 1;
    min-width: 0;
}

.bottom-tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
}

.bottom-tools button {
    color: #a8b8cc;
    background: transparent;
    border: none;
    cursor: pointer;
}

.bottom-tools button.active {
    color: #68b8ff;
}

.volume {
    display: flex;
    align-items: center;
    gap: 8px;
}

#volume {
    width: 95px;
}

@media (max-width: 700px) {
    .app {
        display: block;
    }

    .sidebar {
        width: 100%;
        padding: 12px 15px;
        border-right: none;
        border-bottom: 1px solid #293244;
    }

    .logo {
        margin-bottom: 12px;
        font-size: 20px;
    }

    .menu-title {
        display: none;
    }

    .menu {
        display: flex;
        gap: 8px;
    }

    .menu button {
        width: auto;
        padding: 10px 14px;
    }

    .main {
        padding: 20px 14px;
        padding-bottom: 260px;
    }

    .topbar h1 {
        font-size: 23px;
    }

    .player {
        left: 0;
        padding: 13px;
    }

    .player-top {
        gap: 10px;
    }

    .cover {
        width: 43px;
        height: 43px;
        font-size: 21px;
    }

    .controls {
        gap: 3px;
    }

    .controls button {
        font-size: 18px;
        padding: 6px;
    }

    .controls .play {
        width: 39px;
        height: 39px;
    }

    #volume {
        width: 75px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">♫ Music Player</div>

        <div class="menu-title">LIBRARY</div>

        <div class="menu">
            <button class="active" onclick="showAll()">
                ♫ All Music
            </button>

            <button onclick="pickMusic()">
                ＋ Add Music
            </button>
        </div>

        <div class="menu-title">PLAYER</div>

        <div class="menu">
            <button onclick="toggleShuffle()" id="shuffleMenu">
                🔀 Shuffle
            </button>

            <button onclick="toggleRepeat()" id="repeatMenu">
                🔁 Repeat
            </button>
        </div>

    </aside>

    <main class="main">

        <div class="topbar">
            <h1>My Music</h1>

            <button class="add-btn" onclick="pickMusic()">
                ＋ Add Music
            </button>
        </div>

        <input
            id="fileInput"
            type="file"
            accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac"
            multiple
        >

        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔍 Search songs..."
            oninput="renderSongs()"
        >

        <div class="library-header">
            <h2>Music Library</h2>
            <span class="count" id="count">0 songs</span>
        </div>

        <div class="song-list" id="songList">

            <div class="empty">
                <div style="font-size:45px">♫</div>

                <strong>No music selected</strong>

                <br>

                Chagua nyimbo kutoka kwenye simu au computer yako.

                <br><br>

                <button class="add-btn" onclick="pickMusic()">
                    Select Music
                </button>
            </div>

        </div>

    </main>

</div>

<!-- MUSIC PLAYER -->

<div class="player">

    <div class="player-top">

        <div class="cover">♫</div>

        <div class="now-playing">

            <div class="now-playing-title" id="nowTitle">
                No song selected
            </div>

            <div class="now-playing-artist" id="nowArtist">
                Music Player
            </div>

        </div>

        <div class="controls">

            <button onclick="previousSong()" title="Previous">
                ⏮
            </button>

            <button
                class="play"
                id="playBtn"
                onclick="togglePlay()"
                title="Play/Pause"
            >
                ▶
            </button>

            <button onclick="nextSong()" title="Next">
                ⏭
            </button>

        </div>

    </div>

    <div class="progress-area">

        <span id="currentTime">0:00</span>

        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
        >

        <span id="duration">0:00</span>

    </div>

    <div class="bottom-tools">

        <div>
            <button id="shuffleBtn" onclick="toggleShuffle()">
                🔀 Shuffle
            </button>

            <button id="repeatBtn" onclick="toggleRepeat()">
                🔁 Repeat
            </button>
        </div>

        <div class="volume">

            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
            >

        </div>

    </div>

</div>

<audio id="audio"></audio>

<script>

const audio = document.getElementById("audio");
const fileInput = document.getElementById("fileInput");
const songList = document.getElementById("songList");

let songs = [];
let currentIndex = -1;

let shuffle = false;
let repeat = false;

let objectUrls = [];

/* OPEN FILE PICKER */

function pickMusic() {
    fileInput.click();
}

/* ADD SONGS */

fileInput.addEventListener("change", function() {

    const files = Array.from(this.files);

    files.forEach(file => {

        if (!file.type.startsWith("audio/")) {
            return;
        }

        const url = URL.createObjectURL(file);

        objectUrls.push(url);

        const song = {
            file: file,
            name: file.name.replace(/\.[^/.]+$/, ""),
            url: url,
            duration: 0
        };

        songs.push(song);

    });

    renderSongs();

    if (currentIndex === -1 && songs.length > 0) {
        loadSong(0, false);
    }

    this.value = "";

});

/* FORMAT TIME */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);

    return min + ":" + String(sec).padStart(2, "0");

}

/* RENDER SONG LIST */

function renderSongs() {

    const search = document
        .getElementById("search")
        .value
        .toLowerCase();

    const filtered = songs
        .map((song, index) => ({song, index}))
        .filter(item =>
            item.song.name.toLowerCase().includes(search)
        );

    document.getElementById("count").textContent =
        songs.length + " songs";

    if (filtered.length === 0) {

        songList.innerHTML = `
            <div class="empty">
                Hakuna nyimbo zilizopatikana.
                <br>
                Chagua Add Music kuongeza nyimbo.
            </div>
        `;

        return;
    }

    songList.innerHTML = filtered.map((item, position) => {

        const song = item.song;
        const index = item.index;

        const playingClass =
            index === currentIndex ? "playing" : "";

        const number =
            index === currentIndex ? "♫" : position + 1;

        return `
            <div
                class="song ${playingClass}"
                onclick="loadSong(${index}, true)"
            >

                <div class="song-number">${number}</div>

                <div>
                    <div class="song-name">
                        ${escapeHTML(song.name)}
                    </div>

                    <div class="song-info">
                        ${escapeHTML(song.file.name)}
                    </div>
                </div>

                <div class="song-duration">
                    ${formatTime(song.duration)}
                </div>

            </div>
        `;

    }).join("");

}

/* PREVENT HTML INJECTION */

function escapeHTML(text) {

    return String(text).replace(/[&<>"']/g, function(char) {

        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];

    });

}

/* LOAD SONG */

function loadSong(index, autoplay) {

    if (index < 0 || index >= songs.length) {
        return;
    }

    currentIndex = index;

    const song = songs[index];

    audio.src = song.url;

    document.getElementById("nowTitle").textContent =
        song.name;

    document.getElementById("nowArtist").textContent =
        song.file.name;

    renderSongs();

    if (autoplay) {

        audio.play().then(() => {

            document.getElementById("playBtn").textContent = "❚❚";

        }).catch(() => {

            document.getElementById("playBtn").textContent = "▶";

        });

    } else {

        document.getElementById("playBtn").textContent = "▶";

    }

}

/* PLAY AND PAUSE */

function togglePlay() {

    if (songs.length === 0) {
        pickMusic();
        return;
    }

    if (audio.paused) {

        if (!audio.src) {
            loadSong(0, true);
            return;
        }

        audio.play().catch(() => {});

    } else {

        audio.pause();

    }

}

/* PLAYBACK EVENTS */

audio.addEventListener("play", function() {

    document.getElementById("playBtn").textContent = "❚❚";

});

audio.addEventListener("pause", function() {

    document.getElementById("playBtn").textContent = "▶";

});

/* DURATION */

audio.addEventListener("loadedmetadata", function() {

    if (currentIndex >= 0) {

        songs[currentIndex].duration = audio.duration;

        document.getElementById("duration").textContent =
            formatTime(audio.duration);

        renderSongs();

    }

});

/* PROGRESS */

audio.addEventListener("timeupdate", function() {

    const progress = document.getElementById("progress");

    if (audio.duration) {

        progress.value =
            (audio.currentTime / audio.duration) * 100;

    }

    document.getElementById("currentTime").textContent =
        formatTime(audio.currentTime);

});

/* SEEK */

document.getElementById("progress")
.addEventListener("input", function() {

    if (audio.duration) {

        audio.currentTime =
            (this.value / 100) * audio.duration;

    }

});

/* VOLUME */

document.getElementById("volume")
.addEventListener("input", function() {

    audio.volume = Number(this.value);

});

audio.volume = 0.8;

/* NEXT SONG */

function nextSong() {

    if (songs.length === 0) return;

    let next;

    if (shuffle && songs.length > 1) {

        do {
            next = Math.floor(Math.random() * songs.length);
        } while (next === currentIndex);

    } else {

        next = currentIndex + 1;

    }

    if (next >= songs.length) {

        if (repeat) {
            next = 0;
        } else {
            audio.pause();
            return;
        }

    }

    loadSong(next, true);

}

/* PREVIOUS SONG */

function previousSong() {

    if (songs.length === 0) return;

    if (audio.currentTime > 3) {

        audio.currentTime = 0;
        return;

    }

    let previous = currentIndex - 1;

    if (previous < 0) {
        previous = songs.length - 1;
    }

    loadSong(previous, true);

}

/* AUTO NEXT */

audio.addEventListener("ended", function() {

    if (repeat) {

        audio.currentTime = 0;
        audio.play().catch(() => {});

    } else {

        nextSong();

    }

});

/* SHUFFLE */

function toggleShuffle() {

    shuffle = !shuffle;

    document.getElementById("shuffleBtn")
        .classList.toggle("active", shuffle);

    document.getElementById("shuffleMenu")
        .classList.toggle("active", shuffle);

}

/* REPEAT */

function toggleRepeat() {

    repeat = !repeat;

    document.getElementById("repeatBtn")
        .classList.toggle("active", repeat);

    document.getElementById("repeatMenu")
        .classList.toggle("active", repeat);

}

/* ALL MUSIC */

function showAll() {

    document.getElementById("search").value = "";

    renderSongs();

}

/* CLEAN UP */

window.addEventListener("pagehide", function() {

    audio.pause();

    objectUrls.forEach(url => {
        URL.revokeObjectURL(url);
    });

});

</script>

</body>
</html>
