<!DOCTYPE html><html lang="sw"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picha</title><style>:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--ac:#2563eb;--ac2:#7c3aed;--bd:#e3e7f0;--hv:#e8efff}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2d;--tx:#e8ecf5;--mut:#9aa3b8;--bd:#2a3145;--hv:#26304a}}
*{box-sizing:border-box;margin:0}body{font:14px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);height:100vh;display:flex;flex-direction:column;color:var(--tx)}
.t{display:flex;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}.t b{flex:1;min-width:90px;font-size:15px;font-weight:600}
button,label.b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:500;box-shadow:0 2px 8px #2563eb40;transition:.15s}button:hover,label.b:hover{transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:scale(.97)}
input,select,textarea{padding:8px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2563eb30}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:16px}
#g{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;padding:8px;align-content:start}#g img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:pointer;transition:.2s;box-shadow:0 2px 8px #0002}#g img:hover{transform:scale(1.04)}
#v{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px}#v img{max-width:96%;max-height:84%}#v div{display:flex;gap:8px}</style>
<div class=t><b>🖼️ Picha (Photos)</b><label class=b>＋ Ongeza<input id=f type=file accept="image/*" multiple hidden></label><button id=s>▶ Slideshow</button></div><div id=g></div>
<div id=v><img id=i><div><button id=p>◀</button><button id=d>🗑️ Futa</button><button id=n>▶</button><button id=c>✕</button></div></div>
<script>
const $=s=>document.querySelector(s);let db,L=[],k=0,T;
const R=indexedDB.open('SadePhotos',1);R.onupgradeneeded=()=>R.result.createObjectStore('p',{autoIncrement:true});R.onsuccess=()=>{db=R.result;load()};
const st=m=>db.transaction('p',m).objectStore('p');
function load(){L=[];st('readonly').openCursor().onsuccess=e=>{const c=e.target.result;if(c){L.push({k:c.key,b:c.value});c.continue()}else draw()}}
function draw(){const g=$('#g');g.innerHTML=L.length?'':'<p style="padding:20px;color:var(--mut)">Hakuna picha bado. Bonyeza ＋ Ongeza.</p>';L.forEach((x,j)=>{x.u=URL.createObjectURL(x.b);const m=new Image;m.src=x.u;m.onclick=()=>show(j);g.append(m)})}
function show(j){k=(j+L.length)%L.length;$('#i').src=L[k].u;$('#v').style.display='flex'}
$('#f').onchange=e=>{const fs=[...e.target.files];let n=fs.length;fs.forEach(f=>{const r=db.transaction('p','readwrite');r.objectStore('p').add(f);r.oncomplete=()=>--n||load()})};
$('#p').onclick=()=>show(k-1);$('#n').onclick=()=>show(k+1);$('#c').onclick=()=>{clearInterval(T);$('#v').style.display='none'};
$('#d').onclick=()=>{const r=db.transaction('p','readwrite');r.objectStore('p').delete(L[k].k);r.oncomplete=()=>{$('#c').click();load()}};
$('#s').onclick=()=>{if(L.length){show(0);T=setInterval(()=>show(k+1),3000)}};
</script>
