<script>try{var S=JSON.parse(localStorage.getItem('sadevfs2')).set;document.documentElement.dataset.t=S.dark?'d':'l';document.documentElement.style.setProperty('--ac',S.acc||'#0067c0')}catch(e){}</script>
<style>:root{--ac:#0067c0;--bg:#f3f5f9;--fg:#141824;--cd:#fff;--bd:#d5dae3;--mu:#6b7385}[data-t=d]{--bg:#1b1f2a;--fg:#e8ebf2;--cd:#262b38;--bd:#394055;--mu:#9aa3b8}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:13px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}

.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fl{flex:1;min-height:0;overflow:auto}.mu{color:var(--mu)}.cv{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px;min-height:0}textarea{flex:1;resize:none;font:13px Consolas,monospace;white-space:pre;min-height:70px}.rw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}#st{min-height:18px}.ok{color:#107c10}.er{color:#c42b1c}mark{background:var(--ac);color:#fff;border-radius:2px}#rm{font:13px Consolas,monospace;white-space:pre-wrap;border:1px solid var(--bd);border-radius:6px;padding:8px;flex:1;overflow:auto;background:var(--cd)}</style></head><body><div class=tb id=tb><button class="tab on" data-p=json>JSON</button><button class=tab data-p=b64>Base64</button><button class=tab data-p=url>URL</button><button class=tab data-p=uuid>UUID</button><button class=tab data-p=ts>Muda (Unix)</button><button class=tab data-p=rx>Regex</button></div><div class=cv id=pn></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const P=$('#pn'),io=(a,b)=>`<textarea id=i placeholder="${a}"></textarea><div class=rw>${b}</div><div id=st></div><textarea id=o readonly placeholder="Matokeo"></textarea>`,msg=(t,ok)=>{$('#st').className=ok?'ok':'er';$('#st').textContent=t};
const u8b=s=>{const b=new TextEncoder().encode(s);let r='';b.forEach(c=>r+=String.fromCharCode(c));return btoa(r)},b8u=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)));
const V={json(){P.innerHTML=io('Bandika JSON hapa','<button class=p id=f>Panga</button><button id=m>Bana (minify)</button><button id=c>📋 Nakili</button>');const run=sp=>{try{const j=JSON.parse($('#i').value);$('#o').value=JSON.stringify(j,null,sp);msg('✔ JSON ni sahihi',1)}catch(e){const m=/position (\d+)/.exec(e.message);let t='✘ '+e.message;if(m){const p=+m[1],l=$('#i').value.slice(0,p).split('\n');t+=` (mstari ${l.length}, herufi ${l.at(-1).length+1})`}msg(t,0)}};$('#f').onclick=()=>run(2);$('#m').onclick=()=>run(0);$('#c').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('#o').value)},
b64(){P.innerHTML=io('Maandishi au Base64','<button class=p id=e>Simba (encode)</button><button id=d>Fungua (decode)</button>');$('#e').onclick=()=>{$('#o').value=u8b($('#i').value);msg('✔ Imesimbwa',1)};$('#d').onclick=()=>{try{$('#o').value=b8u($('#i').value.trim());msg('✔ Imefunguliwa',1)}catch(e){msg('✘ Base64 si sahihi',0)}}},
url(){P.innerHTML=io('URL au maandishi','<button class=p id=e>Simba</button><button id=d>Fungua</button>');$('#e').onclick=()=>{$('#o').value=encodeURIComponent($('#i').value);msg('✔',1)};$('#d').onclick=()=>{try{$('#o').value=decodeURIComponent($('#i').value);msg('✔',1)}catch(e){msg('✘ Mfuatano si sahihi',0)}}},
uuid(){P.innerHTML=`<div class=rw>Idadi: <input id=n type=number min=1 max=100 value=5 style="width:80px"><button class=p id=g>Tengeneza</button><button id=c>📋 Nakili</button></div><textarea id=o readonly></textarea>`;const g=()=>{const n=Math.min(100,Math.max(1,+$('#n').value||1));$('#o').value=Array.from({length:n},()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c=='x'?r:r&3|8).toString(16)})).join('\n')};$('#g').onclick=g;$('#c').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('#o').value);g()},
ts(){P.innerHTML=`<div class=rw><input id=u placeholder="Unix (sekunde au ms)" style="flex:1"><button class=p id=a>→ Tarehe</button><button id=nw>Sasa</button></div><div class=rw><input id=d type=datetime-local style="flex:1"><button id=b>→ Unix</button></div><textarea id=o readonly></textarea>`;const sh=t=>{const d=new Date(t);$('#o').value=isNaN(d)?'Tarehe si sahihi':`Unix (s):  ${Math.floor(t/1e3)}\nUnix (ms): ${t}\nUTC:       ${d.toUTCString()}\nISO:       ${d.toISOString()}\nLocal:     ${d.toLocaleString('sw')}`};$('#a').onclick=()=>{let v=Number($('#u').value);if(isNaN(v))return;sh(Math.abs(v)<1e11?v*1e3:v)};$('#b').onclick=()=>{const t=new Date($('#d').value).getTime();if(!isNaN(t))sh(t)};$('#nw').onclick=()=>{$('#u').value=Math.floor(Date.now()/1e3);sh(Date.now())};$('#nw').click()},
rx(){P.innerHTML=`<div class=rw><input id=p placeholder="Regex, mfano: \\d{3}" style="flex:1"><input id=fl value=g style="width:70px"></div><textarea id=i placeholder="Maandishi ya kujaribu"></textarea><div id=st></div><div id=rm></div>`;const run=()=>{const s=$('#i').value;try{const r=new RegExp($('#p').value,$('#fl').value.replace(/[^dgimsuy]/g,''));if(!$('#p').value){$('#rm').textContent='';return msg('',1)}let h='',l=0,n=0,m;const g=r.global||r.sticky;const E=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');if(g){r.lastIndex=0;while((m=r.exec(s))&&n<1000){if(!m[0]){r.lastIndex++;continue}h+=E(s.slice(l,m.index))+'<mark>'+E(m[0])+'</mark>';l=m.index+m[0].length;n++}}else if(m=r.exec(s)){h+=E(s.slice(0,m.index))+'<mark>'+E(m[0])+'</mark>';l=m.index+m[0].length;n=1}$('#rm').innerHTML=h+E(s.slice(l));msg(n?`✔ Mechi ${n}`:'Hakuna mechi',n>0)}catch(e){msg('✘ '+e.message,0)}};['#p','#fl','#i'].forEach(k=>$(k).oninput=run)}};
