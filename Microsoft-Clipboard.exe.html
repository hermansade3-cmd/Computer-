<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipboard History</title>
<style>html{color-scheme:light}body{margin:0;padding:14px;font:14px 'Segoe UI',system-ui,sans-serif;background:#fafafa;color:#1a1a1a}
.dk body{background:#272727;color:#eee}.dk input,.dk textarea,.dk select{background:#333;color:#fff;border-color:#555}
h2{margin:0 0 10px;font-size:18px}button{padding:7px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;color:#1a1a1a;cursor:pointer;font:inherit}button:hover{background:#e8f1fb}button:disabled{opacity:.5;cursor:default}
.dk button{background:#3a3a3a;color:#fff;border-color:#555}.dk button:hover{background:#4a4a4a}
button.p,button.on{background:#0067c0;color:#fff;border-color:#0067c0}
input,textarea,select{padding:7px 9px;border:1px solid #bbb;border-radius:6px;font:inherit;max-width:100%;box-sizing:border-box}
.c{background:rgba(127,127,127,.12);border-radius:8px;padding:12px;margin:0 0 10px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}td{border-bottom:1px solid rgba(127,127,127,.25);padding:6px 4px;vertical-align:top;word-break:break-word}td:first-child{width:38%;opacity:.75}
.bar2{height:12px;border-radius:6px;background:rgba(127,127,127,.3);overflow:hidden;margin-top:8px}.bar2 i{display:block;height:100%;background:#0067c0}.m{opacity:.75;font-size:12px}a{color:inherit;text-decoration:none}</style></head><body>
<h2>📋 Clipboard History</h2><div class="c"><textarea id="ta" rows="3" style="width:100%" placeholder="Bandika (Ctrl+V) au andika maandishi hapa…"></textarea><div class="r" style="margin-top:8px"><button class="p" id="ad">➕ Hifadhi</button><button id="rd">📥 Soma clipboard</button><button id="cl">🧹 Futa zote</button></div></div><p class="m" id="m">Hifadhi maandishi hapa (hadi 50), kisha bonyeza kimoja kunakili tena.</p><div id="l"></div>
<script>
const P=(()=>{try{if(parent!==window&&parent.document)return parent}catch(e){}return window})();try{if(P.document.body.classList.contains("dark"))document.documentElement.classList.add("dk")}catch(e){}
(function(){
 const $=s=>document.querySelector(s),LS=P.localStorage,K='sade_clip';let L=[];try{L=JSON.parse(LS.getItem(K)||'[]')}catch(e){}
 const save=()=>{try{LS.setItem(K,JSON.stringify(L))}catch(e){}};
 const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 const add=t=>{t=(t||'').trim();if(!t)return;L=L.filter(x=>x.t!==t);L.unshift({t:t,d:Date.now()});L=L.slice(0,50);save();draw()};
 const copy=async t=>{try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}$('#m').textContent='✅ Imenakiliwa'};
 function draw(){$('#l').innerHTML=L.map((x,i)=>'<div class="c"><div style="white-space:pre-wrap;word-break:break-word;max-height:90px;overflow:auto">'+esc(x.t)+'</div><div class="r" style="margin-top:6px"><span class="m">'+new Date(x.d).toLocaleString()+'</span><button data-c="'+i+'">⧉ Nakili</button><button data-d="'+i+'">🗑️</button></div></div>').join('')||'<p class="m">Hakuna kilichohifadhiwa.</p>'}
 $('#l').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c!=null)copy(L[+b.dataset.c].t);else if(b.dataset.d!=null){L.splice(+b.dataset.d,1);save();draw()}};
 $('#ad').onclick=()=>{add($('#ta').value);$('#ta').value=''};
 $('#ta').addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');setTimeout(()=>{add(t);$('#ta').value=''},0)});
 $('#rd').onclick=async()=>{try{add(await navigator.clipboard.readText())}catch(e){$('#m').textContent='Ruhusa ya clipboard imekataliwa — bandika (Ctrl+V) kwenye kisanduku'}};
 $('#cl').onclick=()=>{if(L.length&&confirm('Futa historia yote?')){L=[];save();draw()}};
 draw();
})();
</script></body></html>
