
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows Media Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #e4ebf4;
    color: #213a55;
}

button, input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 225px;
    flex-shrink: 0;
    background: linear-gradient(#f7fbff, #d0deed);
    border-right: 1px solid #9aafc9;
    padding: 20px 12px;
}

.logo {
    font-size: 21px;
    font-weight: 600;
    color: #174c83;
    margin-bottom: 30px;
}

.menu-title {
    font-size: 11px;
    font-weight: 700;
    color: #647f9d;
    margin: 20px 8px 8px;
}

.menu button {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 11px;
    color: #27415e;
    background: transparent;
}

.menu button:hover,
.menu button.active {
    background: linear-gradient(#e9f5ff, #bcd9f5);
    border-color: #8cb2d9;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    padding: 25px;
    padding-bottom: 205px;
    background: linear-gradient(#f7faff, #e4edf7);
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 15px;
    border-bottom: 1px solid #bdcde0;
}

.topbar h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 500;
    color: #174c83;
}

.btn {
    border: 1px solid #86a9cd;
    border-radius: 3px;
    padding: 10px 15px;
    color: #173e68;
    background: linear-gradient(#fff, #d7e7f8 50%, #b5cee9);
    box-shadow: inset 0 1px white;
}

.btn:hover {
    background: linear-gradient(#fff, #c5e4ff, #9cc8f1);
}

#fileInput,
#folderInput {
    display: none;
}

/* SEARCH */

.search {
    display: block;
    width: 100%;
    max-width: 500px;
    margin: 22px 0;
    padding: 12px;
    border: 1px solid #9aafc9;
    border-radius: 3px;
    background: white;
    color: #203b59;
    outline: none;
}

.search:focus {
    border-color: #4d91d0;
}

/* LIBRARY */

.library-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.library-header h2 {
    font-size: 18px;
    font-weight: 500;
    margin: 0;
    color: #194c80;
}

.count {
    color: #536b85;
    font-size: 12px;
}

.song-list {
    border: 1px solid #9aafc9;
    background: white;
    box-shadow: 0 1px 3px #c3cfdd;
}

.song {
    display: grid;
    grid-template-columns: 35px minmax(0, 1fr) 55px;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-bottom: 1px solid #e0e8f1;
    cursor: pointer;
}

.song:hover {
    background: #eaf4ff;
}

.song.playing {
    background: linear-gradient(#d5eaff, #b4d6f6);
    box-shadow: inset 3px 0 #3985c9;
}

.song-number {
    text-align: center;
    color: #647c95;
    font-size: 13px;
}

.song-name {
    font-size: 14px;
    font-weight: 600;
    color: #203b59;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.song-info {
    margin-top: 4px;
    font-size: 12px;
    color: #647c95;
}

.song-duration {
    text-align: right;
    font-size: 12px;
    color: #647c95;
}

.empty {
    padding: 40px 15px;
    text-align: center;
    line-height: 1.8;
    color: #647c95;
}

/* PLAYER */

.player {
    position: fixed;
    bottom: 0;
    left: 225px;
    right: 0;
    z-index: 10;
    padding: 14px 22px;
    border-top: 1px solid #8ea8c5;
    background: linear-gradient(#f8fbff, #e1eaf4 40%, #c8d8e9);
    box-shadow: 0 -2px 5px #c0ccda;
}

.player-top {
    display: flex;
    align-items: center;
    gap: 12px;
}

.cover {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    background: linear-gradient(135deg, #7aa9d6, #315d91);
    color: white;
    border: 1px solid #7c9fc2;
}

.now-playing {
    flex: 1;
    min-width: 0;
}

.now-playing-title {
    font-size: 14px;
    font-weight: 600;
    color: #1b3f64;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.now-playing-artist {
    font-size: 12px;
    margin-top: 4px;
    color: #5b7189;
}

.controls {
    display: flex;
    align-items: center;
    gap: 5px;
}

.controls button {
    border: none;
    background: transparent;
    color: #285780;
    font-size: 20px;
    padding: 8px;
}

.controls button:hover {
    color: #0877d1;
}

.controls .play {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #7099bf;
    background: linear-gradient(#fff, #c9dff4 50%, #9ebfe1);
    color: #164b7e;
    box-shadow: inset 0 1px white;
}

.progress-area {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 11px;
    color: #48627e;
    margin-top: 12px;
}

#progress {
    flex: 1;
    min-width: 0;
}

input[type="range"] {
    accent-color: #367ebd;
}

.bottom-tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
}

.bottom-tools button {
    border: none;
    background: transparent;
    color: #426382;
    padding: 5px;
    font-size: 12px;
}

.bottom-tools button.active {
    color: #006bc1;
    font-weight: 700;
}

.volume {
    display: flex;
    align-items: center;
    gap: 8px;
}

#volume {
    width: 90px;
}

/* MOBILE */

@media(max-width: 700px) {
    .app {
        display: block;
    }

    .sidebar {
        width: 100%;
        padding: 12px;
        border-right: none;
        border-bottom: 1px solid #9aafc9;
    }

    .logo {
        margin-bottom: 10px;
    }

    .menu-title {
        display: none;
    }

    .menu {
        display: flex;
        gap: 5px;
    }

    .menu button {
        width: auto;
        padding: 9px;
    }

    .main {
        padding: 15px 12px;
        padding-bottom: 220px;
    }

    .topbar h1 {
        font-size: 22px;
    }

    .player {
        left: 0;
        padding: 12px;
    }

    .controls {
        gap: 1px;
    }

    .controls button {
        padding: 5px;
        font-size: 17px;
    }

    .controls .play {
        width: 37px;
        height: 37px;
    }

    .cover {
        width: 40px;
        height: 40px;
    }

    #volume {
        width: 65px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">♫ Windows Media Player</div>

        <div class="menu-title">LIBRARY</div>

        <div class="menu">
            <button class="active" id="allBtn" onclick="showAll()">
                ♫ Music
            </button>

            <button onclick="chooseFiles()">
                ＋ Add Music
            </button>

            <button onclick="chooseFolder()">
                📁 Music Folder
            </button>
        </div>

        <div class="menu-title">PLAYBACK</div>

        <div class="menu">
            <button id="shuffleMenu" onclick="toggleShuffle()">
                🔀 Shuffle
            </button>

            <button id="repeatMenu" onclick="toggleRepeat()">
                🔁 Repeat
            </button>
        </div>

    </aside>

    <main class="main">

        <div class="topbar">

            <h1>Music Library</h1>

            <button class="btn" onclick="chooseFiles()">
                ＋ Add Music
            </button>

        </div>

        <input
            type="file"
            id="fileInput"
            accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac"
            multiple
        >

        <input
            type="file"
            id="folderInput"
            webkitdirectory
            directory
            multiple
        >

        <input
            class="search"
            id="search"
            type="search"
            placeholder="🔍 Search music..."
            oninput="renderSongs()"
        >

        <div class="library-header">
            <h2>All Music</h2>
            <span class="count" id="count">0 songs</span>
        </div>

        <div class="song-list" id="songList">

            <div class="empty">
                <div style="font-size:45px">♫</div>

                <strong>No music selected</strong>

                <br>

                Chagua Add Music au Music Folder.

                <br><br>

                <button class="btn" onclick="chooseFiles()">
                    Select Music
                </button>
            </div>

        </div>

    </main>

</div>

<!-- PLAYER CONTROLS -->

<div class="player">

    <div class="player-top">

        <div class="cover">♫</div>

        <div class="now-playing">

            <div class="now-playing-title" id="nowTitle">
                No song selected
            </div>

            <div class="now-playing-artist" id="nowArtist">
                Windows Media Player
            </div>

        </div>

        <div class="controls">

            <button onclick="previousSong()" title="Previous">
                ⏮
            </button>

            <button
                class="play"
                id="playBtn"
                onclick="togglePlay()"
                title="Play/Pause"
            >
                ▶
            </button>

            <button onclick="nextSong()" title="Next">
                ⏭
            </button>

        </div>

    </div>

    <div class="progress-area">

        <span id="currentTime">0:00</span>

        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
        >

        <span id="duration">0:00</span>

    </div>

    <div class="bottom-tools">

        <div>
            <button id="shuffleBtn" onclick="toggleShuffle()">
                🔀 Shuffle
            </button>

            <button id="repeatBtn" onclick="toggleRepeat()">
                🔁 Repeat
            </button>
        </div>

        <div class="volume">
            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
            >
        </div>

    </div>

</div>

<audio id="audio"></audio>

<script>

const audio = document.getElementById("audio");

const fileInput = document.getElementById("fileInput");
const folderInput = document.getElementById("folderInput");

const songList = document.getElementById("songList");

let songs = [];
let currentIndex = -1;

let shuffle = false;
let repeat = false;

/* CHOOSE FILES */

function chooseFiles() {
    fileInput.click();
}

/* CHOOSE FOLDER */

function chooseFolder() {
    folderInput.click();
}

/* ADD MUSIC */

function addMusic(files) {

    let added = 0;

    Array.from(files).forEach(file => {

        if (!file.type.startsWith("audio/")) {
            return;
        }

        // Prevent duplicate files
        const exists = songs.some(song =>
            song.file.name === file.name &&
            song.file.size === file.size &&
            song.file.lastModified === file.lastModified
        );

        if (exists) {
            return;
        }

        songs.push({
            file: file,
            name: file.name.replace(/\.[^/.]+$/, ""),
            url: URL.createObjectURL(file),
            duration: 0
        });

        added++;

    });

    renderSongs();

    if (currentIndex === -1 && songs.length > 0) {
        loadSong(0, false);
    }

}

/* FILE PICKER */

fileInput.addEventListener("change", function() {

    addMusic(this.files);

    this.value = "";

});

/* FOLDER PICKER */

folderInput.addEventListener("change", function() {

    addMusic(this.files);

    this.value = "";

});

/* FORMAT TIME */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);

    return min + ":" + String(sec).padStart(2, "0");

}

/* SAFE TEXT */

function escapeHTML(text) {

    return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[char]));

}

/* DISPLAY SONGS */

function renderSongs() {

    const search = document
        .getElementById("search")
        .value.toLowerCase();

    const filtered = songs
        .map((song, index) => ({song, index}))
        .filter(item =>
            item.song.name.toLowerCase().includes(search)
        );

    document.getElementById("count").textContent =
        songs.length + " songs";

    if (filtered.length === 0) {

        songList.innerHTML = `
            <div class="empty">
                Hakuna nyimbo zilizopatikana.
                <br>
                Chagua Add Music kuongeza nyimbo.
            </div>
        `;

        return;

    }

    songList.innerHTML = filtered.map((item, position) => {

        const song = item.song;
        const index = item.index;

        const playing = index === currentIndex;

        return `
            <div
                class="song ${playing ? "playing" : ""}"
                onclick="loadSong(${index}, true)"
            >

                <div class="song-number">
                    ${playing ? "♫" : position + 1}
                </div>

                <div>
                    <div class="song-name">
                        ${escapeHTML(song.name)}
                    </div>

                    <div class="song-info">
                        ${escapeHTML(song.file.name)}
                    </div>
                </div>

                <div class="song-duration">
                    ${formatTime(song.duration)}
                </div>

            </div>
        `;

    }).join("");

}

/* LOAD SONG */

function loadSong(index, autoplay) {

    if (index < 0 || index >= songs.length) {
        return;
    }

    currentIndex = index;

    const song = songs[index];

    audio.src = song.url;

    document.getElementById("nowTitle").textContent =
        song.name;

    document.getElementById("nowArtist").textContent =
        song.file.name;

    document.getElementById("progress").value = 0;

    document.getElementById("currentTime").textContent = "0:00";

    document.getElementById("duration").textContent =
        formatTime(song.duration);

    renderSongs();

    if (autoplay) {
        audio.play().catch(() => {});
    } else {
        audio.pause();
    }

}

/* PLAY / PAUSE */

function togglePlay() {

    if (songs.length === 0) {
        chooseFiles();
        return;
    }

    if (audio.paused) {

        if (currentIndex === -1) {
            loadSong(0, true);
            return;
        }

        audio.play().catch(() => {});

    } else {

        audio.pause();

    }

}

/* PLAY BUTTON */

audio.addEventListener("play", function() {

    document.getElementById("playBtn").textContent = "❚❚";

});

audio.addEventListener("pause", function() {

    document.getElementById("playBtn").textContent = "▶";

});

/* SONG DURATION */

audio.addEventListener("loadedmetadata", function() {

    if (currentIndex >= 0) {

        songs[currentIndex].duration = audio.duration;

        document.getElementById("duration").textContent =
            formatTime(audio.duration);

        renderSongs();

    }

});

/* PLAYBACK PROGRESS */

audio.addEventListener("timeupdate", function() {

    if (!audio.duration) {
        return;
    }

    document.getElementById("progress").value =
        (audio.currentTime / audio.duration) * 100;

    document.getElementById("currentTime").textContent =
        formatTime(audio.currentTime);

});

/* SEEK */

document.getElementById("progress").addEventListener(
    "input",
    function() {

        if (audio.duration) {
            audio.currentTime =
                (this.value / 100) * audio.duration;
        }

    }
);

/* VOLUME */

document.getElementById("volume").addEventListener(
    "input",
    function() {
        audio.volume = Number(this.value);
    }
);

audio.volume = 0.8;

/* NEXT */

function nextSong() {

    if (songs.length === 0) {
        return;
    }

    let next;

    if (shuffle && songs.length > 1) {

        do {
            next = Math.floor(Math.random() * songs.length);
        } while (next === currentIndex);

    } else {

        next = currentIndex + 1;

    }

    if (next >= songs.length) {

        if (repeat) {
            next = 0;
        } else {
            audio.pause();
            return;
        }

    }

    loadSong(next, true);

}

/* PREVIOUS */

function previousSong() {

    if (songs.length === 0) {
        return;
    }

    if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
    }

    let previous = currentIndex - 1;

    if (previous < 0) {
        previous = songs.length - 1;
    }

    loadSong(previous, true);

}

/* AUTOMATIC NEXT */

audio.addEventListener("ended", function() {

    if (repeat) {

        audio.currentTime = 0;
        audio.play().catch(() => {});

    } else {

        nextSong();

    }

});

/* SHUFFLE */

function toggleShuffle() {

    shuffle = !shuffle;

    document.getElementById("shuffleBtn")
        .classList.toggle("active", shuffle);

    document.getElementById("shuffleMenu")
        .classList.toggle("active", shuffle);

}

/* REPEAT */

function toggleRepeat() {

    repeat = !repeat;

    document.getElementById("repeatBtn")
        .classList.toggle("active", repeat);

    document.getElementById("repeatMenu")
        .classList.toggle("active", repeat);

}

/* SHOW ALL */

function showAll() {

    document.getElementById("search").value = "";

    renderSongs();

}

/* CLEAN UP */

window.addEventListener("pagehide", function() {

    audio.pause();

    songs.forEach(song => {
        URL.revokeObjectURL(song.url);
    });

});

</script>

</body>
</html>
