*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:13px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}

async function makeZip(fs){const parts=[],cd=[],te=new TextEncoder();let off=0;for(const f of fs){const raw=new Uint8Array(await f.arrayBuffer()),nm=te.encode(f.name),cr=crc(raw);let m=8,d;try{d=await pipe(CompressionStream,raw)}catch(e){m=0}if(m==0||d.length>=raw.length){m=0;d=raw}const t=dos(new Date(f.lastModified||Date.now())),h=new DataView(new ArrayBuffer(30));
h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(8,m,true);h.setUint16(10,t.t,true);h.setUint16(12,t.d,true);h.setUint32(14,cr,true);h.setUint32(18,d.length,true);h.setUint32(22,raw.length,true);h.setUint16(26,nm.length,true);parts.push(new Uint8Array(h.buffer),nm,d);
const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(10,m,true);c.setUint16(12,t.t,true);c.setUint16(14,t.d,true);c.setUint32(16,cr,true);c.setUint32(20,d.length,true);c.setUint32(24,raw.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}

function readZip(buf){const dv=new DataView(buf),u=new Uint8Array(buf);let e=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--)if(dv.getUint32(i,true)==0x06054b50){e=i;break}if(e<0)throw'Hii si faili la ZIP sahihi';const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[],td=new TextDecoder();
for(let i=0;i<n;i++){if(dv.getUint32(p,true)!=0x02014b50)throw'ZIP imeharibika';const fl=dv.getUint16(p+8,true),m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),us=dv.getUint32(p+24,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),name=td.decode(u.slice(p+46,p+46+nl));p+=46+nl+el+cl;out.push({name,m,cs,us,enc:fl&1,z64:cs==0xffffffff||us==0xffffffff,data:async()=>{const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u.slice(st,st+cs);return m==0?raw:await pipe(DecompressionStream,raw)}})}return out}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
function ls(){$('#ls').innerHTML=files.map((f,i)=>`<div class=rw><span>📄 ${f.name.replace(/</g,'&lt;')}</span><span class=mu style="flex:none">${sz(f.size)}</span><button data-i=${i}>✕</button></div>`).join('')||'<p class=mu>Hakuna mafaili yaliyochaguliwa.</p>';$$('#ls button').forEach(b=>b.onclick=()=>{files.splice(b.dataset.i,1);ls()});$('#b').textContent=files.length+' mafaili · '+sz(files.reduce((a,f)=>a+f.size,0))}
