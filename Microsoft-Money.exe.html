<!DOCTYPE html><html lang="sw"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fedha</title><style>:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--ac:#2563eb;--ac2:#7c3aed;--bd:#e3e7f0;--hv:#e8efff}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2d;--tx:#e8ecf5;--mut:#9aa3b8;--bd:#2a3145;--hv:#26304a}}
*{box-sizing:border-box;margin:0}body{font:14px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);height:100vh;display:flex;flex-direction:column;color:var(--tx)}
.t{display:flex;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}.t b{flex:1;min-width:90px;font-size:15px;font-weight:600}
button,label.b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:500;box-shadow:0 2px 8px #2563eb40;transition:.15s}button:hover,label.b:hover{transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:scale(.97)}
input,select,textarea{padding:8px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2563eb30}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:16px}.r{padding:20px;margin:16px;background:var(--card);border-radius:20px;box-shadow:0 8px 30px #0002;display:flex;flex-direction:column;gap:10px}.r div{display:flex;gap:8px}.r input{flex:1;font-size:26px}h2{font-weight:400}</style>
<div class=t><b>💱 Kubadilisha Fedha</b></div><div class=r><div><input id=a type=number value=1 min=0><select id=f></select></div><div><input id=o readonly><select id=u></select></div><small id=m style="color:var(--mut)">Inapakia viwango…</small></div>
<script>
const $=s=>document.querySelector(s);let R;
['TZS','USD','EUR','GBP','KES','UGX','CNY','AED','INR','ZAR'].forEach(c=>['#f','#u'].forEach(s=>$(s).add(new Option(c,c))));$('#f').value='USD';$('#u').value='TZS';
function go(){if(!R)return;const v=$('#a').value*R[$('#u').value]/R[$('#f').value];$('#o').value=v.toLocaleString('en',{maximumFractionDigits:2})}
['#a','#f','#u'].forEach(s=>$(s).oninput=go);
fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json()).then(j=>{R=j.rates;$('#m').textContent='Viwango vya leo (open.er-api.com)';go()}).catch(()=>$('#m').textContent='Imeshindwa — angalia mtandao.');
</script>
