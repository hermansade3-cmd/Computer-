<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scientific Calculator</title>
<style>
:root{--bg:radial-gradient(circle at 20% 0,#26304f,#0d1020 70%);--pn:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#fff;--mu:#9aa4c4;--k:rgba(255,255,255,.08);--n:rgba(255,255,255,.16);--ac:#7c9cff;--ac2:#5eead4}
body.l{--bg:linear-gradient(135deg,#eef2ff,#dbe4ff);--pn:rgba(255,255,255,.7);--bd:rgba(0,0,0,.1);--tx:#111827;--mu:#6b7280;--k:rgba(0,0,0,.06);--n:rgba(0,0,0,.12);--ac:#4f46e5;--ac2:#0d9488}
body.m{--bg:radial-gradient(circle at 80% 0,#3b0764,#050510 70%);--ac:#f0abfc;--ac2:#22d3ee}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px Inter,Segoe UI,system-ui,sans-serif;overflow:hidden;user-select:none}
#app{display:flex;height:100%}#c{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px;gap:8px}#side{width:270px;background:var(--pn);backdrop-filter:blur(14px);display:flex;flex-direction:column;border-left:1px solid var(--bd)}
#tabs{display:flex}#tabs div{flex:1;text-align:center;padding:9px;cursor:pointer;font-size:12px;color:var(--mu)}#tabs div.on{color:var(--tx);border-bottom:2px solid var(--ac)}
#disp{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:10px 16px;text-align:right;min-height:104px;backdrop-filter:blur(14px)}#ex{font-size:14px;color:var(--mu);min-height:20px;overflow:auto;white-space:nowrap}#in{width:100%;background:transparent;border:0;color:var(--tx);font-size:28px;text-align:right;outline:0}#res{font-size:40px;font-weight:300;overflow:auto;white-space:nowrap;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
#pad{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;min-height:0}#pad button{background:var(--k);color:var(--tx);border:1px solid var(--bd);border-radius:12px;font:inherit;cursor:pointer;min-height:0;transition:.12s}#pad button:hover{background:var(--n);transform:translateY(-1px)}#pad button:active{transform:scale(.95)}
.n{background:var(--n)!important;font-size:18px}.o{background:linear-gradient(135deg,var(--ac),var(--ac2))!important;color:#06101f!important;font-weight:700}.e{background:linear-gradient(135deg,#22c55e,#16a34a)!important;color:#fff!important}.d{background:linear-gradient(135deg,#f43f5e,#be123c)!important;color:#fff!important}.fn{font-size:13px}.on2{outline:2px solid var(--ac2)}
#h{flex:1;overflow:auto;padding:6px}#h div{padding:8px;border-bottom:1px solid var(--bd);cursor:pointer;text-align:right}#h div:hover{background:var(--k)}#h small{color:var(--mu);display:block}
#mode{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:12px}#mode button{background:var(--k);color:var(--tx);border:1px solid var(--bd);padding:4px 11px;border-radius:14px;cursor:pointer}#mode button.on{background:var(--ac);color:#06101f;border-color:var(--ac)}
.pn{display:none;flex-direction:column;flex:1;gap:8px;overflow:auto;min-height:0}.pn input,.pn select,.pn textarea{background:var(--pn);color:var(--tx);border:1px solid var(--bd);padding:8px;border-radius:10px;font:14px monospace;outline:0}.pn button{background:var(--ac);color:#06101f;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}.pn .o2{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px;font:13px/1.6 monospace;white-space:pre-wrap;user-select:text}
canvas{background:#0b0e1a;border-radius:14px;flex:1;width:100%;min-height:0}.rw{display:flex;gap:6px}.rw>*{flex:1;min-width:0}
</style><style id="sade-polish">:root{color-scheme:dark light}*{scrollbar-width:thin;scrollbar-color:#6b7fb355 transparent}::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#6b7fb355;border-radius:9px}::selection{background:#7c9cff55}button,select,input,[role=button]{transition:background .18s,border-color .18s,transform .12s,box-shadow .18s,filter .18s}button:not(:disabled):active{transform:scale(.96)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #38e8b0;outline-offset:2px}button:not(:disabled):hover{box-shadow:0 4px 14px #0003}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><div id="app"><div id="c">
<div id="mode"><button id="mD" class="on">DEG</button><button id="mR">RAD</button><button id="mG">GRAD</button><button id="inv">2nd</button><span style="margin-left:auto" id="mem"></span>
<button id="vC" class="on">Calc</button><button id="vG">Grafu</button><button id="vB">Mifumo</button><button id="vS">Solver</button><button id="vT">Takwimu</button><button id="vU">Vitengo</button><button id="th">🎨</button></div>
<div id="disp"><div id="ex"></div><input id="in" value="" inputmode="none" autocomplete="off"><div id="res">0</div></div>
<div id="pad"></div>
<div id="gr" class="pn"><input id="gf" value="sin(x)*x"><canvas id="cvs"></canvas><div style="font-size:12px;color:#9aa0a6">Gurudumu = zoom · buruta = sogeza · tumia x kama kigezo</div></div>
<div id="sv" class="pn"><input id="sf" value="x^3-2x-5" placeholder="f(x)"><div class="rw"><input id="sa" value="-10" title="a"><input id="sb" value="10" title="b"><input id="sx" value="1" title="x0"></div><div class="rw"><button data-o="roots">Mizizi f=0</button><button data-o="d">f′(x₀)</button><button data-o="d2">f″(x₀)</button></div><div class="rw"><button data-o="int">∫ a→b</button><button data-o="ext">Min/Max</button><button data-o="tay">Taylor</button></div><div class="o2" id="so">Andika f(x), kisha chagua operesheni. Kazi zote za calculator zinafanya kazi.</div></div>
<div id="stt" class="pn"><textarea id="sd" rows="3" placeholder="Data X: 4, 8, 15, 16, 23, 42">4, 8, 15, 16, 23, 42</textarea><textarea id="sy" rows="2" placeholder="Data Y (hiari, kwa regression)"></textarea><button id="sg">Hesabu</button><div class="o2" id="so2"></div></div>
<div id="un" class="pn"><select id="uc"></select><div class="rw"><input id="uv" value="1" type="number"><select id="uf"></select></div><div class="rw"><select id="ut"></select></div><div class="o2" id="uo"></div></div>
<div id="cv" class="pn"><input id="bv" placeholder="Nambari (desimali)"><div id="bo"></div></div></div>
<div id="side"><div id="tabs"><div class="on" data-s="h">Historia</div><div data-s="k">Vipengele</div></div><div id="h"></div></div></div>
<script>
const $=s=>document.querySelector(s);let ang='D',H=JSON.parse(localStorage.getItem('sc_h')||'[]'),M=+localStorage.getItem('sc_m')||0,last=0,sec=false;
const toR=x=>ang==='D'?x*Math.PI/180:ang==='G'?x*Math.PI/200:x,fromR=x=>ang==='D'?x*180/Math.PI:ang==='G'?x*200/Math.PI:x;
const fact=n=>{if(n<0||n%1)return gamma(n+1);let r=1;for(let i=2;i<=n;i++)r*=i;return r};
function gamma(z){const g=7,c=[.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(z<.5)return Math.PI/(Math.sin(Math.PI*z)*gamma(1-z));z--;let x=c[0];for(let i=1;i<g+2;i++)x+=c[i]/(z+i);const t=z+g+.5;return Math.sqrt(2*Math.PI)*Math.pow(t,z+.5)*Math.exp(-t)*x}
const F={sin:x=>Math.sin(toR(x)),cos:x=>Math.cos(toR(x)),tan:x=>Math.tan(toR(x)),asin:x=>fromR(Math.asin(x)),acos:x=>fromR(Math.acos(x)),atan:x=>fromR(Math.atan(x)),sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,asinh:Math.asinh,acosh:Math.acosh,atanh:Math.atanh,ln:Math.log,log:Math.log10,log2:Math.log2,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round,fact,gamma:x=>gamma(x),rad:x=>x*Math.PI/180,deg:x=>x*180/Math.PI,sign:Math.sign,
npr:(n,r)=>fact(n)/fact(n-r),ncr:(n,r)=>fact(n)/(fact(r)*fact(n-r)),gcd:(a,b)=>b?F.gcd(b,a%b):Math.abs(a),lcm:(a,b)=>Math.abs(a*b)/F.gcd(a,b),max:Math.max,min:Math.min,pow:Math.pow,mod:(a,b)=>a%b,rand:()=>Math.random()};
const C={pi:Math.PI,e:Math.E,phi:(1+Math.sqrt(5))/2,c:299792458,g:9.80665,h:6.62607015e-34,k:1.380649e-23,na:6.02214076e23,ans:()=>last,m:()=>M};
function calc(src,xv){let s=src.replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/,/g,',').replace(/(\d)%/g,'($1/100)'),i=0;
const peek=()=>s[i],err=m=>{throw new Error(m)};
function num(){const m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);if(!m)return null;i+=m[0].length;return parseFloat(m[0])}
function prim(){let v;if(peek()==='('){i++;v=expr();if(peek()!==')')err('Kosa: ")"');i++}else{v=num();if(v===null){const m=s.slice(i).match(/^[a-z][a-z0-9]*/i);if(!m)err('Kosa la sintaksia');const id=m[0].toLowerCase();i+=id.length;if(peek()==='('){i++;const a=[];if(peek()!==')'){do{if(peek()===',')i++;a.push(expr())}while(peek()===',')}if(peek()!==')')err('Kosa: ")"');i++;if(!F[id])err('Kazi haipo: '+id);v=F[id](...a)}else if(id==='x'&&xv!==undefined)v=xv;else if(id in C)v=typeof C[id]==='function'?C[id]():C[id];else err('Haijulikani: '+id)}}
while(peek()==='!'){i++;v=fact(v)}return v}
function pw(){const b=unary();if(peek()==='^'){i++;return Math.pow(b,pw())}return b}
function unary(){if(peek()==='-'){i++;return-pw2()}if(peek()==='+'){i++;return pw2()}return prim()}
function pw2(){const b=prim();if(peek()==='^'){i++;return Math.pow(b,pw())}return b}
function term(){let v=pw();while(peek()==='*'||peek()==='/'||peek()==='('||/[a-z]/i.test(peek()||'')||peek()==='%'){if(peek()==='%'){i++;v=v%pw();continue}if(peek()==='/'){i++;v/=pw()}else{if(peek()==='*')i++;v*=pw()}}return v}
function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const r=term();v=o==='+'?v+r:v-r}return v}
const r=expr();if(i<s.length)err('Kosa la sintaksia');return r}
const fmt=v=>{if(!isFinite(v))return v>0?'∞':v<0?'-∞':'Haijafafanuliwa';if(Math.abs(v)>=1e15||(v!==0&&Math.abs(v)<1e-9))return v.toExponential(8).replace(/\.?0+e/,'e');return String(+v.toPrecision(14))};
function ev(){const e=$('#in').value;if(!e.trim()){$('#res').textContent='0';return}try{const v=calc(e);$('#res').textContent=fmt(v);return v}catch(x){$('#res').textContent='…'}}
function eq(){const e=$('#in').value;if(!e.trim())return;try{const v=calc(e);last=v;H.unshift([e,fmt(v)]);H=H.slice(0,100);localStorage.setItem('sc_h',JSON.stringify(H));$('#ex').textContent=e+' =';$('#in').value=fmt(v);$('#res').textContent=fmt(v);hist()}catch(x){$('#res').textContent='⚠ '+x.message}}
const ins=t=>{const i=$('#in'),a=i.selectionStart,b=i.selectionEnd;i.setRangeText(t,a,b,'end');i.focus();ev()};
const K=[['2nd','fn','sec'],['π','fn','pi'],['e','fn','e'],['C','d','C'],['⌫','d','B'],['MC','fn','mc'],['MR','fn','mr'],['M+','fn','m+'],
['x²','fn','^2'],['1/x','fn','1/('],['|x|','fn','abs('],['exp','fn','exp('],['mod','fn','%'],['M−','fn','m-'],['(','fn','('],[')','fn',')'],
['sin','fn','sin('],['cos','fn','cos('],['tan','fn','tan('],['√','fn','sqrt('],['7','n','7'],['8','n','8'],['9','n','9'],['÷','o','/'],
['ln','fn','ln('],['log','fn','log('],['xʸ','fn','^'],['n!','fn','!'],['4','n','4'],['5','n','5'],['6','n','6'],['×','o','*'],
['nCr','fn','ncr('],['nPr','fn','npr('],['10ˣ','fn','10^'],['eˣ','fn','e^'],['1','n','1'],['2','n','2'],['3','n','3'],['−','o','-'],
['gcd','fn','gcd('],['Ans','fn','ans'],['EE','fn','e'],['rand','fn','rand()'],['0','n','0'],['.','n','.'],['=','e','='],['+','o','+']];
const S2={sin:['asin(','asin'],cos:['acos(','acos'],tan:['atan(','atan'],ln:['sinh(','sinh'],log:['cosh(','cosh'],'√':['cbrt(','∛'],'x²':['^3','x³'],'xʸ':['^(1/','ʸ√x']};
function pad(){$('#pad').innerHTML='';K.forEach(([l,c,v])=>{const b=document.createElement('button');b.className=c;const s=sec&&S2[l];b.textContent=s?s[1]:l;if(l==='2nd'&&sec)b.classList.add('on2');b.onclick=()=>key(s?s[0]:v);$('#pad').append(b)})}
function key(v){if(v==='C'){$('#in').value='';$('#ex').textContent='';$('#res').textContent='0'}else if(v==='B'){const i=$('#in');i.value=i.value.slice(0,-1);ev()}else if(v==='=')eq();else if(v==='sec'){sec=!sec;pad()}else if(v==='mc'){M=0;sm()}else if(v==='mr')ins(fmt(M));else if(v==='m+'){const x=ev();if(x!==undefined)M+=x;sm()}else if(v==='m-'){const x=ev();if(x!==undefined)M-=x;sm()}else{ins(v);if(sec){sec=false;pad()}}}
const sm=()=>{localStorage.setItem('sc_m',M);$('#mem').textContent=M?'M = '+fmt(M):''};sm();
function hist(){$('#h').innerHTML='';H.forEach(([e,r])=>{const d=document.createElement('div');d.innerHTML=`<small>${e}</small>${r}`;d.onclick=()=>{$('#in').value=r;ev()};$('#h').append(d)});if(!H.length)$('#h').innerHTML='<div style="color:#9aa0a6">Hakuna historia</div>'}
function setAng(a){ang=a;['D','R','G'].forEach(x=>$('#m'+x).classList.toggle('on',x===a));ev()}
$('#mD').onclick=()=>setAng('D');$('#mR').onclick=()=>setAng('R');$('#mG').onclick=()=>setAng('G');$('#inv').onclick=()=>key('sec');
$('#in').addEventListener('input',ev);$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();eq()}});
const PN={C:'#pad',G:'#gr',B:'#cv',S:'#sv',T:'#stt',U:'#un'};const V=v=>{Object.keys(PN).forEach(x=>{$('#v'+x).classList.toggle('on',x===v);$(PN[x]).style.display=x===v?(x==='C'?'grid':'flex'):'none'});$('#disp').style.display=v==='C'?'':'none';if(v==='G')setTimeout(plot,30)};
$('#vC').onclick=()=>V('C');$('#vG').onclick=()=>V('G');$('#vB').onclick=()=>V('B');$('#vS').onclick=()=>V('S');$('#vT').onclick=()=>V('T');$('#vU').onclick=()=>V('U');let thi=0;$('#th').onclick=()=>{thi=(thi+1)%3;document.body.className=['','l','m'][thi]};
document.querySelectorAll('#tabs div').forEach(d=>d.onclick=()=>{document.querySelectorAll('#tabs div').forEach(x=>x.classList.remove('on'));d.classList.add('on');if(d.dataset.s==='h')hist();else{$('#h').innerHTML='<div style="text-align:left;color:#ccc;line-height:1.6">Kazi: sin cos tan asin acos atan sinh cosh tanh ln log log2 sqrt cbrt abs exp fact gamma ncr npr gcd lcm max min pow<br>Constants: pi e phi c g h k na ans m<br>Operators: + − × ÷ ^ ! % (mod)<br>Mfano: 2pi*sin(30), 5!, ncr(10,3)<br><br>Kibodi: Enter = hesabu, Esc = futa</div>'}});
// Graph
let gv={x:0,y:0,s:40},cv=$('#cvs');
function plot(){const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;const g=cv.getContext('2d'),w=cv.width,h=cv.height,{x,y,s}=gv,ox=w/2-x*s,oy=h/2+y*s;g.clearRect(0,0,w,h);g.strokeStyle='#2a2d31';g.fillStyle='#777';g.font='10px sans-serif';
for(let i=Math.floor((-ox)/s);i<=(w-ox)/s;i++){g.beginPath();g.moveTo(ox+i*s,0);g.lineTo(ox+i*s,h);g.stroke();if(i)g.fillText(i,ox+i*s+2,oy+10)}for(let j=Math.floor((oy-h)/s);j<=oy/s;j++){g.beginPath();g.moveTo(0,oy-j*s);g.lineTo(w,oy-j*s);g.stroke();if(j)g.fillText(j,ox+2,oy-j*s-2)}
g.strokeStyle='#aaa';g.beginPath();g.moveTo(ox,0);g.lineTo(ox,h);g.moveTo(0,oy);g.lineTo(w,oy);g.stroke();
$('#gf').value.split(';').forEach((f,k)=>{g.strokeStyle=['#8ab4f8','#f28b82','#81c995','#fdd663'][k%4];g.lineWidth=2;g.beginPath();let st=false;for(let px=0;px<=w;px++){const xv=(px-ox)/s;let yv;try{yv=calc(f,xv)}catch(e){yv=NaN}if(!isFinite(yv)||Math.abs(yv)>1e6){st=false;continue}const py=oy-yv*s;if(st)g.lineTo(px,py);else{g.moveTo(px,py);st=true}}g.stroke()});if(tr!==null){const xv=(tr-ox)/s,f=$('#gf').value.split(';')[0];let yv;try{yv=calc(f,xv)}catch(e){yv=NaN}if(isFinite(yv)){g.fillStyle='#fff';g.beginPath();g.arc(tr,oy-yv*s,5,0,7);g.fill();g.font='12px monospace';g.fillText('x='+xv.toFixed(3)+'  y='+yv.toFixed(4),10,18)}}}
let tr=null;cv.onmousemove=e=>{if(!dr){tr=e.clientX-cv.getBoundingClientRect().left;plot()}};$('#gf').oninput=plot;cv.onwheel=e=>{e.preventDefault();gv.s*=e.deltaY<0?1.15:.87;plot()};let dr;cv.onmousedown=e=>dr=[e.clientX,e.clientY,gv.x,gv.y];onmouseup=()=>dr=0;onmousemove=e=>{if(dr){gv.x=dr[2]-(e.clientX-dr[0])/gv.s;gv.y=dr[3]+(e.clientY-dr[1])/gv.s;plot()}};onresize=plot;
// Bases
$('#bv').oninput=e=>{const n=Math.trunc(+e.target.value);$('#bo').innerHTML=isFinite(n)&&e.target.value?[['BIN',2],['OKT',8],['DES',10],['HEX',16]].map(([a,b])=>`<div style="padding:8px;background:#2b2d31;margin-top:6px;border-radius:6px;font-family:monospace"><b>${a}</b> ${n.toString(b).toUpperCase()}</div>`).join(''):''};
onkeydown=e=>{if(e.target.id==='gf'||e.target.id==='bv')return;if(e.key==='Escape')key('C');if(document.activeElement!==$('#in')&&!e.ctrlKey&&e.key.length===1&&/[\w+\-*/^().!%,]/.test(e.key)){$('#in').focus()}};

// Solver
const so=t=>$('#so').textContent=t,fx=(f,x)=>{try{return calc(f,x)}catch(e){return NaN}};
$('#sv').addEventListener('click',e=>{const o=e.target.dataset.o;if(!o)return;const f=$('#sf').value,a=+$('#sa').value,b=+$('#sb').value,x0=+$('#sx').value,h=1e-4;
if(o==='roots'){const R=[],N=4000;let px=a,py=fx(f,a);for(let i=1;i<=N;i++){const x=a+(b-a)*i/N,y=fx(f,x);if(isFinite(py)&&isFinite(y)&&py*y<=0&&Math.abs(py-y)<1e6){let l=px,r=x;for(let k=0;k<70;k++){const m=(l+r)/2;fx(f,l)*fx(f,m)<=0?r=m:l=m}const z=(l+r)/2;if(!R.some(q=>Math.abs(q-z)<1e-6))R.push(z)}px=x;py=y}so(R.length?'Mizizi katika ['+a+', '+b+']:\n'+R.map((r,i)=>'x'+(i+1)+' = '+fmt(r)).join('\n'):'Hakuna mizizi kwenye kipindi hiki')}
else if(o==='d')so("f′("+x0+") ≈ "+fmt((fx(f,x0+h)-fx(f,x0-h))/(2*h)));else if(o==='d2')so("f″("+x0+") ≈ "+fmt((fx(f,x0+h)-2*fx(f,x0)+fx(f,x0-h))/(h*h)));
else if(o==='int'){const n=2000,w=(b-a)/n;let s=fx(f,a)+fx(f,b);for(let i=1;i<n;i++)s+=fx(f,a+i*w)*(i%2?4:2);so('∫ f dx ['+a+','+b+'] ≈ '+fmt(s*w/3)+'\n(Simpson, n=2000)')}
else if(o==='ext'){let mn=[0,Infinity],mx=[0,-Infinity];for(let i=0;i<=4000;i++){const x=a+(b-a)*i/4000,y=fx(f,x);if(isFinite(y)){if(y<mn[1])mn=[x,y];if(y>mx[1])mx=[x,y]}}so('Min: f('+fmt(mn[0])+') = '+fmt(mn[1])+'\nMax: f('+fmt(mx[0])+') = '+fmt(mx[1]))}
else if(o==='tay'){let t=[],fa=fx(f,x0);const d=[fa,(fx(f,x0+h)-fx(f,x0-h))/(2*h),(fx(f,x0+h)-2*fa+fx(f,x0-h))/(h*h)];so('Taylor kuzunguka x₀='+x0+':\nf(x) ≈ '+fmt(d[0])+' + '+fmt(d[1])+'(x−x₀) + '+fmt(d[2]/2)+'(x−x₀)²')}});
// Stats
$('#sg').onclick=()=>{const X=$('#sd').value.split(/[\s,;]+/).filter(Boolean).map(Number).filter(isFinite),n=X.length;if(!n){$('#so2').textContent='Weka data';return}const S=[...X].sort((a,b)=>a-b),sum=X.reduce((a,b)=>a+b,0),m=sum/n,q=p=>{const i=(n-1)*p,l=Math.floor(i);return S[l]+(S[Math.min(l+1,n-1)]-S[l])*(i-l)},ss=X.reduce((a,b)=>a+(b-m)**2,0),cnt={};X.forEach(v=>cnt[v]=(cnt[v]||0)+1);const mc=Math.max(...Object.values(cnt));
let t=`n = ${n}\nJumla = ${fmt(sum)}\nWastani = ${fmt(m)}\nMedian = ${fmt(q(.5))}\nMode = ${Object.keys(cnt).filter(k=>cnt[k]===mc).join(', ')}\nMin = ${fmt(S[0])}   Max = ${fmt(S[n-1])}\nRange = ${fmt(S[n-1]-S[0])}\nQ1 = ${fmt(q(.25))}   Q3 = ${fmt(q(.75))}\nTofauti (pop) = ${fmt(ss/n)}\nSD (pop) = ${fmt(Math.sqrt(ss/n))}\nSD (sample) = ${n>1?fmt(Math.sqrt(ss/(n-1))):'-'}\nGeometric mean = ${S[0]>0?fmt(Math.exp(X.reduce((a,b)=>a+Math.log(b),0)/n)):'-'}`;
const Y=$('#sy').value.split(/[\s,;]+/).filter(Boolean).map(Number);if(Y.length===n){const my=Y.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0,syy=0;X.forEach((x,i)=>{sxy+=(x-m)*(Y[i]-my);sxx+=(x-m)**2;syy+=(Y[i]-my)**2});const a=sxy/sxx,b=my-a*m;t+=`\n\nRegression: y = ${fmt(a)}x + ${fmt(b)}\nr = ${fmt(sxy/Math.sqrt(sxx*syy))}   R² = ${fmt(sxy*sxy/(sxx*syy))}`}$('#so2').textContent=t};

$('#uo').textContent=Object.keys(UN[c]).map(u=>fmt(v*UN[c][a]/UN[c][u])+' '+u).join('\n')+'\n\n'+v+' '+a+' = '+fmt(v*UN[c][a]/UN[c][b])+' '+b}
