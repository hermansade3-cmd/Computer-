<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accessibility</title>
<style>
:root{--bg:#f3f3f3;--fg:#1a1a1a;--card:#fff;--bd:#dcdcdc;--mut:#5f5f5f;--ac:#0067c0;--acf:#fff;--hv:#eaf2fb;--sel:#dfeaf7;color-scheme:light}
.dk{--bg:#202020;--fg:#f3f3f3;--card:#2c2c2c;--bd:#454545;--mut:#a9a9a9;--ac:#4cc2ff;--acf:#00263d;--hv:#383838;--sel:#34414d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.app{display:flex;min-height:100%}
nav{width:204px;flex:none;padding:12px 8px;border-right:1px solid var(--bd);position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
.ttl{display:flex;align-items:center;gap:8px;padding:2px 8px 12px;font-size:15px;font-weight:600}
.srch{position:relative;margin:0 0 10px}
.srch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mut)}
.srch input{width:100%;padding:7px 9px 7px 30px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg);font:inherit}
.nb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;margin:2px 0;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;cursor:pointer;position:relative}
.nb:hover{background:var(--hv)}
.nb.on{background:var(--sel);font-weight:600}
.nb.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--ac)}
main{flex:1;min-width:0;padding:16px 20px 40px}
.in{max-width:780px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hd h1{margin:0;font-size:22px;font-weight:600;flex:1;min-width:140px}
.chip{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--sel)}
.sub{color:var(--mut);margin:0 0 4px}
h3{font-size:13px;font-weight:600;margin:20px 0 8px;color:var(--mut)}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.row:last-child,.pn:last-child{border-bottom:0}
.lab{min-width:0;flex:1}.lab b{display:block;font-weight:600}.lab span{display:block;color:var(--mut);font-size:12.5px}
.ctl{display:flex;align-items:center;gap:10px;flex:none}
.ctl output{min-width:54px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
input[type=range]{width:160px;accent-color:var(--ac)}
select,textarea{padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;max-width:100%}
textarea{width:100%;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
.btn:hover{background:var(--hv)}.btn:disabled{opacity:.5;cursor:default}
.btn.p{background:var(--ac);color:var(--acf);border-color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sw{width:42px;height:22px;border-radius:11px;border:1px solid var(--mut);background:transparent;position:relative;padding:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--mut);transition:transform .15s,background .15s}
.sw.on{background:var(--ac);border-color:var(--ac)}
.sw.on::after{transform:translateX(20px);background:var(--acf)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pc{text-align:left;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:4px}
.pc:hover{background:var(--hv)}
.pc b{display:flex;align-items:center;gap:8px}.pc span{color:var(--mut);font-size:12.5px}
.pn{padding:12px 14px;border-bottom:1px solid var(--bd)}
.pn .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tr{min-height:96px;max-height:200px;overflow:auto;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);font-size:16px;white-space:pre-wrap}
.m{color:var(--mut);font-size:12.5px}
kbd{padding:1px 6px;border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;background:var(--bg);font:12px Consolas,monospace}
pre{margin:0;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);font:12px Consolas,monospace;white-space:pre-wrap;word-break:break-all}
table{width:100%;border-collapse:collapse}
td{padding:6px 4px;border-bottom:1px solid var(--bd)}tr:last-child td{border-bottom:0}td:first-child{width:46%;color:var(--mut)}
#msg{min-height:20px;margin:6px 0 0;color:var(--ac);font-weight:600}
@media(max-width:600px){
 .app{flex-direction:column}
 nav{width:100%;height:auto;position:sticky;top:0;z-index:5;background:var(--bg);border-right:0;border-bottom:1px solid var(--bd);padding:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
 .ttl{display:none}.srch{width:100%;margin:0 0 4px}
 .nb{width:auto;padding:7px 10px;margin:0}.nb.on::before{display:none}
 main{padding:12px 12px 40px}
 .row{flex-wrap:wrap}.ctl{width:100%}input[type=range]{flex:1;width:auto}
}
[hidden]{display:none !important}
.app{background:var(--bg);color:var(--fg)}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.col>main{flex:1}
.acc-keep{background:var(--bg);color:var(--fg)}
#dock{position:sticky;bottom:0;z-index:6;border-top:3px solid var(--ac);background:var(--card);box-shadow:0 -6px 20px rgba(0,0,0,.25);max-height:70vh;overflow:auto}
.dk-s{padding:10px 16px}.dk-s p{margin:4px 0 0;font-size:16px}
.dk-c{padding:10px 16px;border-top:1px solid var(--bd);background:var(--card)}
.dk-q{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.dk-b{display:flex;gap:8px;flex-wrap:wrap}
.dk-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.dk-g h4{grid-column:1/-1;margin:6px 0 0;font-size:13px;color:var(--mut)}
.sw2{padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;font:inherit;text-align:left}
.sw2[aria-pressed=true]{outline:3px solid var(--ac);outline-offset:2px}
.sw2 b{display:block;font-size:18px}.sw2 span{font-size:11.5px}
.app{min-height:calc(100% - var(--rh,0px))}
@media(min-width:601px){nav{top:var(--rh,0px);height:calc(100vh - var(--rh,0px))}}
</style></head><body>
<div id="rtop" class="acc-safe acc-keep"></div>
<div class="app">
 <nav class="acc-keep" aria-label="Sehemu za Accessibility">
  <div class="ttl" id="ttl"></div>
  <div class="srch"><span id="sic"></span><input type="search" id="q" placeholder="Tafuta mpangilio" aria-label="Tafuta mpangilio"></div>
  <div id="nv" style="display:contents"></div>
 </nav>
 <div class="col"><main class="acc-keep"><div class="in">
  <div class="hd"><h1 id="h1"></h1></div>
  <p class="sub" id="sub"></p>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="pg"></div>
 </div></main>
 <section id="dock" hidden aria-label="Hakiki mabadiliko">
  <div class="dk-s"><b>Hakiki: maandishi ya mfano</b><p>Habari! Hivi ndivyo maandishi yatakavyoonekana kwa mipangilio yako mpya. Kama unayasoma vizuri bonyeza Weka, vinginevyo chagua muundo mwingine. <a href="#" id="dka">Kiungo cha mfano</a></p></div>
  <div class="dk-c acc-keep">
   <div class="dk-q"><span>Je, unasoma vizuri? Usipothibitisha, mabadiliko yatarudishwa nyuma yenyewe.</span><span class="chip" id="dkt"></span></div>
   <div class="dk-b"><button type="button" class="btn p" id="dko">Weka</button><button type="button" class="btn" id="dku">Rudisha nyuma</button><button type="button" class="btn" id="dkg" aria-expanded="false" aria-controls="dkp">Muundo mwingine</button><button type="button" class="btn" id="dks">Acha kuhesabu</button></div>
   <div id="dkp" hidden></div>
  </div>
 </section>
 </div>
</div>

<script>
/* ============ INJINI YA MFUMO MZIMA (inaendeshwa kwenye desktop/parent) ============ */
function RT(){
 'use strict';
 const VER=4,W=window,D=document;
 if(W.SADEACC&&W.SADEACC.v>=VER)return;
 if(W.SADEACC&&W.SADEACC.destroy){try{W.SADEACC.destroy()}catch(e){}}
 const BASE={isz:100,hc:0,gs:0,inv:0,ra:0};
 const DEF={br:100,ct:100,sa:100,nl:0,cb:'none',zoom:100,czoom:100,bigsb:0,nodeco:0,
  font:'def',bold:0,theme:'none',ls:0,ws:0,lh:0,lnk:0,foc:0,
  cursz:0,curcol:'#000000',ring:0,clk:0,dwell:0,dwt:1200,clksnd:0,
  rul:0,rulh:48,mask:0,hov:0,tr:1,tp:1,tv:100,tvoice:'',rest:0,restm:20,
  capbar:0,vfl:0,osk:0,hot:1};
 const CFG=['dwt','rulh','restm','tr','tp','tv','tvoice','curcol','hot'];
 const LSg=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
 const LSs=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
 let X=Object.assign({},DEF);
 try{Object.assign(X,JSON.parse(LSg('sade_acc_x')||'{}'))}catch(e){}
 Object.keys(X).forEach(k=>{if(!(k in DEF))delete X[k]});

 const FF={hyper:"'Atkinson Hyperlegible',Verdana,sans-serif",lexend:"'Lexend',Verdana,sans-serif",comic:"'Comic Sans MS','Comic Neue','Chalkboard SE',sans-serif",serif:"Georgia,'Times New Roman',serif",mono:"Consolas,'Courier New',monospace"};
 const FU={hyper:'https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap',lexend:'https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap'};
 const TH={yb:['#000000','#ffff00','#66ccff'],wb:['#000000','#ffffff','#7fd1ff'],by:['#ffff66','#000000','#00008b'],gb:['#000000','#33ff66','#99ffcc'],sepia:['#f4ecd8','#3b2f1e','#7a3e00'],bw:['#ffffff','#000000','#0000cc']};

 let ov,mk1,mk2,rul,ring,dwi,ok,ac,sh=0,cp=0,fl=0,tt,rI=0,rKey='',mo,sI,hvT,lastHv=null;
 const dw={x:0,y:0,cx:0,cy:0,doc:null,t0:0,on:false,lock:false,raf:0,lx:0,ly:0};
 const R={v:VER,def:Object.assign({},BASE,DEF),subs:[],last:null,mx:null,my:null,_b:0};

 /* ---- hali ya msingi (inashirikiana na SADE ya desktop kama ipo) ---- */
 function base(){const S=W.SADE;if(S&&S.Sx)return S.Sx;if(!R._b2){try{R._b2=JSON.parse(LSg('sade_acc')||'{}')}catch(e){R._b2={}}}return R._b2}
 function saveBase(){const S=W.SADE;
  if(S&&S.Sx){try{S.saveS&&S.saveS();S.applyA&&S.applyA()}catch(e){}}
  else{LSs('sade_acc',JSON.stringify(R._b2||{}));try{D.documentElement.style.setProperty('--is',((R._b2||{}).isz||100)/100)}catch(e){}}}
 R.get=k=>{if(k in BASE){const v=base()[k];return v===undefined?BASE[k]:v}return X[k]};
 R.set=(k,v)=>{
  if(k in BASE){base()[k]=v;saveBase()}
  else if(k in DEF){X[k]=v;LSs('sade_acc_x',JSON.stringify(X))}
  else return;
  apply();R.emit()};
 R.all=()=>{const o={};Object.keys(R.def).forEach(k=>o[k]=R.get(k));return o};
 R.active=()=>Object.keys(R.def).filter(k=>!CFG.includes(k)&&R.get(k)!=R.def[k]).length;
 R.reset=(keep)=>{const b=base();Object.keys(BASE).forEach(k=>b[k]=BASE[k]);saveBase();X=Object.assign({},DEF);LSs('sade_acc_x',JSON.stringify(X));try{W.speechSynthesis&&W.speechSynthesis.cancel()}catch(e){}if(!keep){apply();R.emit()}};
 R.preset=o=>{R.reset(true);const b=base();Object.keys(o).forEach(k=>{if(k in BASE)b[k]=o[k];else if(k in DEF)X[k]=o[k]});saveBase();LSs('sade_acc_x',JSON.stringify(X));apply();R.emit()};
 R.load=o=>{let n=0;Object.keys(o||{}).forEach(k=>{if(!(k in R.def))return;let v=o[k];const d=R.def[k];if(typeof d==='number'){v=Number(v);if(!isFinite(v))return}else v=String(v);if(k in BASE)base()[k]=v;else X[k]=v;n++});saveBase();LSs('sade_acc_x',JSON.stringify(X));apply();R.emit();return n};
 R.sub=f=>R.subs.push(f);R.TH=TH;
 R.reload=()=>{try{X=Object.assign({},DEF,JSON.parse(LSg('sade_acc_x')||'{}'))}catch(e){}R._b2=null;apply();R.emit()};
 R.emit=()=>R.subs.forEach(f=>{try{f()}catch(e){}});

 /* ---- CSS ---- */
 const cl=(v,a,b)=>Math.min(b,Math.max(a,+v||100));
 function filt(){const f=[];
  if(R.get('hc'))f.push('contrast(1.3) saturate(1.15)');
  if(cl(X.ct,70,200)!=100)f.push('contrast('+cl(X.ct,70,200)/100+')');
  if(cl(X.br,60,150)!=100)f.push('brightness('+cl(X.br,60,150)/100+')');
  if(X.sa!=100)f.push('saturate('+X.sa/100+')');
  if(X.nl>0)f.push('sepia('+X.nl/100+') saturate(1.1)');
  if(/^(prot|deut|trit)$/.test(X.cb))f.push('url(#sade-cb-'+X.cb+')');
  if(R.get('gs'))f.push('grayscale(1)');
  if(R.get('inv'))f.push('invert(1) hue-rotate(180deg)');
  return f}
 function lum(h){const n=parseInt(h.slice(1),16);return .299*(n>>16)+.587*(n>>8&255)+.114*(n&255)}
 function curUrl(sz,col){const st=lum(col)>150?'#000':'#fff';
  const s='<svg xmlns="http://www.w3.org/2000/svg" width="'+sz+'" height="'+sz+'" viewBox="0 0 32 32"><path d="M5 3v21l5.5-5 4 9 4-1.8-4-8.7H22z" fill="'+col+'" stroke="'+st+'" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  return 'url("data:image/svg+xml,'+encodeURIComponent(s)+'") '+Math.round(5*sz/32)+' '+Math.round(3*sz/32)+', auto'}
 function css(root){
  const o=[],t=':not(svg):not(svg *):not(#sade-acc-ov):not(#sade-acc-ov *):not(.acc-safe):not(.acc-safe *)';
  if(root){const f=filt();if(f.length)o.push('html{filter:'+f.join(' ')+' !important}');if(X.zoom!=100)o.push('html{zoom:'+X.zoom/100+' !important}')}
  else if(X.czoom!=100)o.push('html{zoom:'+X.czoom/100+' !important}');
  if(FF[X.font])o.push('*'+t+':not(code):not(pre):not(kbd):not(samp):not(canvas){font-family:'+FF[X.font]+' !important}');
  if(X.bold)o.push('*'+t+'{font-weight:700 !important}');
  if(!root){let s='';if(X.ls)s+='letter-spacing:'+X.ls+'px !important;';if(X.ws)s+='word-spacing:'+X.ws+'px !important;';if(X.lh)s+='line-height:'+X.lh/10+' !important;';if(s)o.push('body *'+t+'{'+s+'}')}
  const th=TH[X.theme];
  if(th)o.push('html,body,*'+t+':not(.acc-keep):not(.acc-keep *):not(img):not(video):not(canvas):not(iframe){background-color:'+th[0]+' !important;color:'+th[1]+' !important;border-color:'+th[1]+' !important;-webkit-text-fill-color:'+th[1]+' !important;text-shadow:none !important}a,a *{color:'+th[2]+' !important;-webkit-text-fill-color:'+th[2]+' !important}');
  if(X.lnk)o.push('a,[role=link]{text-decoration:underline !important;text-decoration-thickness:2px !important;text-underline-offset:3px !important;background-image:linear-gradient(rgba(255,214,0,.28),rgba(255,214,0,.28)) !important}');
  if(X.foc)o.push('*:focus-visible{outline:3px solid #ffbf00 !important;outline-offset:2px !important;box-shadow:0 0 0 6px #000 !important}');
  if(X.cursz>0){const u=curUrl(+X.cursz,/^#[0-9a-f]{6}$/i.test(X.curcol)?X.curcol:'#000000');
   o.push('*{cursor:'+u+' !important}input:not([type=button]):not([type=checkbox]):not([type=radio]):not([type=range]):not([type=submit]):not([type=color]),textarea,[contenteditable=true]{cursor:text !important}')}
  if(X.bigsb)o.push('*::-webkit-scrollbar{width:18px;height:18px}*::-webkit-scrollbar-track{background:rgba(127,127,127,.25)}*::-webkit-scrollbar-thumb{background:#0067c0;border-radius:9px;border:3px solid transparent;background-clip:content-box}*::-webkit-scrollbar-thumb:hover{background:#005a9e;background-clip:content-box}');
  if(R.get('ra'))o.push('*,*::before,*::after{animation-duration:.001s !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.001s !important;transition-delay:0s !important;scroll-behavior:auto !important}');
  if(X.nodeco)o.push('*,*::before,*::after{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;text-shadow:none !important}');
  return o.join('\n')}
 function cbm(kind){
  const S={prot:[[.152286,1.052583,-.204868],[.114503,.786281,.099216],[-.003882,-.048116,1.051998]],deut:[[.367322,.860646,-.227968],[.280085,.672501,.047413],[-.01182,.04294,.968881]],trit:[[1.255528,-.076749,-.178779],[-.078411,.930809,.147602],[.004733,.691367,.3039]]}[kind];
  const M=kind==='trit'?[[1,.7,0],[0,1,0],[0,.7,1]]:[[0,0,0],[.7,1,0],[.7,0,1]];
  const E=S.map((r,i)=>r.map((v,j)=>(i===j?1:0)-v));
  const C=[0,1,2].map(i=>[0,1,2].map(j=>(i===j?1:0)+M[i][0]*E[0][j]+M[i][1]*E[1][j]+M[i][2]*E[2][j]));
  return C.map(r=>r.map(v=>v.toFixed(4)).join(' ')+' 0 0').join(' ')+' 0 0 0 1 0'}

 /* ---- docs (desktop + programu ndani ya iframe) ---- */
 function docs(){const out=[];const walk=(d,fr,dep)=>{out.push([d,fr]);if(dep>3)return;d.querySelectorAll('iframe,frame').forEach(f=>{try{const cd=f.contentDocument;if(cd&&cd.documentElement)walk(cd,f,dep+1)}catch(e){}})};walk(D,null,0);return out}
 function inject(d,fr){
  let st=d.getElementById('sade-acc-css');
  if(!st){st=d.createElement('style');st.id='sade-acc-css';(d.head||d.documentElement).appendChild(st)}
  const t=css(!fr);if(st.textContent!==t)st.textContent=t;
  let l=d.getElementById('sa-font');const u=FU[X.font];
  if(u){if(!l){l=d.createElement('link');l.id='sa-font';l.rel='stylesheet';(d.head||d.documentElement).appendChild(l)}if(l.href!==u)l.href=u}else if(l)l.remove();
  if(!fr){const need=/^(prot|deut|trit)$/.test(X.cb);let s=d.getElementById('sade-acc-svg');
   if(need&&!s&&d.body){s=d.createElement('div');s.id='sade-acc-svg';s.setAttribute('aria-hidden','true');s.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    s.innerHTML='<svg width="0" height="0">'+['prot','deut','trit'].map(k=>'<filter id="sade-cb-'+k+'" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="'+cbm(k)+'"/></filter>').join('')+'</svg>';d.body.appendChild(s)}}
  if(fr&&!fr.__saL){fr.__saL=1;fr.addEventListener('load',()=>setTimeout(scan,0))}}
 function scan(){if(W.SADEACC!==R)return;docs().forEach(([d,fr])=>{hook(d,fr);inject(d,fr)})}

 /* ---- uwekaji wa vifaa (overlay) ---- */
 function mkOv(){
  if(ov&&ov.isConnected)return ov;if(!D.body)return null;
  ov=D.createElement('div');ov.id='sade-acc-ov';ov.setAttribute('aria-hidden','true');
  ov.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:2147483600;overflow:hidden';
  const mk=(id,c)=>{const d=D.createElement('div');d.id=id;d.style.cssText='position:absolute;display:none;'+c;ov.appendChild(d);return d};
  mk1=mk('sa-m1','left:0;right:0;top:0;background:rgba(0,0,0,.62)');
  mk2=mk('sa-m2','left:0;right:0;bottom:0;background:rgba(0,0,0,.62)');
  rul=mk('sa-rl','left:0;right:0;background:rgba(255,226,0,.22);border-top:2px solid rgba(255,190,0,.95);border-bottom:2px solid rgba(255,190,0,.95)');
  ring=mk('sa-rg','left:0;top:0;width:56px;height:56px;border-radius:50%;border:4px solid #ffc800;background:rgba(255,200,0,.2);box-shadow:0 0 0 2px rgba(0,0,0,.5)');
  dwi=mk('sa-dw','left:0;top:0;width:46px;height:46px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 13px,#000 14px);mask:radial-gradient(circle,transparent 13px,#000 14px)');

 function capEl(){const w=el('div','pn');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  w.innerHTML='<b>Manukuu ya moja kwa moja</b><div class="m" style="margin:2px 0 8px">Kompyuta inasikiliza sauti kupitia microphone na kuiandika. Unahitaji kuruhusu microphone.</div>';
  if(!SR){w.innerHTML+='<div class="m">Kivinjari hiki hakisaidii utambuzi wa sauti. Tumia Chrome au Edge.</div>';return w}
  const row=el('div','r');row.style.marginTop='0';
  const ls=el('select');ls.setAttribute('aria-label','Lugha');[['sw-TZ','Kiswahili (Tanzania)'],['sw-KE','Kiswahili (Kenya)'],['en-US','English (US)'],['en-GB','English (UK)']].forEach(a=>{const o=el('option');o.value=a[0];o.textContent=a[1];ls.appendChild(o)});
  const go=el('button','btn p',svg('mic',16)+'Anza kusikiliza');go.type='button';
  const cp=el('button','btn',svg('copy',16)+'Nakili');cp.type='button';
  const cl=el('button','btn',svg('reset',16)+'Futa');cl.type='button';
  row.append(ls,go,cp,cl);w.appendChild(row);
  const box=el('div','tr');box.style.marginTop='8px';box.setAttribute('aria-live','polite');box.textContent='';w.appendChild(box);
  let rec=null,run=false,fin='';
  const stop=()=>{run=false;try{rec&&rec.stop()}catch(e){}go.innerHTML=svg('mic',16)+'Anza kusikiliza';go.classList.add('p');try{R.caption('')}catch(e){}};
  go.onclick=()=>{
   if(run){stop();return}
   rec=new SR();rec.lang=ls.value;rec.continuous=true;rec.interimResults=true;run=true;
   go.innerHTML=svg('stop',16)+'Acha kusikiliza';go.classList.remove('p');
   rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript.trim()+'\n';else it+=r[0].transcript}
    box.textContent=fin+it;box.scrollTop=box.scrollHeight;const live=(it||fin.trim().split('\n').pop()||'').trim();if(R.get('capbar')&&live){try{R.caption(live)}catch(e){}}};
   rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){say('Microphone haijaruhusiwa. Ruhusu kwenye kivinjari.');stop()}else if(e.error==='network'){say('Utambuzi wa sauti unahitaji intaneti.');stop()}};

   try{rec.start()}catch(e){stop()}};
  cp.onclick=async()=>{say((await copy(box.textContent))?'Imenakiliwa':'Imeshindwa kunakili')};
  cl.onclick=()=>{fin='';box.textContent=''};
  window.addEventListener('pagehide',stop);
  return w}

 const ALL=[];PAGES.forEach(p=>p.s.forEach(s=>s.i.forEach(it=>{if(!it.q)ALL.push({it,p})})));

 function row(it){
  if(it.t==='cu'){const e=it.f();return e}
  const r=el('div','row'),l=el('div','lab','<b>'+it.l+'</b>'+(it.d?'<span>'+it.d+'</span>':'')),c=el('div','ctl');
  if(it.t==='tg'){const b=el('button','sw');b.type='button';b.setAttribute('role','switch');b.setAttribute('aria-label',it.l);b.onclick=()=>R.set(it.k,R.get(it.k)?0:1);ups.push(()=>{const v=!!R.get(it.k);b.setAttribute('aria-checked',v);b.classList.toggle('on',v)});c.appendChild(b)}
  else if(it.t==='rg'){const i=el('input'),o=el('output');i.type='range';i.min=it.min;i.max=it.max;i.step=it.step;i.setAttribute('aria-label',it.l);i.oninput=()=>R.set(it.k,+i.value);ups.push(()=>{const v=+R.get(it.k);i.value=v;o.textContent=it.f(v)});c.append(i,o)}
  else if(it.t==='sl'){const s=el('select');s.setAttribute('aria-label',it.l);it.o.forEach(a=>{const o=el('option');o.value=a[0];o.textContent=a[1];s.appendChild(o)});const num=typeof R.def[it.k]==='number';s.onchange=()=>R.set(it.k,num?+s.value:s.value);ups.push(()=>{s.value=R.get(it.k)});c.appendChild(s)}
  r.append(l,c);return r}

 let cur='home';
 function render(){
  const m=$('#pg');m.innerHTML='';ups.length=0;
  const q=$('#q').value.trim().toLowerCase();
  if(q){
   $('#h1').textContent='Matokeo ya utafutaji';$('#sub').textContent='';
   const hits=ALL.filter(a=>(a.it.l+' '+(a.it.d||'')+' '+a.p.n).toLowerCase().includes(q));
   if(!hits.length){m.innerHTML='<div class="grp"><div class="pn"><b>Hakuna kilichopatikana</b><div class="m">Jaribu neno lingine, mfano "rangi", "sauti" au "kishale".</div></div></div>'}
   else{const g=el('div','grp');hits.forEach(a=>g.appendChild(row(a.it)));m.appendChild(g)}
  }else{
   const p=PAGES.find(x=>x.id===cur);$('#h1').textContent=p.n;$('#sub').textContent=p.sub;
   p.s.forEach(s=>{if(s.h)m.appendChild(el('h3',null,s.h));const g=el('div','grp');s.i.forEach(it=>g.appendChild(row(it)));m.appendChild(g)})}
  nav();sync()}
 function nav(){const q=$('#q').value.trim();[...$('#nv').children].forEach(b=>b.classList.toggle('on',!q&&b.dataset.p===cur))}
 function sync(){ups.forEach(f=>{try{f()}catch(e){}});const n=R.active();CNT.textContent=n?n+' zimewashwa':'Hakuna kilichobadilishwa'}
 PAGES.forEach(p=>{const b=el('button','nb',svg(p.ic,18)+'<span>'+p.n+'</span>');b.type='button';b.dataset.p=p.id;b.onclick=()=>{cur=p.id;$('#q').value='';render()};$('#nv').appendChild(b)});
 $('#q').oninput=render;

 /* ---- hakiki na uthibitisho wa mabadiliko ---- */
 const CD=30,dock=$('#dock'),dkt=$('#dkt'),dkp=$('#dkp'),dkg=$('#dkg'),dks=$('#dks');
 const THN=[['none','Chaguo-msingi'],['yb','Njano juu ya nyeusi'],['wb','Nyeupe juu ya nyeusi'],['by','Nyeusi juu ya njano'],['gb','Kijani juu ya nyeusi'],['sepia','Sepia'],['bw','Nyeusi juu ya nyeupe']];
 let snap=R.all(),cmt=JSON.stringify(snap),cd=0,cdT=0,ui=0;
 ['pointerdown','keydown','input','change'].forEach(ev=>document.addEventListener(ev,()=>{ui=Date.now()},true));
 const sws=[];
 (function(){const T=R.TH||{},g=el('div','dk-g');
  g.appendChild(el('h4',null,'Rangi na mandhari'));
  THN.forEach(a=>{const c=T[a[0]],b=el('button','sw2','<b>Aa</b><span>'+a[1]+'</span>');b.type='button';
   if(c)b.style.cssText='background:'+c[0]+';color:'+c[1]+';border-color:'+c[1];
   b.onclick=()=>R.set('theme',a[0]);sws.push([a[0],b]);g.appendChild(b)});
  g.appendChild(el('h4',null,'Mbinu za haraka'));
  PRE.forEach(p=>{const b=el('button','btn',svg(p.ic,16)+p.n);b.type='button';b.onclick=()=>{R.preset(p.v);say('Imewashwa: '+p.n)};g.appendChild(b)});
  dkp.appendChild(g)})();
 function gs(){const c=R.get('theme');sws.forEach(s=>s[1].setAttribute('aria-pressed',s[0]===c))}
 function stopCd(){clearInterval(cdT);cdT=0}
 function paintCd(){dkt.textContent=cdT?'Itarudishwa baada ya '+cd+' s':'Muda umesimamishwa'}
 function startCd(){stopCd();cd=CD;dks.hidden=false;cdT=setInterval(()=>{if(!document.hasFocus())return;cd--;if(cd<=0){revert(1);return}paintCd()},1000);paintCd()}
 function hideDock(){stopCd();dock.hidden=true;dkp.hidden=true;dkg.setAttribute('aria-expanded','false')}
 function commit(){snap=R.all();cmt=JSON.stringify(snap);hideDock()}
 function revert(auto){stopCd();R.load(snap);commit();say(auto?'Hukuthibitisha, kwa hiyo mabadiliko yamerudishwa nyuma':'Mabadiliko yamerudishwa nyuma')}
 function onChg(){gs();
  if(JSON.stringify(R.all())===cmt){hideDock();return}
  if(Date.now()-ui>8000){commit();return}
  const was=dock.hidden;dock.hidden=false;if(was||cdT)startCd()}
 $('#dko').onclick=()=>{commit();say('Imewekwa. Mipangilio imehifadhiwa.')};
 $('#dku').onclick=()=>revert(0);
 dks.onclick=()=>{stopCd();paintCd();dks.hidden=true};
 dkg.onclick=()=>{const o=dkp.hidden;dkp.hidden=!o;dkg.setAttribute('aria-expanded',o)};
 $('#dka').onclick=e=>e.preventDefault();
 R.sub(onChg);gs();
 /* ---- upau wa Rudisha: haubadiliki na accessibility ---- */
 const rtv=()=>document.documentElement.style.setProperty('--rh',rt.offsetHeight+'px');
 function safe(){const fr=P!==window,z=(+R.get('zoom')||100)/100,cz=fr?(+R.get('czoom')||100)/100:1;
  BAR.style.zoom=String(1/(z*cz));rt.style.filter=R.get('inv')?'hue-rotate(180deg) invert(1)':'';rtv()}
 R.sub(safe);safe();addEventListener('resize',rtv);try{new ResizeObserver(rtv).observe(rt)}catch(e){}
 render();
})();
</script></body></html>
