<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML/CSS/JS Editor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#12141c;color:#dde;font:13px Segoe UI,system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}#bar{display:flex;gap:6px;padding:6px;background:#1c2030;align-items:center;flex-wrap:wrap}
button,select{background:#e44d26;color:#fff;border:0;padding:5px 11px;border-radius:4px;cursor:pointer;font:inherit}button.g,select{background:#343a55}
#main{flex:1;display:flex;min-height:0}#L{flex:1;display:flex;flex-direction:column;min-width:0}#tabs{display:flex}#tabs div{flex:1;text-align:center;padding:7px;background:#1c2030;cursor:pointer;border-bottom:3px solid transparent}#tabs div.on{background:#12141c;border-color:var(--c)}
#ed{flex:1;position:relative}textarea{position:absolute;inset:0;width:100%;height:100%;background:#12141c;color:#e6e6e6;border:0;outline:0;padding:10px;font:14px/20px Consolas,monospace;resize:none;white-space:pre;tab-size:2;display:none}textarea.on{display:block}
#R{flex:1;display:flex;flex-direction:column;border-left:3px solid #343a55;min-width:0}#pv{flex:1;border:0;background:#fff;width:100%}#cons{height:130px;background:#0b0d14;overflow:auto;font:12px Consolas,monospace;padding:6px;border-top:2px solid #343a55}#cons div{padding:1px 0;white-space:pre-wrap}.er{color:#ff6b6b}.wr{color:#ffd166}
#dev{display:flex;gap:4px}#ct{padding:3px 8px;background:#1c2030;font-size:11px;display:flex;gap:10px}
</style></head><body><div id="app"><div id="bar"><b>🌐 HTML/CSS/JS</b>
<button id="run">▶ Endesha</button><label><input type="checkbox" id="live" checked> Moja kwa moja</label>
<select id="tpl"><option value="">Kiolezo…</option></select>
<select id="dv"><option value="100%">Desktop</option><option value="768px">Tablet</option><option value="375px">Simu</option></select>
<button class="g" id="fmt">✨ Panga</button><button class="g" id="dl">⬇ Pakua .html</button><button class="g" id="op">↗ Fungua tab mpya</button><button class="g" id="up">⬆ Pakia</button><button class="g" id="rs">⟲ Anza upya</button><span id="st" style="margin-left:auto;opacity:.7"></span></div>
<div id="main"><div id="L"><div id="tabs"><div data-t="html" style="--c:#e44d26" class="on">HTML</div><div data-t="css" style="--c:#2965f1">CSS</div><div data-t="js" style="--c:#f7df1e">JavaScript</div></div>
<div id="ed"><textarea id="html" class="on" spellcheck="false"></textarea><textarea id="css" spellcheck="false"></textarea><textarea id="js" spellcheck="false"></textarea></div></div>
<div id="R"><div style="flex:1;display:flex;justify-content:center;background:#444;min-height:0"><iframe id="pv" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe></div><div id="ct"><b>Console</b><span id="cc" style="cursor:pointer">🗑 safisha</span></div><div id="cons"></div></div></div></div>
<script>
const $=s=>document.querySelector(s);const T={'Kadi ya wasifu':['<div class="card"><div class="av">N</div><h2>Mama Nancy</h2><p>Mbunifu · Tanzania</p><button id="b">Bonyeza</button></div>','body{display:grid;place-items:center;height:100vh;margin:0;background:linear-gradient(135deg,#667eea,#764ba2);font-family:sans-serif}.card{background:#fff;padding:30px;border-radius:20px;text-align:center;box-shadow:0 20px 50px #0005}.av{width:80px;height:80px;border-radius:50%;background:#f5576c;color:#fff;font-size:36px;display:grid;place-items:center;margin:0 auto 10px}button{background:#667eea;color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer}','let n=0;document.getElementById("b").onclick=e=>{n++;e.target.textContent="Umebonyeza "+n;console.log("click",n)}'],'Kikokotoo cha haraka':['<input id="a" type="number" value="5"> + <input id="b" type="number" value="7"> = <b id="r"></b>','body{font:20px sans-serif;padding:30px}input{width:70px;font-size:20px}','const f=()=>r.textContent=(+a.value)+(+b.value);a.oninput=b.oninput=f;f()'],'Saa ya dijiti':['<h1 id="c"></h1>','body{background:#000;color:#0f0;font:80px monospace;display:grid;place-items:center;height:100vh;margin:0}','setInterval(()=>c.textContent=new Date().toLocaleTimeString(),500)'],'Canvas (mpira)':['<canvas id="c" width="400" height="300"></canvas>','body{margin:0;background:#222;display:grid;place-items:center;height:100vh}canvas{background:#111;border:2px solid #0af}','const x=c.getContext("2d");let a=50,b=50,dx=3,dy=2;(function l(){x.clearRect(0,0,400,300);a+=dx;b+=dy;if(a<10||a>390)dx*=-1;if(b<10||b>290)dy*=-1;x.fillStyle="#0af";x.beginPath();x.arc(a,b,10,0,7);x.fill();requestAnimationFrame(l)})()'],'Tupu':['<h1>Habari</h1>','h1{font-family:sans-serif}','console.log("Tayari")']};
Object.keys(T).forEach(k=>$('#tpl').add(new Option(k,k)));
const sv=JSON.parse(localStorage.getItem('hce')||'null')||{html:T['Kadi ya wasifu'][0],css:T['Kadi ya wasifu'][1],js:T['Kadi ya wasifu'][2]};['html','css','js'].forEach(k=>$('#'+k).value=sv[k]);
const doc=()=>`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${$('#css').value}</style></head><body>${$('#html').value}<script>["log","error","warn","info"].forEach(k=>{const o=console[k];console[k]=(...a)=>{parent.postMessage({hc:k,m:a.map(x=>{try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*");o.apply(console,a)}});onerror=(m,s,l)=>{parent.postMessage({hc:"error",m:m+" (mstari "+l+")"},"*")};<\/script><script>${$('#js').value}<\/script></body></html>`;
function run(){localStorage.setItem('hce',JSON.stringify({html:$('#html').value,css:$('#css').value,js:$('#js').value}));$('#cons').innerHTML='';$('#pv').srcdoc=doc();$('#st').textContent='Imesasishwa '+new Date().toLocaleTimeString()}
addEventListener('message',e=>{if(e.data&&e.data.hc){const d=document.createElement('div');d.className=e.data.hc==='error'?'er':e.data.hc==='warn'?'wr':'';d.textContent='› '+e.data.m;$('#cons').append(d);$('#cons').scrollTop=1e9}});
let tm;document.querySelectorAll('textarea').forEach(t=>{t.addEventListener('input',()=>{if($('#live').checked){clearTimeout(tm);tm=setTimeout(run,500)}});t.addEventListener('keydown',e=>{const ins=x=>document.execCommand('insertText',false,x),s=t.selectionStart;if(e.key==='Tab'){e.preventDefault();ins('  ')}else if(e.key==='Enter'){e.preventDefault();const ln=t.value.slice(t.value.lastIndexOf('\n',s-1)+1,s);ins('\n'+ln.match(/^\s*/)[0]+(/[{(\[>]$/.test(ln.trim())&&!/<\/|\/>/.test(ln)?'  ':''))}else if(e.key==='>'&&t.id==='html'){const b=t.value.slice(0,s),m=b.match(/<([a-z][\w-]*)(\s[^<>]*)?$/i);if(m&&!/^(br|img|input|hr|meta|link)$/i.test(m[1])){e.preventDefault();ins('></'+m[1]+'>');t.selectionStart=t.selectionEnd=s+1}}else if('([{"\''.includes(e.key)&&t.selectionStart===t.selectionEnd){const p={'(':')','[':']','{':'}','"':'"',"'":"'"}[e.key];e.preventDefault();ins(e.key+p);t.selectionStart=t.selectionEnd=s+1}else if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();run()}})});
document.querySelectorAll('#tabs div').forEach(d=>d.onclick=()=>{document.querySelectorAll('#tabs div,textarea').forEach(x=>x.classList.remove('on'));d.classList.add('on');$('#'+d.dataset.t).classList.add('on');$('#'+d.dataset.t).focus()});
$('#run').onclick=run;$('#cc').onclick=()=>$('#cons').innerHTML='';$('#tpl').onchange=e=>{const t=T[e.target.value];if(t&&confirm('Badilisha msimbo wote?')){$('#html').value=t[0];$('#css').value=t[1];$('#js').value=t[2];run()}e.target.value=''};
$('#dv').onchange=e=>$('#pv').style.width=e.target.value;
$('#fmt').onclick=()=>{const f=$('#css');f.value=f.value.replace(/\s*\{\s*/g,' {\n  ').replace(/;\s*(?!\n\s*})/g,';\n  ').replace(/\s*\}\s*/g,'\n}\n').replace(/\n\s+\n/g,'\n');let d=0;$('#html').value=$('#html').value.replace(/>\s*</g,'>\n<').split('\n').map(l=>{l=l.trim();if(/^<\//.test(l))d=Math.max(0,d-1);const r='  '.repeat(d)+l;if(/^<[a-z][^>]*[^\/]>$/i.test(l)&&!/^<(br|img|input|hr|meta|link)/i.test(l)&&!/<\/\w+>$/.test(l))d++;return r}).join('\n');run()};
const full=()=>doc().replace(/parent\.postMessage\([^;]*;/g,'');
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>\n${$('#css').value}\n</style></head><body>\n${$('#html').value}\n<script>\n${$('#js').value}\n<\/script></body></html>`],{type:'text/html'}));a.download='ukurasa.html';a.click()};
$('#op').onclick=()=>{const w=window.open();w?(w.document.write(full()),w.document.close()):alert('Ruhusu popups')};
$('#up').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.html,.css,.js';i.onchange=async()=>{const f=i.files[0],t=await f.text(),n=f.name.split('.').pop();if(n==='css')$('#css').value=t;else if(n==='js')$('#js').value=t;else{const s=t.match(/<style[^>]*>([\s\S]*?)<\/style>/i),j=t.match(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/i);$('#css').value=s?s[1].trim():'';$('#js').value=j?j[1].trim():'';$('#html').value=(t.match(/<body[^>]*>([\s\S]*)<\/body>/i)||[0,t])[1].replace(/<script[\s\S]*?<\/script>/gi,'').trim()}run()};i.click()};
$('#rs').onclick=()=>{if(confirm('Futa kila kitu?')){['html','css','js'].forEach(k=>$('#'+k).value='');run()}};
run();
</script></body></html>
