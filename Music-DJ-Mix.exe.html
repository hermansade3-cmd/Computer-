{const n=SR*2,b=AC.createBuffer(2,n,SR);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}cv.buffer=b}fxIn.connect(cv);cv.connect(rw);rw.connect(master);
const mkDeck=(id,col)=>{const D={id,buf:null,src:null,off:0,start:0,playing:false,rate:1,cue:0,loop:null,bpm:120,name:'(hakuna wimbo)',peaks:null};

D.an=AC.createAnalyser();D.an.fftSize=256;D.gain.connect(D.an);D.hc=[null,null,null,null];D.plat=el.querySelector('.plat');D.vm=el.querySelector('.vm i');D.ang=0;
const cl=['#f43f5e','#facc15','#22c55e','#38bdf8'];D.hcb=[];for(let i=0;i<4;i++){const b=document.createElement('button');b.className='hc';b.textContent='H'+(i+1);b.onclick=e=>{if(!D.buf)return;if(e.shiftKey){D.hc[i]=null;b.style.background='';b.style.color='';return}if(D.hc[i]==null){D.hc[i]=pos(D);b.style.background=cl[i];b.style.color='#000'}else{const p=D.playing;if(p)pause(D);D.off=D.hc[i];play(D)}};el.querySelector('.hcs').append(b)}

D.el=el;D.cvs=el.querySelector('canvas');const q=s=>el.querySelector(s);
q('.pl').onclick=()=>D.playing?pause(D):play(D);q('.cu').onclick=()=>{if(D.playing){pause(D);D.off=D.cue}else if(Math.abs(pos(D)-D.cue)>.05)D.cue=pos(D);else play(D)};
q('.ld').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='audio/*';i.onchange=()=>load(D,i.files[0]);i.click()};
el.querySelectorAll('.lp').forEach(b=>b.onclick=()=>{const bl=60/D.bpm*b.dataset.b,s=pos(D);D.loop=[s,s+bl];el.querySelectorAll('.lp').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(D.playing){pause(D);D.off=s;play(D)}});q('.lx').onclick=()=>{D.loop=null;el.querySelectorAll('.lp').forEach(x=>x.classList.remove('on'));if(D.playing){const s=pos(D);pause(D);D.off=s;play(D)}};
q('.pt').oninput=e=>{D.rate=1+ +e.target.value/100;q('.pv').textContent=e.target.value+'%';if(D.src)D.src.playbackRate.value=D.rate;q('.bp').textContent=(D.bpm*D.rate).toFixed(1)};
q('.vl').oninput=e=>D.gain.gain.value=+e.target.value;q('.hi').oninput=e=>D.hi.gain.value=+e.target.value;q('.mi').oninput=e=>D.mi.gain.value=+e.target.value;q('.lo').oninput=e=>D.lo.gain.value=+e.target.value;
q('.fi').oninput=e=>{const v=+e.target.value;D.fl.frequency.value=v>0?20000*Math.pow(.02,v):20000;D.fh.frequency.value=v<0?20*Math.pow(300,-v):20};

D.q=q;return D},

const pos=D=>{if(!D.buf)return 0;let p=D.playing?D.off+(AC.currentTime-D.start)*D.rate:D.off;if(D.loop&&D.playing&&p>=D.loop[1]){const s=D.off;p=D.loop[0]+((p-D.loop[0])%(D.loop[1]-D.loop[0]))}return Math.min(p,D.buf.duration)};
function play(D){if(!D.buf)return;AC.resume();D.src=AC.createBufferSource();D.src.buffer=D.buf;D.src.playbackRate.value=D.rate;if(D.loop){D.src.loop=true;D.src.loopStart=D.loop[0];D.src.loopEnd=D.loop[1]}D.src.connect(D.lo);D.src.onended=()=>{};D.src.start(0,D.off);D.start=AC.currentTime;D.playing=true;D.q('.pl').textContent='⏸ Pause';D.q('.pl').classList.add('on')}
function pause(D){if(!D.playing)return;D.off=pos(D);try{D.src.stop()}catch(e){}D.playing=false;D.q('.pl').textContent='▶ Play';D.q('.pl').classList.remove('on')}
function peaks(D){const d=D.buf.getChannelData(0),n=500,k=Math.floor(d.length/n);D.peaks=new Float32Array(n);for(let i=0;i<n;i++){let m=0;for(let j=0;j<k;j+=8)m=Math.max(m,Math.abs(d[i*k+j]));D.peaks[i]=m}}

// Synth demo tracks
function synth(bpm,bass,hatsOn){const bars=8,beat=60/bpm,len=bars*4*beat,b=AC.createBuffer(2,Math.ceil(len*SR),SR),L=b.getChannelData(0),R=b.getChannelData(1);

// Pads
const PB1=[['Kick',t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(fxIn);g.connect(master);o.start(t);o.stop(t+.4)}],['Snare',t=>noise(t,.2,1800,'highpass',.7)],['Hat',t=>noise(t,.06,7000,'highpass',.4)],['Clap',t=>{[0,.02,.04].forEach(d=>noise(t+d,.1,1200,'bandpass',.5))}],['Tom',t=>tone(t,110,.3,'sine')],['Laser',t=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(1800,t);o.frequency.exponentialRampToValueAtTime(100,t+.3);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(master);g.connect(fxIn);o.start(t);o.stop(t+.3)}],['Bass',t=>tone(t,55,.6,'square',.35)],['Siren',t=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=6;lg.gain.value=300;l.connect(lg);lg.connect(o.frequency);o.frequency.value=800;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+1);o.connect(g);g.connect(master);o.start(t);l.start(t);o.stop(t+1);l.stop(t+1)}]];
function noise(t,d,f,ty,v){const n=AC.createBuffer(1,SR*d,SR),x=n.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=n;fl.type=ty;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(master);g.connect(fxIn);s.start(t)}
function tone(t,f,d,ty,v=.8){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f*2,t);o.frequency.exponentialRampToValueAtTime(f,t+.08);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);g.connect(fxIn);o.start(t);o.stop(t+d)}
const CH=(r,t)=>{[0,4,7,11].forEach((s,j)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=r*Math.pow(2,s/12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;o.connect(f);f.connect(g);g.connect(master);g.connect(fxIn);o.start(t);o.stop(t+.7)})};

onkeydown=e=>{if(/^[1-8]$/.test(e.key))$('#pads').children[e.key-1].onmousedown();else if(e.key==='ArrowLeft'){$('#xf').value=Math.max(-1,+$('#xf').value-.1);xf()}else if(e.key==='ArrowRight'){$('#xf').value=Math.min(1,+$('#xf').value+.1);xf()}};

const s=pos(D);D.q('.tm').textContent=Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');if(D.playing&&D.buf&&s>=D.buf.duration-.05&&!D.loop){pause(D);D.off=0}}
const vu=$('#vu').getContext('2d'),fd=new Uint8Array(an.frequencyBinCount);
const vd=new Uint8Array(128);
let autoOn=false,xt=null;$('#auto').onclick=()=>{autoOn=!autoOn;$('#auto').classList.toggle('on',autoOn)};
(function loop(){[A,B].forEach(D=>{D.ang+=D.playing?(D.scr?0:3*D.rate):0;D.plat.style.transform='rotate('+D.ang+'deg)';D.an.getByteTimeDomainData(vd);let m=0;for(let i=0;i<128;i++)m=Math.max(m,Math.abs(vd[i]-128));D.vm.style.height=Math.min(100,m/90*100)+'%'});
if(autoOn&&xt===null){[[A,B],[B,A]].forEach(([c,o])=>{if(xt===null&&c.playing&&c.buf&&!o.playing&&o.buf&&c.buf.duration-pos(c)<12){o.off=0;o.loop=null;const r=(c.bpm*c.rate)/o.bpm;o.rate=r;o.q('.pt').value=((r-1)*100).toFixed(1);o.q('.pv').textContent=((r-1)*100).toFixed(1)+'%';play(o);xt=c===A?1:-1}})}
if(xt!==null){const x=+$('#xf').value,n=x+xt*.004;$('#xf').value=Math.max(-1,Math.min(1,n));xf();if(Math.abs($('#xf').value)>=.999){const out=xt===1?A:B;pause(out);out.off=0;xt=null}}
wave(A,'#22d3ee');wave(B,'#e879f9');an.getByteFrequencyData(fd);vu.clearRect(0,0,200,80);for(let i=0;i<32;i++){const v=fd[i*2]/255*80;vu.fillStyle=`hsl(${180+i*4},100%,55%)`;vu.fillRect(i*6.2,80-v,5,v)}if(mr)$('#rt').textContent='⏺ '+Math.floor((Date.now()-t0)/1000)+'s';requestAnimationFrame(loop)})();
</script></body></html>
