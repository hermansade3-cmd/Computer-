<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Map</title>
<script>try{var S=JSON.parse(localStorage.getItem('sadevfs2')).set;document.documentElement.dataset.t=S.dark?'d':'l';document.documentElement.style.setProperty('--ac',S.acc||'#0067c0')}catch(e){}</script>
<style>:root{--ac:#0067c0;--bg:#f3f5f9;--fg:#141824;--cd:#fff;--bd:#d5dae3;--mu:#6b7385}[data-t=d]{--bg:#1b1f2a;--fg:#e8ebf2;--cd:#262b38;--bd:#394055;--mu:#9aa3b8}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:13px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;outline:0}button{cursor:pointer}button:hover,input:focus,select:focus{border-color:var(--ac)}.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb{display:flex;gap:6px;padding:6px 8px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}.sb{padding:3px 10px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);background:var(--cd)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fl{flex:1;min-height:0;overflow:auto}.mu{color:var(--mu)}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:2px;padding:8px}.gr button{height:38px;font-size:19px;padding:0}.gr .on{background:var(--ac);color:#fff}.pn{padding:10px;border-top:1px solid var(--bd);background:var(--cd);display:flex;gap:14px;align-items:center;flex-wrap:wrap}#bg{font-size:48px;width:70px;text-align:center}.pn textarea{flex:1;min-width:160px;height:50px;resize:none}</style></head><body><div class=tb><select id=bk></select><input id=q placeholder="Tafuta herufi au U+hex" style="flex:1"></div><div class="fl gr" id=g></div><div class=pn><div id=bg></div><div id=nf class=mu></div><textarea id=ta placeholder="Chagua herufi kuzikusanya hapa…"></textarea><button id=cp class=p>📋 Nakili</button><button id=cl>✕</button></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const B=[['Latin ya msingi',0x20,0x7e],['Latin-1',0xa0,0xff],['Latin Ext-A',0x100,0x17f],['Kigiriki',0x370,0x3ff],['Kisirili',0x400,0x4ff],['Kiarabu',0x600,0x6ff],['Alama za uandishi',0x2000,0x206f],['Sarafu',0x20a0,0x20cf],['Mishale',0x2190,0x21ff],['Hisabati',0x2200,0x22ff],['Masanduku',0x2500,0x257f],['Maumbo',0x25a0,0x25ff],['Alama mbalimbali',0x2600,0x26ff],['Dingbats',0x2700,0x27bf],['Emoji: nyuso',0x1f600,0x1f64f],['Emoji: alama',0x1f300,0x1f5ff]];
$('#bk').innerHTML=B.map((b,i)=>`<option value=${i}>${b[0]}`).join('');let sel=null;
function grid(a,z){const g=$('#g');g.innerHTML='';for(let c=a;c<=z;c++){const b=document.createElement('button');b.textContent=String.fromCodePoint(c);b.title='U+'+c.toString(16).toUpperCase().padStart(4,'0');b.onclick=()=>pick(c,b);g.append(b)}}
function pick(c,b){$$('#g .on').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');const ch=String.fromCodePoint(c),u=[...new TextEncoder().encode(ch)].map(x=>x.toString(16).toUpperCase().padStart(2,'0')).join(' ');$('#bg').textContent=ch;$('#nf').innerHTML=`U+${c.toString(16).toUpperCase().padStart(4,'0')}<br>Desimali: ${c}<br>HTML: &amp;#${c};<br>UTF-8: ${u}`;$('#ta').value+=ch;sel=ch}
$('#bk').onchange=()=>{const b=B[$('#bk').value];grid(b[1],b[2])};
$('#q').oninput=()=>{const v=$('#q').value.trim();if(!v){$('#bk').onchange();return}let c=/^(u\+|0x)?([0-9a-f]{2,6})$/i.exec(v);const cp=c&&parseInt(c[2],16)<=0x10ffff?parseInt(c[2],16):v.codePointAt(0);const i=B.findIndex(b=>cp>=b[1]&&cp<=b[2]);if(i>=0){$('#bk').value=i;$('#bk').onchange();$$('#g button').find(b=>b.title=='U+'+cp.toString(16).toUpperCase().padStart(4,'0'))?.click()}};
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#ta').value)}catch(e){$('#ta').select();document.execCommand('copy')}$('#cp').textContent='✔ Imenakiliwa';setTimeout(()=>$('#cp').textContent='📋 Nakili',1200)};$('#cl').onclick=()=>$('#ta').value='';$('#bk').onchange();</script></body></html>
