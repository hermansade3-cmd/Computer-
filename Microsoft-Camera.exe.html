<!DOCTYPE html><html lang="sw"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamera</title><style>:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--ac:#2563eb;--ac2:#7c3aed;--bd:#e3e7f0;--hv:#e8efff}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2d;--tx:#e8ecf5;--mut:#9aa3b8;--bd:#2a3145;--hv:#26304a}}
*{box-sizing:border-box;margin:0}body{font:14px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);height:100vh;display:flex;flex-direction:column;color:var(--tx)}
.t{display:flex;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}.t b{flex:1;min-width:90px;font-size:15px;font-weight:600}
button,label.b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:500;box-shadow:0 2px 8px #2563eb40;transition:.15s}button:hover,label.b:hover{transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:scale(.97)}
input,select,textarea{padding:8px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2563eb30}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:16px}</style>
<div class=t><b>📷 Kamera</b><button id=s>Washa</button><button id=c>📸 Piga picha</button></div>
<video id=v autoplay playsinline muted style="flex:1;min-height:0;background:#000;width:calc(100% - 24px);margin:12px;border-radius:20px;box-shadow:0 8px 30px #0005;object-fit:cover"></video><canvas id=k hidden></canvas><div id=m style="padding:8px"></div>
<script>
const $=s=>document.querySelector(s);
$('#s').onclick=()=>navigator.mediaDevices&&navigator.mediaDevices.getUserMedia({video:true}).then(x=>{$('#v').srcObject=x}).catch(()=>$('#m').textContent='Ruhusa ya kamera imekataliwa au haipatikani.');
$('#c').onclick=()=>{const v=$('#v'),k=$('#k');if(!v.videoWidth)return $('#m').textContent='Washa kamera kwanza.';k.width=v.videoWidth;k.height=v.videoHeight;k.getContext('2d').drawImage(v,0,0);
k.toBlob(b=>{const R=indexedDB.open('SadePhotos',1);R.onupgradeneeded=()=>R.result.createObjectStore('p',{autoIncrement:true});R.onsuccess=()=>{const t=R.result.transaction('p','readwrite');t.objectStore('p').add(b);t.oncomplete=()=>$('#m').textContent='✅ Picha imehifadhiwa kwenye programu ya Picha'}},'image/jpeg',.92)};
</script>
