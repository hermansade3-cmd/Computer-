<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Picker</title>
<script>try{var S=JSON.parse(localStorage.getItem('sadevfs2')).set;document.documentElement.dataset.t=S.dark?'d':'l';document.documentElement.style.setProperty('--ac',S.acc||'#0067c0')}catch(e){}</script>
<style>:root{--ac:#0067c0;--bg:#f3f5f9;--fg:#141824;--cd:#fff;--bd:#d5dae3;--mu:#6b7385}[data-t=d]{--bg:#1b1f2a;--fg:#e8ebf2;--cd:#262b38;--bd:#394055;--mu:#9aa3b8}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:13px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;outline:0}button{cursor:pointer}button:hover,input:focus,select:focus{border-color:var(--ac)}.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb{display:flex;gap:6px;padding:6px 8px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}.sb{padding:3px 10px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);background:var(--cd)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fl{flex:1;min-height:0;overflow:auto}.mu{color:var(--mu)}.cv{padding:14px;max-width:640px;margin:auto;width:100%;display:flex;flex-direction:column;gap:12px}.sw{height:90px;border-radius:10px;border:1px solid var(--bd)}.fr{display:flex;gap:8px;align-items:center}.fr b{width:50px}.fr input{flex:1;font-family:Consolas,monospace}.pl{display:flex;gap:6px;flex-wrap:wrap}.pl div{width:54px;height:54px;border-radius:8px;border:1px solid var(--bd);cursor:pointer;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding:2px}input[type=color]{width:60px;height:36px;padding:0}.ct{padding:14px;border-radius:8px;border:1px solid var(--bd)}</style></head><body><div class="fl cv"><div class=fr><input type=color id=pk value=#0067c0><button id=ey>🎯 Chukua kutoka skrini</button><button id=sv>★ Hifadhi</button></div><div class=sw id=sw></div><div class=fr><b>HEX</b><input id=hx><button data-c=hx>📋</button></div><div class=fr><b>RGB</b><input id=rg><button data-c=rg>📋</button></div><div class=fr><b>HSL</b><input id=hs><button data-c=hs>📋</button></div><h4>Rangi zinazoendana</h4><div class=pl id=pl></div><h4>Kipimo cha utofautishaji (WCAG)</h4><div class=fr><b>Maandishi</b><input type=color id=fg value=#ffffff><b>Mandharinyuma</b><input type=color id=bg value=#0067c0></div><div class=ct id=ct>Mfano wa maandishi</div><div id=cr></div><h4>Zilizohifadhiwa</h4><div class=pl id=sd></div></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),r2h=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
function h2hsl(h){let[r,g,b]=hex2(h).map(v=>v/255);const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let H=0,S=0;if(d){S=d/(1-Math.abs(2*l-1));H=M==r?((g-b)/d)%6:M==g?(b-r)/d+2:(r-g)/d+4;H*=60;if(H<0)H+=360}return[Math.round(H),Math.round(S*100),Math.round(l*100)]}
function hsl2h(H,S,L){H=((H%360)+360)%360;S/=100;L/=100;const c=(1-Math.abs(2*L-1))*S,x=c*(1-Math.abs((H/60)%2-1)),m=L-c/2,[r,g,b]=H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x];return r2h((r+m)*255,(g+m)*255,(b+m)*255)}
const lum=h=>{const[r,g,b]=hex2(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
let S=JSON.parse(localStorage.colS||'[]');
function set(h){h=h.toLowerCase();$('#pk').value=h;$('#sw').style.background=h;$('#hx').value=h.toUpperCase();$('#rg').value='rgb('+hex2(h).join(', ')+')';const[H,s,l]=h2hsl(h);$('#hs').value=`hsl(${H}, ${s}%, ${l}%)`;
const P=[['Pinzani',H+180,s,l],['Jirani 1',H-30,s,l],['Jirani 2',H+30,s,l],['Triad 1',H+120,s,l],['Triad 2',H+240,s,l],['Nyepesi',H,s,Math.min(95,l+20)],['Nyeusi',H,s,Math.max(5,l-20)]];$('#pl').innerHTML=P.map(p=>{const c=hsl2h(p[1],p[2],p[3]);return `<div style="background:${c};color:${lum(c)>.4?'#000':'#fff'}" data-c="${c}">${c}</div>`}).join('');$$('#pl div').forEach(d=>d.onclick=()=>set(d.dataset.c))}
function con(){const f=$('#fg').value,b=$('#bg').value;$('#ct').style.cssText=`background:${b};color:${f}`;const a=lum(f),c=lum(b),r=(Math.max(a,c)+.05)/(Math.min(a,c)+.05);$('#cr').innerHTML=`Uwiano: <b>${r.toFixed(2)}:1</b> · Maandishi ya kawaida: ${r>=7?'AAA ✔':r>=4.5?'AA ✔':'✘ yanashindwa'} · Maandishi makubwa: ${r>=4.5?'AAA ✔':r>=3?'AA ✔':'✘ yanashindwa'}`}
function sd(){$('#sd').innerHTML=S.map(c=>`<div style="background:${c}" data-c="${c}"></div>`).join('')||'<span class=mu>Hakuna bado</span>';$$('#sd div').forEach(d=>{d.onclick=()=>set(d.dataset.c);d.oncontextmenu=e=>{e.preventDefault();S=S.filter(x=>x!=d.dataset.c);localStorage.colS=JSON.stringify(S);sd()}})}
$('#pk').oninput=e=>set(e.target.value);$('#hx').onchange=e=>{let v=e.target.value.trim();if(/^#?[0-9a-f]{3}$/i.test(v))v=v.replace('#','').replace(/./g,'$&$&');if(/^#?[0-9a-f]{6}$/i.test(v))set('#'+v.replace('#',''))};
$('#fg').oninput=$('#bg').oninput=con;$('#sv').onclick=()=>{const c=$('#pk').value;if(!S.includes(c)){S.unshift(c);S=S.slice(0,24);localStorage.colS=JSON.stringify(S);sd()}};
$('#ey').onclick=async()=>{if(!window.EyeDropper)return alert('Kivinjari hiki hakina EyeDropper. Tumia Chrome/Edge ya kompyuta.');try{set((await new EyeDropper().open()).sRGBHex)}catch(e){}};
$$('[data-c]').forEach(b=>{if(b.tagName=='BUTTON')b.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('#'+b.dataset.c).value)});set('#0067c0');con();sd();</script></body></html>
