<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registry Editor</title>
<script>try{var S=JSON.parse(localStorage.getItem('sadevfs2')).set;document.documentElement.dataset.t=S.dark?'d':'l';document.documentElement.style.setProperty('--ac',S.acc||'#0067c0')}catch(e){}</script>
<style>:root{--ac:#0067c0;--bg:#f3f5f9;--fg:#141824;--cd:#fff;--bd:#d5dae3;--mu:#6b7385}[data-t=d]{--bg:#1b1f2a;--fg:#e8ebf2;--cd:#262b38;--bd:#394055;--mu:#9aa3b8}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{font:13px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;outline:0}button{cursor:pointer}button:hover,input:focus,select:focus{border-color:var(--ac)}.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb{display:flex;gap:6px;padding:6px 8px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}.sb{padding:3px 10px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);background:var(--cd)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fl{flex:1;min-height:0;overflow:auto}.mu{color:var(--mu)}body{flex-direction:row}#tr{width:260px;overflow:auto;border-right:1px solid var(--bd);padding:6px;background:var(--cd)}#tr div{padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}#tr .on{background:var(--ac);color:#fff}#rt{flex:1;display:flex;flex-direction:column;min-width:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--bd)}tr.v{cursor:pointer}tr.v:hover{background:var(--cd)}.fm input,.fm select{width:auto;flex:1;min-width:80px}</style></head><body><div id=tr></div><div id=rt><div class=tb><button id=nk>＋ Key</button><button id=dk>🗑 Key</button><button id=ex>⬇ Export .reg</button><button id=im>⬆ Import .reg</button><input type=file id=fi accept=.reg hidden></div><div class="tb fm"><input id=vn placeholder="Jina la thamani"><select id=vt><option>REG_SZ<option>REG_DWORD</select><input id=vd placeholder="Data"><button id=vs class=p>Weka</button></div><div class=fl><table><thead><tr><th>Jina<th>Aina<th>Data<th></thead><tbody id=vl></tbody></table></div><div class=sb id=pt></div></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const K='sade_reg',LV='HKEY_CURRENT_USER\\Software\\Sade\\Settings';let R;try{R=JSON.parse(localStorage.getItem(K))}catch(e){}
R=R||{'HKEY_LOCAL_MACHINE\\SOFTWARE\\Sade\\Computer':{Version:['REG_SZ','23H2'],Build:['REG_DWORD',22631],Host:['REG_SZ','SADE-PC']},'HKEY_CURRENT_USER\\Software\\Sade\\Explorer':{ShowHidden:['REG_DWORD',0],View:['REG_SZ','grid']}};R[LV]=R[LV]||{};
let cur=LV;const sv=()=>{const c={...R};delete c[LV];localStorage.setItem(K,JSON.stringify({...c}))};
const live=()=>{try{const s=JSON.parse(localStorage.getItem('sadevfs2')).set;return Object.fromEntries(Object.entries(s).map(([k,v])=>[k,[typeof v=='number'?'REG_DWORD':'REG_SZ',v]]))}catch(e){return{}}};
const vals=k=>k==LV?live():(R[k]||{}),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function tree(){const set=new Set();Object.keys(R).forEach(k=>{const p=k.split('\\');for(let i=1;i<=p.length;i++)set.add(p.slice(0,i).join('\\'))});$('#tr').innerHTML=[...set].sort().map(k=>`<div data-k="${esc(k)}" class="${k==cur?'on':''}" style="padding-left:${6+12*(k.split('\\').length-1)}px">${k==cur?'📂':'📁'} ${esc(k.split('\\').pop())}${k==LV?' ●':''}</div>`).join('');$$('#tr div').forEach(d=>d.onclick=()=>{cur=d.dataset.k;draw()})}
function draw(){tree();const v=vals(cur);$('#pt').textContent=cur+(cur==LV?'  (● moja kwa moja: mabadiliko yanatumika kwenye Sade Computer)':'');$('#vl').innerHTML=Object.entries(v).map(([n,[t,d]])=>`<tr class=v data-n="${esc(n)}"><td>${esc(n)}<td>${t}<td>${esc(d)}<td><button data-x="${esc(n)}">🗑</button>`).join('')||'<tr><td colspan=4 class=mu>(Hakuna thamani)';
$$('#vl tr.v').forEach(r=>r.onclick=e=>{if(e.target.dataset.x)return;const x=v[r.dataset.n];$('#vn').value=r.dataset.n;$('#vt').value=x[0];$('#vd').value=x[1]});$$('#vl button').forEach(b=>b.onclick=()=>{if(cur==LV)return alert('Thamani za mipangilio huondolewa kupitia Settings.');delete R[cur][b.dataset.x];sv();draw()})}
function setLive(n,t,d){if(!/^\w+$/.test(n))throw'Jina lisilo sahihi';const v=t=='REG_DWORD'?Number(d):String(d);if(t=='REG_DWORD'&&isNaN(v))throw'DWORD lazima iwe namba';parent.eval('Sx['+JSON.stringify(n)+']='+JSON.stringify(v)+';sv();applyS()')}
$('#vs').onclick=()=>{const n=$('#vn').value.trim(),t=$('#vt').value,d=$('#vd').value;if(!n)return;try{if(cur==LV)setLive(n,t,d);else{if(t=='REG_DWORD'&&isNaN(Number(d)))throw'DWORD lazima iwe namba';R[cur][n]=[t,t=='REG_DWORD'?Number(d):d];sv()}}catch(e){return alert(e)}draw()};
$('#nk').onclick=()=>{const n=prompt('Jina la key mpya (chini ya '+cur+'):');if(!n||/[\\]$/.test(n))return;R[cur+'\\'+n.trim()]={};sv();cur=cur+'\\'+n.trim();draw()};
$('#dk').onclick=()=>{if(cur==LV||!R[cur])return alert('Key hii haiwezi kufutwa.');if(Object.keys(R).some(k=>k!=cur&&k.startsWith(cur+'\\'))||!confirm('Futa '+cur+'?'))return alert('Futa key ndogo kwanza.');delete R[cur];sv();cur=LV;draw()};
$('#ex').onclick=()=>{let o='Windows Registry Editor Version 5.00\r\n\r\n';Object.keys(R).forEach(k=>{if(k==LV)return;o+='['+k+']\r\n';Object.entries(R[k]).forEach(([n,[t,d]])=>o+='"'+n+'"='+(t=='REG_DWORD'?'dword:'+Number(d).toString(16).padStart(8,'0'):'"'+String(d).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"')+'\r\n');o+='\r\n'});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'text/plain'}));a.download='usajili.reg';a.click()};
$('#im').onclick=()=>$('#fi').click();$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;let k=null,n=0;(await f.text()).split(/\r?\n/).forEach(l=>{let m;if(m=/^\[(.+)\]$/.exec(l)){k=m[1];if(k!=LV)R[k]=R[k]||{}}else if(k&&k!=LV&&(m=/^"(.+?)"=(?:dword:([0-9a-f]+)|"(.*)")$/i.exec(l))){R[k][m[1]]=m[2]!=null?['REG_DWORD',parseInt(m[2],16)]:['REG_SZ',m[3].replace(/\\(["\\])/g,'$1')];n++}});sv();draw();alert('Zimeingizwa thamani '+n)};
draw();</script></body></html>
