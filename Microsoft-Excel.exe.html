<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;background:#e6e6e6;color:#222}
#rb{background:#f3f3f3;border-bottom:1px solid #c8c8c8;border-top:3px solid #217346;padding:4px 6px;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
#rb button,#rb select{background:#fff;border:1px solid #c8c8c8;border-radius:3px;padding:4px 8px;cursor:pointer;font:inherit;color:#222}
#rb button:hover,#rb select:hover{background:#dcefe3;border-color:#217346}
#rb input[type=color]{width:28px;height:26px;padding:0;border:1px solid #c8c8c8;background:#fff}
.sp{width:1px;height:22px;background:#c8c8c8;margin:0 4px}
#fx{display:flex;align-items:center;background:#fff;border-bottom:1px solid #c8c8c8}
#nb{width:90px;border:0;border-right:1px solid #c8c8c8;padding:5px;text-align:center;font:inherit;outline:0}
#fx i{padding:0 8px;color:#217346;font-weight:700}
#fb{flex:1;border:0;padding:5px;font:inherit;outline:0}
#wrap{flex:1;overflow:auto;position:relative;background:#fff;outline:0;scroll-padding:30px 50px}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
td,th{border-right:1px solid #e1e1e1;border-bottom:1px solid #e1e1e1;height:22px;padding:0 4px;overflow:hidden;white-space:nowrap;user-select:none}
th{background:#f3f3f3;font-weight:400;text-align:center;position:sticky;top:0;z-index:2;cursor:pointer;color:#444}
th.rh{left:0;top:auto;z-index:1}
th.c0{left:0;z-index:3}
th.hl{background:#cfe5d7;color:#107c41;font-weight:600}
td.sl{box-shadow:inset 0 0 0 100px rgba(33,115,70,.15)}
td.ac{outline:2px solid #217346;outline-offset:-2px}
#ed{position:absolute;display:none;border:2px solid #217346;font:inherit;padding:0 3px;z-index:5;outline:0;background:#fff}
#tabs{display:flex;background:#f3f3f3;border-top:1px solid #c8c8c8;align-items:center;gap:2px;padding:0 4px;overflow-x:auto}
#tabs button{border:0;background:none;cursor:pointer;padding:5px 8px;font-size:14px}
.tab{padding:5px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{background:#fff;border-bottom-color:#217346;color:#107c41;font-weight:600}
#sb{background:#217346;color:#fff;padding:3px 10px;display:flex;justify-content:space-between;font-size:12px}
@media print{#rb,#fx,#tabs,#sb{display:none}#wrap{overflow:visible}}
</style></head><body>
<div id="rb">
<button onclick="newBook()">📄 Mpya</button><button onclick="fi.click()">📂 Fungua</button><button onclick="save()">💾 Hifadhi</button>
<select onchange="exp(this.value);this.value=''"><option value="">⬇ Hamisha nje…</option><option value="xlsx">Excel (.xlsx)</option><option value="xls">Excel (.xls)</option><option value="csv">CSV</option><option value="json">JSON</option><option value="pdf">Chapisha / PDF</option></select>
<span class="sp"></span>

<span class="sp"></span>
<button onclick="undo()">↶</button><button onclick="redo()">↷</button>
<span class="sp"></span>
<button onclick="sty('b')"><b>B</b></button><button onclick="sty('i')"><i>I</i></button><button onclick="sty('a','left')">⇤</button><button onclick="sty('a','center')">≡</button><button onclick="sty('a','right')">⇥</button>
<input type="color" value="#000000" title="Rangi ya maandishi" onchange="sty('c',this.value)"><input type="color" value="#ffff00" title="Rangi ya nyuma" onchange="sty('g',this.value)">
<select onchange="sty('f',this.value=='gen'?'':this.value);this.value=''"><option value="">Muundo…</option><option value="gen">Jumla</option><option value="n2">Namba 0.00</option><option value="tsh">TSh</option><option value="pct">Asilimia</option></select>
<span class="sp"></span>
<button onclick="srt(1)">A↓Z</button><button onclick="srt(-1)">Z↓A</button>
<button onclick="insR()">+Safu mlalo</button><button onclick="delR()">−Safu mlalo</button><button onclick="insC()">+Safu wima</button><button onclick="delC()">−Safu wima</button><button onclick="wid()">↔ Upana</button><button onclick="clr()">🗑 Futa</button>
</div>
<div id="fx"><input id="nb"><i>fx</i><input id="fb"></div>

<script>
const R=100,C=26,$=i=>document.getElementById(i),wrap=$('wrap'),ed=$('ed'),fb=$('fb'),fi=$('fi');
const L=n=>{let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
const CN=s=>[...s].reduce((a,x)=>a*26+x.charCodeAt(0)-64,0)-1,K=(r,c)=>L(c)+(r+1);
const PK=k=>{const m=/^([A-Z]+)(\d+)$/.exec(k);return[+m[2]-1,CN(m[1])]};
let B,cur=0,an=[0,0],fo=[0,0],hist=[],fut=[],clip=null,cache={},editing=false,tds=[],drag=false;
const S=()=>B.s[cur],newS=n=>({n,d:{},w:{}});
const num=a=>a.flat(9).filter(x=>typeof x=='number');
const F={SUM:(...a)=>num(a).reduce((x,y)=>x+y,0),AVERAGE:(...a)=>{const n=num(a);return n.length?F.SUM(n)/n.length:'#DIV/0!'},MIN:(...a)=>Math.min(...num(a)),MAX:(...a)=>Math.max(...num(a)),COUNT:(...a)=>num(a).length,COUNTA:(...a)=>a.flat(9).filter(x=>x!=='').length,PRODUCT:(...a)=>num(a).reduce((x,y)=>x*y,1),IF:(c,a,b='')=>c?a:b,ROUND:(x,n=0)=>Math.round(x*10**n)/10**n,ABS:Math.abs,SQRT:Math.sqrt,POWER:Math.pow,MOD:(a,b)=>a%b,INT:Math.floor,LEN:s=>String(s).length,UPPER:s=>String(s).toUpperCase(),LOWER:s=>String(s).toLowerCase(),CONCAT:(...a)=>a.flat(9).join(''),AND:(...a)=>a.flat(9).every(Boolean),OR:(...a)=>a.flat(9).some(Boolean),NOT:x=>!x,TODAY:()=>new Date().toLocaleDateString(),NOW:()=>new Date().toLocaleString(),PI:()=>Math.PI};
F.JUMLA=F.SUM;F.WASTANI=F.AVERAGE;F.IDADI=F.COUNT;
const rng=()=>({r1:Math.min(an[0],fo[0]),r2:Math.max(an[0],fo[0]),c1:Math.min(an[1],fo[1]),c2:Math.max(an[1],fo[1])});
const raw=k=>{const c=S().d[k];return c&&c.v!==undefined?c.v:''};
function val(k){if(k in cache)return cache[k];let v=raw(k);if(typeof v=='string'&&v[0]=='='){cache[k]='#REF!';try{v=ev(v.slice(1));if(Array.isArray(v))v=v[0]}catch(e){v='#KOSA!'}}else if(v!==''&&String(v).trim()!==''&&!isNaN(v))v=+v;return cache[k]=v}
const V=k=>{const v=val(k);return v===''?0:v};
const RG=(a,b)=>{const[r1,c1]=PK(a),[r2,c2]=PK(b),o=[];for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)o.push(val(K(r,c)));return o};
function ev(e){e=e.replace(/\$/g,'');const js=e.replace(/"[^"]*"|([A-Z]{1,2}\d+):([A-Z]{1,2}\d+)|\b([A-Z]{1,2}\d+)\b(?!\()|<>|\^|&|(?<![<>!=])=(?!=)/g,(m,a,b,c)=>m[0]=='"'?m:a?`RG("${a}","${b}")`:c?`V("${c}")`:m=='<>'?'!=':m=='^'?'**':m=='&'?'+""+':'==');return Function('V','RG',...Object.keys(F),'return('+js+')')(V,RG,...Object.values(F))}
function fmt(v,f){if(typeof v=='boolean')return String(v).toUpperCase();if(typeof v=='number'){if(!isFinite(v))return'#KOSA!';if(f=='n2')return v.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});if(f=='tsh')return'TSh '+Math.round(v).toLocaleString('en');if(f=='pct')return(v*100).toFixed(1)+'%';return''+ +v.toFixed(10)}return v}
function build(){const s=S();let h='<colgroup><col style="width:40px">'+[...Array(C)].map((_,c)=>`<col style="width:${s.w[c]||90}px">`).join('')+'</colgroup><tr><th class="c0"></th>'+[...Array(C)].map((_,c)=>`<th class="ch" data-c="${c}">${L(c)}</th>`).join('')+'</tr>';
for(let r=0;r<R;r++){h+=`<tr><th class="rh" data-r="${r}">${r+1}</th>`;for(let c=0;c<C;c++)h+=`<td data-r="${r}" data-c="${c}"></td>`;h+='</tr>'}
$('t').innerHTML=h;tds=[];for(let r=0;r<R;r++)tds.push([...$('t').rows[r+1].cells].slice(1))}
function paint(){cache={};const d=S().d;for(let r=0;r<R;r++)for(let c=0;c<C;c++){const k=K(r,c),t=tds[r][c],o=d[k]||{},v=val(k),s=t.style;t.textContent=fmt(v,o.f);s.fontWeight=o.b?700:'';s.fontStyle=o.i?'italic':'';s.textAlign=o.a||(typeof v=='number'?'right':'');s.color=o.c||'';s.background=o.g||''}hl()}
function hl(){const g=rng(),one=g.r1==g.r2&&g.c1==g.c2;for(let r=0;r<R;r++)for(let c=0;c<C;c++){const t=tds[r][c];t.classList.toggle('sl',!one&&r>=g.r1&&r<=g.r2&&c>=g.c1&&c<=g.c2);t.classList.toggle('ac',r==an[0]&&c==an[1])}
document.querySelectorAll('th.ch').forEach((h,c)=>h.classList.toggle('hl',c>=g.c1&&c<=g.c2));document.querySelectorAll('th.rh').forEach((h,r)=>h.classList.toggle('hl',r>=g.r1&&r<=g.r2));
const k=K(an[0],an[1]);$('nb').value=one?k:K(g.r1,g.c1)+':'+K(g.r2,g.c2);fb.value=raw(k);
let n=[],cnt=0;for(let r=g.r1;r<=g.r2;r++)for(let c=g.c1;c<=g.c2;c++){const v=val(K(r,c));if(v!=='')cnt++;if(typeof v=='number')n.push(v)}
const s=n.reduce((a,b)=>a+b,0);$('st').textContent=n.length>1?`Jumla: ${+s.toFixed(6)}   Wastani: ${+(s/n.length).toFixed(6)}   Idadi: ${cnt}`:cnt>1?'Idadi: '+cnt:'Tayari'}
function mv(dr,dc,ext){const b=ext?fo:an,p=[Math.max(0,Math.min(R-1,b[0]+dr)),Math.max(0,Math.min(C-1,b[1]+dc))];if(ext)fo=p;else{an=p;fo=p}hl();tds[p[0]][p[1]].scrollIntoView({block:'nearest',inline:'nearest'})}
function snap(){hist.push(JSON.stringify(B));if(hist.length>60)hist.shift();fut=[]}
function undo(){if(editing)return;if(!hist.length)return;fut.push(JSON.stringify(B));B=JSON.parse(hist.pop());full()}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(B));B=JSON.parse(fut.pop());full()}
function full(){cur=Math.min(cur,B.s.length-1);build();paint();tabs();persist()}
const persist=()=>{try{localStorage.xl=JSON.stringify(B)}catch(e){}};
const flash=m=>{$('ms').textContent=m;setTimeout(()=>$('ms').textContent='Ctrl+C/X/V · Ctrl+Z/Y · Ctrl+D · F2 hariri',2500)};
function setv(k,v){const d=S().d;if(v===''){if(d[k]){delete d[k].v;if(!Object.keys(d[k]).length)delete d[k]}}else(d[k]=d[k]||{}).v=v}
function startEdit(init){editing=true;const t=tds[an[0]][an[1]],a=t.getBoundingClientRect(),w=wrap.getBoundingClientRect();Object.assign(ed.style,{display:'block',left:a.left-w.left+wrap.scrollLeft+'px',top:a.top-w.top+wrap.scrollTop+'px',width:Math.max(a.width,130)+'px',height:a.height+'px'});ed.value=init===undefined?String(raw(K(an[0],an[1]))):init;ed.focus();ed.setSelectionRange(ed.value.length,ed.value.length);fb.value=ed.value}
function commit(dr,dc){if(!editing)return;editing=false;ed.style.display='none';const v=ed.value,k=K(an[0],an[1]);if(v!==String(raw(k))){snap();setv(k,v)}paint();persist();if(dr||dc)mv(dr,dc);wrap.focus()}
ed.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();commit(e.shiftKey?-1:1,0)}else if(e.key=='Tab'){e.preventDefault();commit(0,e.shiftKey?-1:1)}else if(e.key=='Escape'){editing=false;ed.style.display='none';wrap.focus();hl()}};
ed.oninput=()=>fb.value=ed.value;
fb.onkeydown=e=>{if(e.key=='Enter'){snap();setv(K(an[0],an[1]),fb.value);paint();persist();wrap.focus();mv(1,0)}else if(e.key=='Escape'){hl();wrap.focus()}};
$('nb').onkeydown=e=>{if(e.key!='Enter')return;const m=/^([A-Z]+)(\d+)(?::([A-Z]+)(\d+))?$/i.exec($('nb').value.trim());if(m){an=[Math.min(R-1,+m[2]-1),Math.min(C-1,CN(m[1].toUpperCase()))];fo=m[3]?[Math.min(R-1,+m[4]-1),Math.min(C-1,CN(m[3].toUpperCase()))]:an}hl();wrap.focus()};
$('t').onmousedown=e=>{const x=e.target.closest('td,th');if(!x)return;wrap.focus();if(editing)commit(0,0);
if(x.tagName=='TD'){const p=[+x.dataset.r,+x.dataset.c];if(e.shiftKey)fo=p;else{an=p;fo=p}drag=true}
else if(x.classList.contains('ch')){const c=+x.dataset.c;if(e.shiftKey)fo=[R-1,c];else{an=[0,c];fo=[R-1,c]}}
else if(x.classList.contains('rh')){const r=+x.dataset.r;an=[r,0];fo=[r,C-1]}
else{an=[0,0];fo=[R-1,C-1]}e.preventDefault();hl()};
$('t').onmouseover=e=>{if(!drag)return;const x=e.target.closest('td');if(x){fo=[+x.dataset.r,+x.dataset.c];hl()}};
document.addEventListener('mouseup',()=>drag=false);
$('t').ondblclick=e=>{if(e.target.closest('td'))startEdit()};
const isIn=t=>/INPUT|SELECT|TEXTAREA/.test(t.tagName);
document.addEventListener('keydown',e=>{if(editing||isIn(e.target))return;const k=e.key,ctrl=e.ctrlKey||e.metaKey,x=k.toLowerCase();
if(ctrl){const m={z:undo,y:redo,b:()=>sty('b'),i:()=>sty('i'),s:save,d:()=>fill('d'),r:()=>fill('r'),a:()=>{an=[0,0];fo=[R-1,C-1];hl()}};if(m[x]){e.preventDefault();m[x]()}return}
const A={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
if(A[k]){e.preventDefault();mv(A[k][0],A[k][1],e.shiftKey)}
else if(k=='Enter'){e.preventDefault();mv(e.shiftKey?-1:1,0)}
else if(k=='Tab'){e.preventDefault();mv(0,e.shiftKey?-1:1)}
else if(k=='F2'){e.preventDefault();startEdit()}
else if(k=='Delete'||k=='Backspace'){e.preventDefault();clr()}
else if(k.length==1&&!e.altKey){e.preventDefault();startEdit(k)}});
function clr(){const g=rng();snap();for(let r=g.r1;r<=g.r2;r++)for(let c=g.c1;c<=g.c2;c++)setv(K(r,c),'');paint();persist()}
function sty(k,v){const g=rng(),a=S().d[K(an[0],an[1])]||{},d=S().d;snap();const nv=k=='b'||k=='i'?!a[k]:v;for(let r=g.r1;r<=g.r2;r++)for(let c=g.c1;c<=g.c2;c++){const q=K(r,c),o=d[q]=d[q]||{};if(!nv)delete o[k];else o[k]=nv;if(!Object.keys(o).length)delete d[q]}paint();persist();wrap.focus()}
function shiftF(f,dr,dc){return f.replace(/(\$?)([A-Z]{1,2})(\$?)(\d+)/g,(m,a,col,b,row)=>{const c=CN(col)+(a?0:dc),r=+row-1+(b?0:dr);return c<0||r<0?'#REF!':(a?'$'+col:L(c))+(b?'$'+row:r+1)})}
const cl=o=>o?JSON.parse(JSON.stringify(o)):null;
function cp(cut,ev2){const g=rng(),cells=[],rows=[];for(let r=g.r1;r<=g.r2;r++){const a=[],b=[];for(let c=g.c1;c<=g.c2;c++){a.push(cl(S().d[K(r,c)]));b.push(fmt(val(K(r,c)),(S().d[K(r,c)]||{}).f))}cells.push(a);rows.push(b.join('\t'))}
const text=rows.join('\n');clip={cells,text,r:g.r1,c:g.c1};if(ev2)ev2.clipboardData.setData('text/plain',text);else if(navigator.clipboard)navigator.clipboard.writeText(text).catch(()=>{});if(cut)clr();flash(cut?'Imekatwa':'Imenakiliwa')}
async function pst(){let t='';try{t=await navigator.clipboard.readText()}catch(e){}pasteText(t||(clip&&clip.text)||'')}
function pasteText(t){if(!t)return;snap();const g=rng(),d=S().d;if(clip&&clip.text===t)clip.cells.forEach((row,i)=>row.forEach((cell,j)=>{const r=g.r1+i,c=g.c1+j;if(r>=R||c>=C)return;const k=K(r,c),o=cl(cell);if(!o)delete d[k];else{if(typeof o.v=='string'&&o.v[0]=='=')o.v=shiftF(o.v,r-clip.r,c-clip.c);d[k]=o}}));
else parseCSV(t.replace(/\r/g,'').replace(/\n$/,''),'\t').forEach((row,i)=>row.forEach((v,j)=>{const r=g.r1+i,c=g.c1+j;if(r<R&&c<C)setv(K(r,c),v)}));paint();persist()}
document.addEventListener('copy',e=>{if(editing||isIn(e.target))return;e.preventDefault();cp(0,e)});
document.addEventListener('cut',e=>{if(editing||isIn(e.target))return;e.preventDefault();cp(1,e)});
document.addEventListener('paste',e=>{if(editing||isIn(e.target))return;e.preventDefault();pasteText(e.clipboardData.getData('text/plain'))});
function fill(dir){const g=rng(),d=S().d;snap();if(dir=='d')for(let c=g.c1;c<=g.c2;c++)for(let r=g.r1+1;r<=g.r2;r++){const o=cl(d[K(g.r1,c)]);if(o){if(typeof o.v=='string'&&o.v[0]=='=')o.v=shiftF(o.v,r-g.r1,0);d[K(r,c)]=o}else delete d[K(r,c)]}
else for(let r=g.r1;r<=g.r2;r++)for(let c=g.c1+1;c<=g.c2;c++){const o=cl(d[K(r,g.c1)]);if(o){if(typeof o.v=='string'&&o.v[0]=='=')o.v=shiftF(o.v,0,c-g.c1);d[K(r,c)]=o}else delete d[K(r,c)]}paint();persist()}
function used(){let mr=0,mc=0;for(const k in S().d){const[r,c]=PK(k);mr=Math.max(mr,r);mc=Math.max(mc,c)}return[mr,mc]}
function srt(dir){let g=rng();if(g.r1==g.r2){const[mr,mc]=used();g={r1:0,r2:mr,c1:0,c2:mc}}const d=S().d,kc=an[1],it=[];for(let r=g.r1;r<=g.r2;r++){const row=[];for(let c=g.c1;c<=g.c2;c++)row.push(cl(d[K(r,c)]));it.push({r,v:val(K(r,kc)),row})}
it.sort((a,b)=>{const x=a.v,y=b.v;if(x===y)return 0;if(x==='')return 1;if(y==='')return-1;return(typeof x=='number'&&typeof y=='number'?x-y:String(x).localeCompare(String(y)))*dir});snap();
it.forEach((o,i)=>o.row.forEach((cell,j)=>{const k=K(g.r1+i,g.c1+j);if(cell){if(typeof cell.v=='string'&&cell.v[0]=='=')cell.v=shiftF(cell.v,g.r1+i-o.r,0);d[k]=cell}else delete d[k]}));paint();persist()}
function remap(f){snap();const s=S(),nd={};for(const k in s.d){const[r,c]=PK(k),m=f(r,c);if(!m||m[0]>=R||m[1]>=C)continue;const o=s.d[k];if(typeof o.v=='string'&&o.v[0]=='=')o.v=o.v.replace(/(\$?)([A-Z]{1,2})(\$?)(\d+)/g,(x,a,col,b,row)=>{const q=f(+row-1,CN(col));return q?a+L(q[1])+b+(q[0]+1):'#REF!'});nd[K(m[0],m[1])]=o}s.d=nd;paint();persist()}
function insR(){const g=rng(),n=g.r2-g.r1+1;remap((r,c)=>[r>=g.r1?r+n:r,c])}
function delR(){const g=rng(),n=g.r2-g.r1+1;remap((r,c)=>r<g.r1?[r,c]:r>g.r2?[r-n,c]:null)}
function insC(){const g=rng(),n=g.c2-g.c1+1;remap((r,c)=>[r,c>=g.c1?c+n:c])}
function delC(){const g=rng(),n=g.c2-g.c1+1;remap((r,c)=>c<g.c1?[r,c]:c>g.c2?[r,c-n]:null)}
function wid(){const w=+prompt('Upana wa safu wima (px)',90);if(!w)return;snap();const g=rng();for(let c=g.c1;c<=g.c2;c++)S().w[c]=w;build();paint();persist()}
function tabs(){const el=$('tabs');el.innerHTML='';B.s.forEach((s,i)=>{const d=document.createElement('div');d.className='tab'+(i==cur?' on':'');d.textContent=s.n;d.onclick=()=>{if(editing)commit(0,0);cur=i;an=[0,0];fo=[0,0];build();paint();tabs()};d.ondblclick=()=>{const n=prompt('Jina la karatasi',s.n);if(n){snap();s.n=n;tabs();persist()}};el.appendChild(d)});
el.insertAdjacentHTML('beforeend','<button onclick="addS()" title="Karatasi mpya">＋</button><button onclick="mvS(-1)" title="Hamisha kushoto">◀</button><button onclick="mvS(1)" title="Hamisha kulia">▶</button><button onclick="delS()" title="Futa karatasi">🗑</button>')}
function addS(){snap();B.s.push(newS('Karatasi'+(B.s.length+1)));cur=B.s.length-1;an=[0,0];fo=[0,0];full()}
function mvS(d){const j=cur+d;if(j<0||j>=B.s.length)return;snap();const[s]=B.s.splice(cur,1);B.s.splice(j,0,s);cur=j;full()}
function delS(){if(B.s.length<2)return alert('Lazima kubaki karatasi moja.');if(!confirm('Futa karatasi hii?'))return;snap();B.s.splice(cur,1);cur=Math.max(0,cur-1);full()}
function newBook(){if(!confirm('Anza kitabu kipya? Kitabu cha sasa kitafutwa.'))return;snap();B={s:[newS('Karatasi1')]};cur=0;an=[0,0];fo=[0,0];full()}
const dl=(n,m,d)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)};
function save(){persist();exp('json');flash('Imehifadhiwa ✔')}
function exp(t){if(!t)return;if(t=='pdf')return print();if(t=='json')return dl('kitabu.json','application/json',JSON.stringify(B));if(t=='xlsx')return xlsx();
const[mr,mc]=used(),rows=[];let h='';for(let r=0;r<=mr;r++){const row=[];h+='<tr>';for(let c=0;c<=mc;c++){const k=K(r,c),o=S().d[k]||{},x=fmt(val(k),o.f);row.push(x);h+=`<td style="${o.b?'font-weight:bold;':''}${o.i?'font-style:italic;':''}${o.c?'color:'+o.c+';':''}${o.g?'background:'+o.g+';':''}${o.a?'text-align:'+o.a:''}">${String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</td>`}rows.push(row);h+='</tr>'}
if(t=='csv')dl('karatasi.csv','text/csv','\ufeff'+rows.map(r=>r.map(x=>/[",\n]/.test(x)?'"'+String(x).replace(/"/g,'""')+'"':x).join(',')).join('\n'));
else dl('karatasi.xls','application/vnd.ms-excel','<html><meta charset="utf-8"><table border="1">'+h+'</table></html>')}
function xlsx(){if(!window.XLSX)return alert('Inahitaji intaneti kupakia maktaba ya XLSX. Tumia .xls au CSV nje ya mtandao.');const wb=XLSX.utils.book_new(),old=cur;
B.s.forEach((s,i)=>{cur=i;cache={};const ws={};let mr=0,mc=0;for(const k in s.d){const v=s.d[k].v;if(v===undefined)continue;const[r,c]=PK(k),x=val(k);mr=Math.max(mr,r);mc=Math.max(mc,c);ws[k]={t:typeof x=='number'?'n':typeof x=='boolean'?'b':'s',v:x};if(typeof v=='string'&&v[0]=='=')ws[k].f=v.slice(1)}ws['!ref']='A1:'+K(mr,mc);XLSX.utils.book_append_sheet(wb,ws,s.n.replace(/[\\\/?*\[\]:]/g,'').slice(0,31)||'Sheet'+(i+1))});cur=old;cache={};XLSX.writeFile(wb,'kitabu.xlsx')}
function parseCSV(t,sep){if(!sep)sep=t.split('\n')[0].includes('\t')?'\t':',';const o=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}else if(ch=='"')q=true;else if(ch==sep){row.push(f);f=''}else if(ch=='\n'){row.push(f);o.push(row);row=[];f=''}else if(ch!='\r')f+=ch}row.push(f);o.push(row);return o}
fi.onchange=()=>{const f=fi.files[0];if(!f)return;const n=f.name,x=n.split('.').pop().toLowerCase(),rd=new FileReader();
if(x=='xlsx'||x=='xls'){if(!window.XLSX){fi.value='';return alert('Inahitaji intaneti kupakia maktaba ya XLSX.')}rd.onload=()=>{snap();const wb=XLSX.read(rd.result,{type:'array'});B={s:wb.SheetNames.map(nm=>{const ws=wb.Sheets[nm],s=newS(nm);for(const k in ws){if(k[0]=='!')continue;const a=XLSX.utils.decode_cell(k);if(a.r<R&&a.c<C){const c=ws[k],v=c.f?'='+c.f:c.v;if(v!==undefined&&v!=='')s.d[K(a.r,a.c)]={v}}}return s})};cur=0;an=[0,0];fo=[0,0];full()};rd.readAsArrayBuffer(f)}
else{rd.onload=()=>{snap();if(x=='json'){try{B=JSON.parse(rd.result);cur=0}catch(e){return alert('Faili si sahihi')}}else{const s=newS(n.replace(/\.\w+$/,''));parseCSV(rd.result).forEach((row,r)=>row.forEach((v,c)=>{if(v!==''&&r<R&&c<C)s.d[K(r,c)]={v}}));B.s.push(s);cur=B.s.length-1}an=[0,0];fo=[0,0];full()};rd.readAsText(f)}fi.value=''};
try{B=JSON.parse(localStorage.xl)}catch(e){}if(!B||!B.s||!B.s.length)B={s:[newS('Karatasi1')]};
full();wrap.focus();
</script></body></html>
