<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disk Cleanup</title>
<style>
:root{--bg:#f3f3f3;--card:#fff;--fg:#1a1a1a;--mut:#5f5f5f;--bd:#e3e3e3;--ac:#0067c0;--acf:#fff;--hv:#f5f9fd;--sel:#e5f0fb;--c1:#0067c0;--c2:#e8a317;--c3:#7c5cdb;--c4:#9a9a9a;--ok:#0f7b0f;color-scheme:light}
.dk{--bg:#202020;--card:#2b2b2b;--fg:#f3f3f3;--mut:#a9a9a9;--bd:#3d3d3d;--ac:#4cc2ff;--acf:#00263d;--hv:#333;--sel:#34414d;--c1:#4cc2ff;--c2:#f5c451;--c3:#a995f5;--c4:#8a8a8a;--ok:#6ccb5f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.45 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
header .ic{width:48px;height:48px;border-radius:12px;background:var(--sel);color:var(--ac);display:grid;place-items:center;flex:none}
header>div:nth-child(2){flex:1;min-width:0}
h1{margin:0;font-size:22px;font-weight:600}
h3{margin:20px 2px 8px;font-size:13px;font-weight:600;color:var(--mut)}
.m{color:var(--mut);font-size:12.5px}
button{font:inherit;color:var(--fg);padding:7px 14px;border:1px solid var(--bd);border-radius:6px;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
button:hover{background:var(--hv)}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:default;transform:none}
button.p{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
button.p:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.big{padding:16px 16px 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;height:14px;margin:12px 16px;border-radius:7px;overflow:hidden;background:var(--bd);gap:2px}
.seg i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;padding:0 16px 16px}
.lg div{display:flex;align-items:center;gap:8px;min-width:0}
.lg i{width:10px;height:10px;border-radius:50%;flex:none}
.lg span{display:block;font-size:12.5px;color:var(--mut)}.lg b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.list>.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd);cursor:default}
.list>.it:last-child{border-bottom:0}
label.it{cursor:pointer}label.it:hover{background:var(--hv)}
.it .ico{width:36px;height:36px;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--ac);flex:none}
.tx{flex:1;min-width:0}.tx b{display:block;font-weight:600}
.sz{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);flex:none;margin:0}
.badge{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--sel);white-space:nowrap}.badge.ok{color:var(--ok);font-weight:600}
details{margin-top:10px}summary{padding:12px 14px;cursor:pointer;font-weight:600}
details ul{margin:0;padding:0 14px 12px 34px;color:var(--mut)}details li{padding:2px 0;word-break:break-word}
#m{min-height:20px;margin:12px 2px 0;font-weight:600;color:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.bi{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bi>div{flex:1;min-width:0}.bi b{font-variant-numeric:tabular-nums}
.pg{height:4px;border-radius:2px;background:var(--bd);overflow:hidden;margin-top:6px;display:none}.pg i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.busy .pg{display:block}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:9}
.dg{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dg h2{margin:0 0 8px;font-size:18px}.dg p{margin:0 0 16px;color:var(--mut)}.dg .r{display:flex;gap:8px;justify-content:flex-end}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.sk{opacity:.5}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media(max-width:480px){h1{font-size:19px}.big b{font-size:24px}header button span{display:none}}
</style></head><body>
<div class="wrap" id="app">
 <header>
  <div class="ic" id="hic"></div>
  <div><h1>Hifadhi (C:)</h1><div class="m" id="sub">Inakokotoa…</div></div>
  <button id="rs" aria-label="Changanua upya"></button>
 </header>
 <section class="card" aria-label="Matumizi ya nafasi">
  <div class="big"><b id="ub">–</b><span class="m" id="uq"></span></div>
  <div class="seg" id="seg" role="img" aria-label="Mgawanyo wa nafasi"></div>
  <div class="lg" id="lg"></div>
 </section>
 <h3>Safisha nafasi</h3>
 <section class="card list" id="cl"></section>
 <details class="card" id="bd"><summary>Vitu vilivyo kwenye Recycle Bin</summary><ul id="bl"></ul></details>
 <h3>Hifadhi na offline</h3>
 <section class="card list">
  <div class="it"><span class="ico" id="i1"></span><div class="tx"><b>Hifadhi ya kudumu</b><span class="m">Kivinjari kisifute data ya Sade Computer nafasi ikibana</span></div><span id="pb"></span></div>
  <div class="it"><span class="ico" id="i2"></span><div class="tx"><b>Hifadhi &amp; Offline</b><span class="m">Dhibiti mafaili yanayofanya kazi bila intaneti</span></div><button id="st">Fungua</button></div>
 </section>
 <p id="m" role="status" aria-live="polite"></p>
</div>
<div class="bar" id="bar"><div class="bi"><div><span id="fr">Chagua unachotaka kufuta</span><div class="pg"><i id="pgi"></i></div></div><button class="p" id="go" disabled></button></div></div>
<div id="dlg"></div>
<script>
const P=(()=>{try{if(parent!==window&&parent.document)return parent}catch(e){}return window})();
const th=()=>{try{document.documentElement.classList.toggle('dk',P.document.body.classList.contains('dark'))}catch(e){}};
th();try{new MutationObserver(th).observe(P.document.body,{attributes:true,attributeFilter:['class']})}catch(e){}
(function(){
 const $=s=>document.querySelector(s),LS=P.localStorage,S=P.SADE,BK='Recycle Bin';
 const IC={drive:'<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13l2-8h10l2 8M7 16.5h.01M11 16.5h6"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',cloud:'<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.5 4.5 4.5 0 0 1 17.5 18z"/>',refresh:'<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/>',broom:'<path d="M14 3l7 7M13 8l-9 9 3 3 9-9M7 14l3 3"/>'};
 const svg=(n,s)=>'<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';
 const fmt=b=>b<1024?Math.round(b)+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
 const msg=t=>{$('#m').textContent=t};
 $('#hic').innerHTML=svg('drive',28);$('#rs').innerHTML=svg('refresh',16)+'<span>Changanua upya</span>';
 $('#i1').innerHTML=svg('shield');$('#i2').innerHTML=svg('cloud');

 /* ---- data ---- */
 const getV=()=>{if(S)return S.V();try{return JSON.parse(LS.getItem('sadevfs2')||'{}')}catch(e){return {}}};
 const binA=()=>{const v=getV();return v.F&&v.F[BK]?v.F[BK]:[]};
 const idb=fn=>new Promise(r=>{try{const q=P.indexedDB.open('SadeComputerDB',1);q.onupgradeneeded=()=>{q.result.createObjectStore('files');q.result.createObjectStore('meta')};q.onsuccess=()=>{const d=q.result;try{fn(d,x=>{d.close();r(x)})}catch(e){d.close();r(0)}};q.onerror=()=>r(0)}catch(e){r(0)}});
 const sz=v=>{try{if(v==null)return 0;if(typeof v==='string')return v.length;if(v.size!=null)return v.size;if(v.byteLength!=null)return v.byteLength;return JSON.stringify(v).length}catch(e){return 0}};
 const cacheInfo=async()=>(await idb((d,done)=>{let n=0,b=0;const t=d.transaction('files','readonly').objectStore('files').openCursor();t.onsuccess=()=>{const c=t.result;if(c){n++;b+=sz(c.value);c.continue()}else done({n,b})};t.onerror=()=>done({n,b})}))||{n:0,b:0};
 const clearC=async()=>{if(S&&S.clearSys){await S.clearSys();return}await idb((d,done)=>{const t=d.transaction(['files','meta'],'readwrite');t.objectStore('files').clear();t.objectStore('meta').clear();t.oncomplete=()=>done(1);t.onerror=()=>done(0)});try{const d=await(await navigator.storage.getDirectory()).getDirectoryHandle('sade');await d.removeEntry('files',{recursive:true})}catch(e){}};
 const clearBin=()=>{if(S){S.V().F[BK]=[];S.persist()}else{const v=getV();v.F=v.F||{};v.F[BK]=[];LS.setItem('sadevfs2',JSON.stringify(v))}};
 const nm=x=>typeof x==='string'?x:(x&&(x.n||x.name||x.title))||'Kitu';

 let D=null,busy=false;
 const chk={bin:true,cache:false};

 /* ---- scan na kuchora ---- */
 async function scan(){
  $('#rs').classList.add('spin');$('#sub').textContent='Inakokotoa nafasi…';$('#app').classList.add('sk');
  const est=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate().catch(()=>null):null;
  let ls=0;try{for(let i=0;i<LS.length;i++){const k=LS.key(i);ls+=k.length+(LS.getItem(k)||'').length}}catch(e){}
  const items=binA(),bin=sz(items.length?JSON.stringify(items):''),cache=await cacheInfo();
  D={est,ls,items,bin,cache};
  $('#rs').classList.remove('spin');$('#app').classList.remove('sk');
  draw();
  if(navigator.storage&&navigator.storage.persisted){const p=await navigator.storage.persisted().catch(()=>false);pers(p)}else pers(false)}
 function draw(){
  const {est,ls,items,bin,cache}=D,usage=est?est.usage:0,quota=est?est.quota:0;
  const set=Math.max(0,ls-bin),used=Math.max(usage,cache.b+ls),other=Math.max(0,used-cache.b-ls),den=quota||used||1;
  $('#ub').textContent=fmt(used);
  $('#uq').textContent=quota?'zimetumika kati ya '+fmt(quota)+' ('+(used/quota*100).toFixed(1)+'%)':'zimetumika';
  $('#sub').textContent=est?'Mfumo una nafasi ya '+fmt(Math.max(0,quota-used))+' iliyobaki':'Taarifa ya nafasi haipatikani kwenye kivinjari hiki';
  const S4=[['Cache ya mfumo',cache.b,'--c1'],['Recycle Bin',bin,'--c2'],['Mipangilio na mafaili',set,'--c3'],['Nyingine',other,'--c4']];
  $('#seg').innerHTML=S4.filter(s=>s[1]>0).map(s=>'<i style="width:'+Math.max(.8,s[1]/den*100).toFixed(2)+'%;background:var('+s[2]+')"></i>').join('');
  $('#lg').innerHTML=S4.map(s=>'<div><i style="background:var('+s[2]+')"></i><div><span>'+s[0]+'</span><b>'+fmt(s[1])+'</b></div></div>').join('');
  const rows=[['bin','trash','Recycle Bin',items.length?items.length+' vitu — vitafutwa kabisa':'Ni tupu',bin,items.length>0],['cache','layers','Cache ya mfumo (offline)',cache.n?cache.n+' mafaili — yatapakuliwa tena ukiwa online':'Hakuna mafaili',cache.b,cache.n>0]];
  $('#cl').innerHTML='';
  rows.forEach(r=>{const l=document.createElement('label');l.className='it';
   l.innerHTML='<input type="checkbox"'+(r[5]?'':' disabled')+'><span class="ico">'+svg(r[1])+'</span><span class="tx"><b></b><span class="m"></span></span><span class="sz"></span>';
   l.querySelector('b').textContent=r[2];l.querySelector('.m').textContent=r[3];l.querySelector('.sz').textContent=r[5]?fmt(r[4]):'–';
   const c=l.querySelector('input');c.checked=r[5]&&chk[r[0]];c.onchange=()=>{chk[r[0]]=c.checked;foot()};$('#cl').appendChild(l)});
  const ul=$('#bl');ul.innerHTML='';
  if(!items.length){const li=document.createElement('li');li.textContent='Recycle Bin ni tupu';ul.appendChild(li)}
  else{items.slice(0,8).forEach(x=>{const li=document.createElement('li');li.textContent=nm(x);ul.appendChild(li)});if(items.length>8){const li=document.createElement('li');li.textContent='…na vitu '+(items.length-8)+' zaidi';ul.appendChild(li)}}
  foot()}
 function sel(){const o=[];if(chk.bin&&D.items.length)o.push(['bin','Recycle Bin',D.bin]);if(chk.cache&&D.cache.n)o.push(['cache','Cache ya mfumo',D.cache.b]);return o}
 function foot(){const s=sel(),t=s.reduce((a,x)=>a+x[2],0);
  $('#fr').innerHTML=s.length?'Utaachilia takriban <b>'+fmt(t)+'</b>':'Chagua unachotaka kufuta';
  const g=$('#go');g.innerHTML=svg('broom',16)+'Safisha sasa';g.disabled=!s.length||busy}
 function pers(p){$('#pb').innerHTML=p?'<span class="badge ok">✓ Imewashwa</span>':'<button id="pr">Washa</button>';const b=$('#pr');if(b)b.onclick=async()=>{const r=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false;pers(r);msg(r?'✅ Hifadhi ya kudumu imeruhusiwa':'Kivinjari kimekataa (jaribu baada ya kuweka app kwenye skrini ya nyumbani)')}}

 /* ---- dirisha la uthibitisho ---- */
 function ask(t,x,ok){return new Promise(r=>{const d=$('#dlg');
  d.innerHTML='<div class="sc"><div class="dg" role="alertdialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt"></h2><p></p><div class="r"><button class="p" id="y"></button><button id="n">Ghairi</button></div></div></div>';
  d.querySelector('h2').textContent=t;d.querySelector('p').textContent=x;
  const y=d.querySelector('#y'),e=v=>{d.innerHTML='';r(v)};y.textContent=ok;y.onclick=()=>e(1);d.querySelector('#n').onclick=()=>e(0);
  d.querySelector('.sc').onkeydown=ev=>{if(ev.key==='Escape')e(0)};y.focus()})}

 /* ---- vitendo ---- */
 $('#go').onclick=async()=>{
  const s=sel();if(!s.length||busy)return;
  const names=s.map(x=>x[1]).join(' na '),tot=s.reduce((a,x)=>a+x[2],0);
  if(!await ask('Futa '+names+'?','Utaachilia takriban '+fmt(tot)+'. '+(chk.cache&&D.cache.n?'Mafaili uliyopakia hayafutwi; ya mfumo yatapakuliwa tena ukiwa online. ':'')+'Hatua hii haiwezi kutenduliwa.','Futa'))return;
  busy=true;$('#bar').classList.add('busy');foot();msg('');
  const pg=$('#pgi');let i=0;
  for(const x of s){pg.style.width=(i/s.length*100+8)+'%';$('#fr').textContent='Inafuta '+x[1]+'…';
   if(x[0]==='bin')clearBin();else await clearC();i++;pg.style.width=(i/s.length*100)+'%';await new Promise(r=>setTimeout(r,350))}
  busy=false;$('#bar').classList.remove('busy');pg.style.width='0';
  chk.bin=true;chk.cache=false;await scan();
  msg('✅ Imekamilika — umeachilia takriban '+fmt(tot))};
 $('#rs').onclick=()=>{if(!busy){msg('');scan()}};
 $('#st').onclick=()=>{if(S&&S.storageWin)S.storageWin();else msg('Dirisha la Hifadhi & Offline linapatikana ndani ya Sade Computer')};
 scan();
})();
</script></body></html>
