<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disk Cleanup</title>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--gt:#1e3287;--gl:#d3d6e2;--t1:#fbfcfe;--t2:#e4edf8;--bd:#b9c7dc;--h1:#f4f8fd;--h2:#e8f1fd;--hb:#b8d6fb;--s1:#e6f1fd;--s2:#cde2fa;--sb:#7da2ce;--mut:#6d6d6d;color-scheme:light}
.dk{--bg:#1f2329;--fg:#e8e8e8;--gt:#8fb0ff;--gl:#3c4250;--t1:#2c313a;--t2:#242830;--bd:#3d4452;--h1:#2a3140;--h2:#2f3849;--hb:#4a5d80;--s1:#2f4263;--s2:#2a3a58;--sb:#5f86c9;--mut:#9aa3b2;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.4 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.win{display:flex;flex-direction:column;height:100vh}
.cb{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:5px 8px;background:linear-gradient(var(--t1),var(--t2));border-bottom:1px solid var(--bd)}
.cb button{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:3px;padding:4px 9px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.cb button:hover:not(:disabled){background:linear-gradient(var(--h1),var(--h2));border-color:var(--hb)}
.cb button:active{background:var(--s2);border-color:var(--sb)}
.cb button:disabled{opacity:.45;cursor:default}
.cb .sp{flex:1}
.cb .srch{position:relative}.cb input{width:170px;padding:4px 26px 4px 8px;border:1px solid var(--bd);border-radius:3px;background:var(--bg);color:var(--fg);font:inherit;font-style:italic}
.cb .srch svg{position:absolute;right:6px;top:6px;color:var(--mut)}
button:focus-visible,input:focus-visible,.tile:focus-visible,.gh:focus-visible{outline:2px solid #3b8de0;outline-offset:1px}
#ib{margin:6px 10px 0;padding:6px 10px;border:1px solid #e0c96a;background:linear-gradient(#fffbe6,#fff3c2);color:#4a3d00;border-radius:3px}
#ib.ok{border-color:#8fcf8a;background:linear-gradient(#f2fff0,#d9f6d4);color:#12501a}
#ib.info{border-color:#9ec3ee;background:linear-gradient(#f4f9ff,#dcebfc);color:#123a6b}
main{flex:1;overflow:auto;padding:4px 6px}
.gh{display:flex;align-items:center;gap:7px;color:var(--gt);font-size:15px;padding:8px 8px 2px;cursor:pointer;user-select:none}
.gh i{flex:1;height:1px;background:linear-gradient(90deg,var(--gl),transparent);margin-left:6px}.tri{font-size:9px;color:#6b7aa8;width:10px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px;padding:4px 4px 8px 18px}
.tile{display:flex;align-items:center;gap:10px;padding:6px 26px 6px 8px;border:1px solid transparent;border-radius:3px;position:relative;cursor:default}
.tile:hover{background:linear-gradient(var(--h1),var(--h2));border-color:var(--hb)}
.tile.sel{background:linear-gradient(var(--s1),var(--s2));border-color:var(--sb)}
.di{width:64px;height:48px;flex:none}.tt{flex:1;min-width:0}.tt b{display:block;font-weight:400;font-size:13px}.tt span{color:var(--mut);font-size:12px}
.ck{position:absolute;top:8px;right:8px;margin:0;accent-color:#2a7fd4}
.pb{height:15px;border:1px solid #adadad;border-radius:2px;background:linear-gradient(#e4e4e4,#f9f9f9);margin:3px 0 2px;overflow:hidden;max-width:300px}
.pb i{display:block;height:100%;background:linear-gradient(#80d9f8 0,#2aa7de 45%,#168fc8 55%,#3ab8e8 100%);transition:width .6s}
.pb.hi i{background:linear-gradient(#f79a9a 0,#e03030 45%,#c81c1c 55%,#ea4a4a 100%)}
.pb.bz i{width:35% !important;background:linear-gradient(90deg,transparent,#06b025,transparent);animation:mq 1.1s linear infinite}
@keyframes mq{from{margin-left:-35%}to{margin-left:100%}}
.v-l .gl{grid-template-columns:1fr}.v-l .di{width:32px;height:24px}.v-l .pb{display:none}.v-l .tile{padding:3px 26px 3px 8px}.v-l .tt{display:flex;gap:12px;align-items:baseline}.v-l .tt b{min-width:170px}
.dp{display:flex;gap:14px;padding:10px 14px;background:linear-gradient(var(--t1),var(--t2));border-top:1px solid var(--bd);max-height:42vh;overflow:auto}
.dp .dl{width:64px;height:48px;flex:none}.dp>div{flex:1;min-width:0}.dn{font-size:14px;font-weight:600}.m{color:var(--mut)}
dl{display:grid;grid-template-columns:auto 1fr;gap:1px 14px;margin:6px 0 0}dt{color:var(--mut)}dd{margin:0;word-break:break-word}
.dp button,.dg button{font:inherit;color:var(--fg);padding:4px 16px;border:1px solid #707070;border-radius:3px;background:linear-gradient(#f2f2f2,#cfcfcf);cursor:pointer;margin-top:8px}
.dk .dp button,.dk .dg button{background:linear-gradient(#4a505c,#363b45);border-color:#6a7282}
.dp button:hover,.dg button:hover:not(:disabled){border-color:#3c7fb1;box-shadow:inset 0 0 0 1px #aee1ff}
.dg button:disabled{opacity:.5}
.sb{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 12px;border-top:1px solid var(--bd);background:var(--t2);color:var(--mut);font-size:12px}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:12px;z-index:9}
.dg{background:var(--bg);width:100%;max-width:420px;border:1px solid #5a7aa8;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.45);overflow:hidden}
.cap{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 5px 12px;background:linear-gradient(#e8f0fb,#c3d6ee);border-bottom:1px solid #8ea6c8;color:#1b2b46}
.dk .cap{background:linear-gradient(#3a4a66,#2b3850);color:#e8eefc}
.cap .x{margin:0;padding:0 14px;border-color:#7a2a2a;background:linear-gradient(#e89a8f,#c0392b);color:#fff;border-radius:3px}
.db{padding:12px 14px}.db p{margin:0 0 8px}.fl{border:1px solid var(--bd);border-radius:3px;max-height:190px;overflow:auto;margin-bottom:8px}
.fl label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--gl)}.fl label:last-child{border:0}.fl label:hover{background:var(--h2)}
.fl svg{width:30px;height:22px;flex:none}.fl span{flex:1}.fl b{font-weight:400;color:var(--mut)}
.ds{min-height:36px;padding:6px 8px;border:1px solid var(--bd);border-radius:3px;background:var(--t1);font-size:12px}
.pg2{height:16px;border:1px solid #adadad;border-radius:2px;margin-top:8px;overflow:hidden;display:none}.pg2 i{display:block;height:100%;width:0;background:linear-gradient(#8fe58f,#1fb21f 50%,#0f9a0f 51%,#3fd03f);transition:width .3s}
.r{display:flex;gap:8px;justify-content:flex-end}.pad{padding:14px}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media(max-width:520px){.cb input{width:110px}.gl{padding-left:6px;grid-template-columns:1fr}.dp{flex-direction:column}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafbfc"/><stop offset="1" stop-color="#c3c9d2"/></linearGradient>
<linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcc1ca"/><stop offset="1" stop-color="#666c75"/></linearGradient>
<linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a707a"/><stop offset="1" stop-color="#1b1e23"/></linearGradient>
<linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d2d7de"/></linearGradient></defs>
<symbol id="hd" viewBox="0 0 64 48"><path d="M9 27L17 11H47L55 27Z" fill="url(#gT)" stroke="#8b919a"/><path d="M4 27H60V39a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3Z" fill="url(#gF)" stroke="#5d636b"/><circle cx="52" cy="34" r="2" fill="#4be04b"/></symbol>
<symbol id="hdw" viewBox="0 0 64 48"><use href="#hd"/><g transform="translate(23 14) skewX(-14)"><rect width="8" height="5" fill="#e5412d"/><rect x="9" width="8" height="5" fill="#7cb93a"/><rect y="6" width="8" height="5" fill="#1e88d4"/><rect x="9" y="6" width="8" height="5" fill="#f6b91f"/></g></symbol>
<symbol id="hdx" viewBox="0 0 64 48"><path d="M17 45V11a6 6 0 0 1 6-6h18a6 6 0 0 1 6 6v34Z" fill="url(#gD)" stroke="#0e0f12"/><rect x="23" y="11" width="18" height="3" rx="1.5" fill="#f08a1c"/></symbol>
<symbol id="rm" viewBox="0 0 64 48"><path d="M9 27L17 13H47L55 27Z" fill="url(#gW)" stroke="#aab0b9"/><path d="M4 27H60V37a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3Z" fill="url(#gW)" stroke="#aab0b9"/></symbol>
<symbol id="dvd" viewBox="0 0 64 48"><ellipse cx="32" cy="16" rx="17" ry="8" fill="#cfd4db" stroke="#8b919a"/><ellipse cx="32" cy="16" rx="4" ry="2" fill="#f4f6f8"/><path d="M4 27H60V39a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3Z" fill="url(#gF)" stroke="#5d636b"/><rect x="9" y="31" width="22" height="4" rx="1" fill="#2a2e34"/></symbol>
<symbol id="net" viewBox="0 0 64 48"><g transform="translate(0 -7)"><path d="M9 27L17 11H47L55 27Z" fill="url(#gT)" stroke="#8b919a"/><path d="M4 27H60V37a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3Z" fill="url(#gF)" stroke="#5d636b"/></g><path d="M18 32v10h14" stroke="#2e9d3a" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="30" y="39" width="12" height="6" rx="2" fill="#35b84a" stroke="#1d7a2a"/></symbol></svg>
<div class="win">
 <div class="cb" role="toolbar" aria-label="Amri">
  <button id="bc"></button><button id="br"></button><button id="ba"></button><button id="bv"></button><button id="bh" aria-label="Msaada">?</button>
  <span class="sp"></span><div class="srch"><input id="q" type="search" placeholder="Tafuta diski" aria-label="Tafuta diski"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
 </div>
 <div id="ib" role="status" aria-live="polite" hidden></div>
 <main id="mn"></main>
 <section class="dp" id="dp" aria-label="Maelezo"></section>
 <footer class="sb"><span id="s1"></span><span id="s2"></span></footer>
</div>
<div id="dlg"></div>
<script>
const P=(()=>{try{if(parent!==window&&parent.document)return parent}catch(e){}return window})();
const th=()=>{try{document.documentElement.classList.toggle('dk',P.document.body.classList.contains('dark'))}catch(e){}};
th();try{new MutationObserver(th).observe(P.document.body,{attributes:true,attributeFilter:['class']})}catch(e){}
(function(){
 const $=s=>document.querySelector(s),LS=P.localStorage,S=P.SADE,BK='Recycle Bin';
 const IC={broom:'<path d="M14 3l7 7M13 8l-9 9 3 3 9-9M7 14l3 3"/>',refresh:'<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/>',check:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-6"/>',view:'<rect x="3" y="4" width="7" height="7"/><rect x="14" y="4" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>'};
 const svg=n=>'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2a6fb8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';
 const fmt=b=>b<1024?Math.round(b)+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
 const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 $('#bc').innerHTML=svg('broom')+'Safisha sasa';$('#br').innerHTML=svg('refresh')+'Changanua upya';$('#bv').innerHTML=svg('view')+'Tazama';
 const ib=(t,k)=>{const b=$('#ib');if(!t){b.hidden=true;return}b.hidden=false;b.className=k||'';b.textContent=t};

 /* ---- data ---- */
 const getV=()=>{if(S)return S.V();try{return JSON.parse(LS.getItem('sadevfs2')||'{}')}catch(e){return {}}};
 const binA=()=>{const v=getV();return v.F&&v.F[BK]?v.F[BK]:[]};
 const idb=fn=>new Promise(r=>{try{const q=P.indexedDB.open('SadeComputerDB',1);q.onupgradeneeded=()=>{q.result.createObjectStore('files');q.result.createObjectStore('meta')};q.onsuccess=()=>{const d=q.result;try{fn(d,x=>{d.close();r(x)})}catch(e){d.close();r(0)}};q.onerror=()=>r(0)}catch(e){r(0)}});
 const sz=v=>{try{if(v==null)return 0;if(typeof v==='string')return v.length;if(v.size!=null)return v.size;if(v.byteLength!=null)return v.byteLength;return JSON.stringify(v).length}catch(e){return 0}};
 const cacheInfo=async()=>(await idb((d,done)=>{let n=0,b=0;const t=d.transaction('files','readonly').objectStore('files').openCursor();t.onsuccess=()=>{const c=t.result;if(c){n++;b+=sz(c.value);c.continue()}else done({n,b})};t.onerror=()=>done({n,b})}))||{n:0,b:0};
 const clearC=async()=>{if(S&&S.clearSys){await S.clearSys();return}await idb((d,done)=>{const t=d.transaction(['files','meta'],'readwrite');t.objectStore('files').clear();t.objectStore('meta').clear();t.oncomplete=()=>done(1);t.onerror=()=>done(0)});try{const d=await(await navigator.storage.getDirectory()).getDirectoryHandle('sade');await d.removeEntry('files',{recursive:true})}catch(e){}};
 const clearBin=()=>{if(S){S.V().F[BK]=[];S.persist()}else{const v=getV();v.F=v.F||{};v.F[BK]=[];LS.setItem('sadevfs2',JSON.stringify(v))}};
 const nm=x=>typeof x==='string'?x:(x&&(x.n||x.name||x.title))||'Kitu';
 const H=()=>{try{return JSON.parse(LS.getItem('sade_dc_hist')||'{}')}catch(e){return {}}};

 const GN=['Diski Kuu','Vifaa vya Kuondolewa','Mahali pa Mtandao'];
 const TY={hdw:'Diski ya Ndani',hdx:'Diski ya Ndani',rm:'Hifadhi ya Kuondolewa',dvd:'Hifadhi ya Kuondolewa',net:'Mahali pa Mtandao'};
 let D=null,sc=false,busy=false,cur='c',view='t',q='';const col=[0,0,0],chk={d:false,e:true};

 async function persist(){const r=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false;D.pers=r;render();ib(r?'✅ Hifadhi ya kudumu imeruhusiwa':'Kivinjari kimekataa (jaribu baada ya kuweka app kwenye skrini ya nyumbani)',r?'ok':'')}
 function openOff(){if(S&&S.storageWin)S.storageWin();else ib('Dirisha la Hifadhi & Offline linapatikana ndani ya Sade Computer')}
 function items(){const {est,ls,items:bi,bin,cache}=D,usage=est?est.usage:0,quota=est?est.quota:0,set=Math.max(0,ls-bin),used=Math.max(usage,cache.b+ls),other=Math.max(0,used-cache.b-ls),cap=quota||used||1;
  return [
  {id:'c',g:0,n:'Diski ya Ndani (C:)',ic:'hdw',u:used,cap,t:quota?fmt(Math.max(0,quota-used))+' zimebaki kati ya '+fmt(quota):fmt(used)+' zimetumika',fs:'IndexedDB + localStorage',free:quota?Math.max(0,quota-used):null},
  {id:'d',g:0,n:'Mafaili ya Sade (D:)',ic:'hdx',u:cache.b,cap,t:fmt(cache.b)+' — mafaili '+cache.n,cl:cache.n>0,fs:'IndexedDB (SadeComputerDB)',desc:'Mafaili ya mfumo yaliyohifadhiwa offline. Mafaili uliyopakia hayafutwi; ya mfumo yatapakuliwa tena ukiwa online.'},
  {id:'e',g:1,n:'Recycle Bin (E:)',ic:'rm',u:bin,cap,t:fmt(bin)+' — vitu '+bi.length,cl:bi.length>0,fs:'localStorage (sadevfs2)',desc:'Vitu ulivyofuta awali. Vikifutwa havirudi tena.'},
  {id:'f',g:1,n:'Mipangilio (F:)',ic:'dvd',u:set,cap,t:fmt(set)+' — mipangilio na orodha ya mafaili',fs:'localStorage'},
  {id:'g',g:1,n:'Nyingine (G:)',ic:'rm',u:other,cap,t:fmt(other)+' — data ya programu zingine',fs:'Cache / IndexedDB nyingine'},
  {id:'p',g:2,n:'Hifadhi ya Kudumu (P:)',ic:'net',nb:1,t:D.pers?'Imewashwa — kivinjari hakifuti data yako':'Haijawashwa — bofya mara mbili kuwasha',act:persist,al:D.pers?0:'Washa'},
  {id:'o',g:2,n:'Hifadhi & Offline (O:)',ic:'net',nb:1,t:'Bofya mara mbili kufungua dirisha',act:openOff,al:'Fungua'}]}

 /* ---- kuchora ---- */
 function tile(x){const p=x.nb?0:Math.min(100,x.u/x.cap*100),hi=x.id==='c'&&p>=90;
  return '<div class="tile'+(x.id===cur?' sel':'')+'" tabindex="0" data-id="'+x.id+'"><svg class="di"><use href="#'+x.ic+'"/></svg><div class="tt"><b>'+x.n+'</b>'+(x.nb?'':'<div class="pb'+(hi?' hi':'')+(sc?' bz':'')+'"><i style="width:'+(x.u>0?Math.max(1.5,p):0).toFixed(1)+'%"></i></div>')+'<span>'+x.t+'</span></div>'+(x.cl?'<input type="checkbox" class="ck" aria-label="Chagua '+x.n+' kufuta"'+(chk[x.id]?' checked':'')+'>':'')+'</div>'}
 function render(){const m=$('#mn');if(!D){m.innerHTML='<p class="m pad">Inakokotoa nafasi…</p>';return}
  const f=m.contains(document.activeElement),it=items();let h='';m.className=view==='l'?'v-l':'';
  GN.forEach((gn,gi)=>{const all=it.filter(x=>x.g===gi),vis=all.filter(x=>!q||x.n.toLowerCase().includes(q));if(!vis.length)return;
   h+='<div class="gh" data-g="'+gi+'" role="button" tabindex="0" aria-expanded="'+!col[gi]+'"><span class="tri">'+(col[gi]?'▶':'◢')+'</span>'+gn+' ('+all.length+')<i></i></div>';
   if(!col[gi])h+='<div class="gl">'+vis.map(tile).join('')+'</div>'});
  m.innerHTML=h||'<p class="m pad">Hakuna kilichopatikana.</p>';
  if(f){const n=m.querySelector('[data-id="'+cur+'"]');n&&n.focus()}
  details(it);foot(it)}
 function details(it){const x=it.find(i=>i.id===cur)||it[0],r=[];
  if(!x.nb){r.push(['Imetumika',fmt(x.u)]);if(x.free!=null)r.push(['Imebaki',fmt(x.free)]);r.push([x.id==='c'?'Ukubwa wote':'Sehemu ya nafasi',x.id==='c'?fmt(x.cap):(x.u/x.cap*100).toFixed(1)+'%']);r.push(['Mfumo wa faili',x.fs])}
  else r.push(['Hali',x.t]);
  if(x.id==='c'){const h=H();r.push(['Usafishaji wa mwisho',h.t?new Date(h.t).toLocaleString()+' ('+fmt(h.last||0)+')':'Bado hujasafisha']);if(h.total)r.push(['Jumla iliyoachiliwa',fmt(h.total)])}
  if(x.id==='e'&&D.items.length){const a=D.items.slice(0,5).map(i=>esc(nm(i)));r.push(['Vilivyomo',a.join(', ')+(D.items.length>5?' …+'+(D.items.length-5):'')])}
  if(x.desc)r.push(['Maelezo',x.desc]);
  const bar=x.nb?'':'<div class="pb'+(x.id==='c'&&x.u/x.cap>=.9?' hi':'')+'" style="max-width:340px"><i style="width:'+(x.u>0?Math.max(1.5,Math.min(100,x.u/x.cap*100)):0).toFixed(1)+'%"></i></div>';
  $('#dp').innerHTML='<svg class="dl"><use href="#'+x.ic+'"/></svg><div><div class="dn">'+x.n+'</div><span class="m">'+TY[x.ic]+'</span>'+bar+'<dl>'+r.map(a=>'<dt>'+a[0]+'</dt><dd>'+a[1]+'</dd>').join('')+'</dl>'+(x.al?'<button id="da">'+x.al+'</button>':'')+'</div>';
  const b=$('#da');if(b)b.onclick=x.act}
 const selL=()=>items().filter(x=>x.cl&&chk[x.id]);
 function foot(it){const s=selL(),t=s.reduce((a,x)=>a+x.u,0),n=navigator.deviceMemory,c=navigator.hardwareConcurrency;
  $('#s1').textContent='Vitu '+it.length+'  |  Vilivyochaguliwa kufuta: '+s.length+(s.length?'  |  Utaachilia ≈ '+fmt(t):'');
  $('#s2').textContent=(n?'Kumbukumbu: '+n+' GB':'')+(n&&c?'  |  ':'')+(c?'Prosesa: '+c+' core':'');
  $('#bc').disabled=busy||!it.some(x=>x.cl);$('#ba').innerHTML=svg('check')+(it.filter(x=>x.cl).every(x=>chk[x.id])?'Ondoa zote':'Chagua zote')}
 function tip(){const x=items()[0],p=x.u/x.cap;
  if(p>=.85&&D.est)ib('⚠ Nafasi inakaribia kujaa ('+(p*100).toFixed(0)+'%). Futa Recycle Bin au cache ili kuachilia nafasi.');
  else if(D.bin>0)ib('Recycle Bin ina '+fmt(D.bin)+' (vitu '+D.items.length+'). Unaweza kuifuta kwa Safisha sasa.','info');else ib('')}

 /* ---- scan ---- */
 async function scan(){sc=true;if(D)render();
  const est=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate().catch(()=>null):null;
  let ls=0;try{for(let i=0;i<LS.length;i++){const k=LS.key(i);ls+=k.length+(LS.getItem(k)||'').length}}catch(e){}
  const items=binA(),bin=items.length?sz(JSON.stringify(items)):0,cache=await cacheInfo();
  const pers=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted().catch(()=>false):false;
  D={est,ls,items,bin,cache,pers};sc=false;render();tip()}

 /* ---- Disk Cleanup dialog ---- */
 function cleanDlg(){if(busy)return;const L=items().filter(x=>x.cl);if(!L.length){ib('Hakuna cha kufuta — Recycle Bin na cache ni tupu.','ok');return}
  const d=$('#dlg');d.innerHTML='<div class="sc"><div class="dg" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="cap"><span id="dt">Disk Cleanup</span><button class="x" id="dx" aria-label="Funga">✕</button></div><div class="db"><p>Disk Cleanup inaweza kuachilia nafasi kwenye <b>Diski ya Ndani (C:)</b>. Chagua mafaili ya kufuta:</p><div class="fl"></div><p>Jumla ya nafasi utakayoachilia: <b id="gn"></b></p><div class="ds" id="dsc">Elea juu ya kipengee kuona maelezo.</div><div class="pg2"><i id="pi"></i></div><div class="r"><button id="ok">Futa mafaili</button><button id="no">Ghairi</button></div></div></div></div>';
  const fl=d.querySelector('.fl'),gn=d.querySelector('#gn'),ds=d.querySelector('#dsc'),close=()=>{d.innerHTML=''};
  const upd=()=>{gn.textContent=fmt(L.filter(x=>chk[x.id]).reduce((a,x)=>a+x.u,0));d.querySelector('#ok').disabled=!L.some(x=>chk[x.id])};
  L.forEach(x=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox"'+(chk[x.id]?' checked':'')+'><svg><use href="#'+x.ic+'"/></svg><span>'+x.n+'</span><b>'+fmt(x.u)+'</b>';
   l.querySelector('input').onchange=e=>{chk[x.id]=e.target.checked;upd()};l.onmouseenter=()=>{ds.textContent=x.desc};fl.appendChild(l)});
  upd();d.querySelector('#no').onclick=d.querySelector('#dx').onclick=()=>{if(!busy){close();render()}};
  d.querySelector('.sc').onkeydown=e=>{if(e.key==='Escape'&&!busy){close();render()}};
  d.querySelector('#ok').onclick=async()=>{const s=L.filter(x=>chk[x.id]);if(!s.length)return;
   busy=true;d.querySelectorAll('button,input').forEach(b=>b.disabled=true);const pg=d.querySelector('.pg2'),pi=d.querySelector('#pi');pg.style.display='block';let i=0,tot=s.reduce((a,x)=>a+x.u,0);
   for(const x of s){ds.textContent='Inafuta '+x.n+'…';pi.style.width=(i/s.length*100+8)+'%';if(x.id==='e')clearBin();else await clearC();i++;pi.style.width=(i/s.length*100)+'%';await new Promise(r=>setTimeout(r,400))}
   const h=H();h.t=Date.now();h.last=tot;h.total=(h.total||0)+tot;try{LS.setItem('sade_dc_hist',JSON.stringify(h))}catch(e){}
   busy=false;close();chk.d=false;chk.e=true;await scan();ib('✅ Disk Cleanup imekamilika — umeachilia takriban '+fmt(tot),'ok')};
  d.querySelector('#ok').focus()}

 /* ---- matukio ---- */
 const mn=$('#mn');
 mn.onclick=e=>{const g=e.target.closest('.gh');if(g){col[+g.dataset.g]^=1;render();return}
  const t=e.target.closest('.tile');if(!t)return;cur=t.dataset.id;if(e.target.classList.contains('ck'))chk[cur]=e.target.checked;render()};
 mn.ondblclick=e=>{const t=e.target.closest('.tile');if(!t)return;const x=items().find(i=>i.id===t.dataset.id);if(x&&x.act)x.act()};
 mn.onkeydown=e=>{const g=e.target.closest('.gh'),t=e.target.closest('.tile');
  if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();col[+g.dataset.g]^=1;render()}
  else if(t&&e.target===t){const id=t.dataset.id,x=items().find(i=>i.id===id);
   if(e.key===' '&&x.cl){e.preventDefault();chk[id]=!chk[id];cur=id;render()}
   else if(e.key==='Enter'){e.preventDefault();cur=id;render();if(x.act)x.act()}}};
 $('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
 $('#bc').onclick=cleanDlg;$('#br').onclick=()=>{if(!busy){ib('');scan()}};
 $('#ba').onclick=()=>{const c=items().filter(x=>x.cl),all=c.every(x=>chk[x.id]);c.forEach(x=>chk[x.id]=!all);render()};
 $('#bv').onclick=()=>{view=view==='t'?'l':'t';render()};
 $('#bh').onclick=()=>ib('Bofya diski kuona maelezo. Weka alama kwenye kisanduku kuchagua cha kufuta, kisha bonyeza Safisha sasa. Njia za mkato: F5 changanua, Delete safisha, Ctrl+A chagua zote.','info');
 document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='checkbox'||$('#dlg').firstChild)return;
  if(e.key==='F5'){e.preventDefault();$('#br').click()}else if(e.key==='Delete')cleanDlg();else if(e.key==='a'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('#ba').click()}});
 render();scan();
})();
</script></body></html>
