<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PowerPoint</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js" defer></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;background:#d9d9d9;color:#222}
#rb{background:#f3f3f3;border-bottom:1px solid #c8c8c8;border-top:3px solid #b7472a;padding:4px 6px;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
#rb button,#rb select,#rb input[type=number]{background:#fff;border:1px solid #c8c8c8;border-radius:3px;padding:4px 8px;cursor:pointer;font:inherit;color:#222}
#rb button:hover,#rb select:hover{background:#fbe4dc;border-color:#b7472a}
#rb input[type=color]{width:28px;height:26px;padding:0;border:1px solid #c8c8c8;background:#fff}
.sp{width:1px;height:22px;background:#c8c8c8;margin:0 4px}
#main{flex:1;display:flex;min-height:0}
#th{width:172px;overflow:auto;background:#e6e6e6;padding:8px;border-right:1px solid #c8c8c8;flex:none}
.th{position:relative;width:154px;height:88px;margin-bottom:10px;border:2px solid transparent;background:#fff;cursor:pointer;overflow:hidden}
.th.on{border-color:#b7472a}
.th .tin{width:960px;height:540px;transform:scale(.15625);transform-origin:0 0;position:absolute;left:0;top:0;pointer-events:none;overflow:hidden}
.th b{position:absolute;left:2px;bottom:0;font-size:10px;background:#fffc;padding:0 3px;z-index:2}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px;min-width:0}
#slw{position:relative;box-shadow:0 2px 10px #0006}
.slide{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#fff}
.el{position:absolute;box-sizing:border-box;overflow:hidden}
.shp{display:flex;align-items:center;justify-content:center}
.in{width:100%;outline:0;white-space:pre-wrap;word-break:break-word}
#sl .el{cursor:move}#sl .el.sel{outline:2px solid #b7472a;overflow:visible}
.rh{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:#fff;border:2px solid #b7472a;cursor:nwse-resize}
#sb{background:#b7472a;color:#fff;padding:3px 10px;display:flex;justify-content:space-between;font-size:12px}
#pres{position:fixed;inset:0;background:#000;display:none;z-index:99;overflow:hidden}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block}#pr .slide{position:relative;page-break-after:always;transform:none}@page{size:960px 540px;margin:0}}
@media(max-width:700px){#th{width:90px}.th{width:72px;height:42px}.th .tin{transform:scale(.075)}}
</style></head><body>
<div id="rb">
<button onclick="newP()">📄 Mpya</button><button onclick="fi.click()">📂 Fungua</button><button onclick="save()">💾 Hifadhi</button>
<select onchange="exp(this.value);this.value=''"><option value="">⬇ Hamisha nje…</option><option value="pptx">PowerPoint (.pptx)</option><option value="html">Wasilisho (HTML)</option><option value="json">JSON</option><option value="pdf">PDF / Chapisha</option></select>
<span class="sp"></span>
<select onchange="addS(this.value);this.value=''"><option value="">➕ Slaidi mpya…</option><option value="t">Kichwa</option><option value="tc">Kichwa + Maudhui</option><option value="b">Tupu</option></select>
<button onclick="dupS()">⧉ Rudufu</button><button onclick="delS()">🗑 Futa slaidi</button><button onclick="mvS(-1)">▲</button><button onclick="mvS(1)">▼</button><input type="color" value="#ffffff" title="Usuli wa slaidi" onchange="bg(this.value)">
<span class="sp"></span>
<button onclick="addE('text')">🅣 Maandishi</button><button onclick="addE('rect')">▭</button><button onclick="addE('ellipse')">◯</button><button onclick="addE('line')">━</button><button onclick="fimg.click()">🖼 Picha</button>
<span class="sp"></span>
<select id="ff" onchange="setP('ff',this.value)"><option>Segoe UI</option><option>Arial</option><option>Times New Roman</option><option>Georgia</option><option>Verdana</option><option>Courier New</option><option>Impact</option><option>Comic Sans MS</option></select>
<input id="fs" type="number" value="28" min="6" max="200" style="width:60px" onchange="setP('fs',+this.value)">
<button onclick="fmt('b')"><b>B</b></button><button onclick="fmt('i')"><i>I</i></button><button onclick="setP('a','left')">⇤</button><button onclick="setP('a','center')">≡</button><button onclick="setP('a','right')">⇥</button>
<input type="color" value="#000000" title="Rangi ya maandishi" onchange="setP('c',this.value)"><input type="color" value="#4472c4" title="Rangi ya kujaza" onchange="setP('fill',this.value)">
<button onclick="ord(1)" title="Leta mbele">⬆</button><button onclick="ord(-1)" title="Peleka nyuma">⬇</button>
<span class="sp"></span>
<button onclick="cp(0)">⧉ Nakili</button><button onclick="cp(1)">✂ Kata</button><button onclick="pst()">📋 Bandika</button><button onclick="delE()">✖ Futa</button>
<button onclick="undo()">↶</button><button onclick="redo()">↷</button>
<button onclick="present()" style="background:#b7472a;color:#fff;border-color:#b7472a">▶ Onyesha</button>
</div>
<div id="main"><div id="th"></div><div id="stage"><div id="slw"><div class="slide" id="sl"></div></div></div></div>
<div id="sb"><span id="st"></span><span>Bofya mara mbili kuhariri maandishi · Buruta kuhamisha · Kona kubadilisha ukubwa · F5 onyesha</span></div>
<div id="pres"></div><div id="pr"></div>
<input type="file" id="fi" hidden accept=".json"><input type="file" id="fimg" hidden accept="image/*">
<script>
const $=i=>document.getElementById(i),uid=()=>Math.random().toString(36).slice(2,9),sl=$('sl'),fi=$('fi'),fimg=$('fimg');
let P,cur=0,sel=null,hist=[],fut=[],clip=null,sc=1,drag=null,dragS=null,pi=0;
const css=e=>`left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;font-size:${e.fs}px;font-family:'${e.ff||'Segoe UI'}';color:${e.c};background:${e.fill||'transparent'};font-weight:${e.b?700:400};font-style:${e.i?'italic':'normal'};text-align:${e.a||'left'};border-radius:${e.t=='ellipse'?'50%':0};`;
const inner=e=>e.t=='img'?`<img src="${e.src}" style="width:100%;height:100%;object-fit:fill;display:block">`:`<div class="in">${e.html||''}</div>`;
const slideHTML=(s,live)=>s.els.map(e=>`<div ${live?`data-id="${e.id}" `:''}class="el${e.t=='text'||e.t=='img'?'':' shp'}${live&&e.id==sel?' sel':''}" style="${css(e)}">${inner(e)}${live&&e.id==sel?'<div class="rh"></div>':''}</div>`).join('');
const mk=(t,x,y,w,h,o={})=>({id:uid(),t,x,y,w,h,fs:28,c:'#000000',fill:'',html:'',...o});
const layout=k=>k=='t'?[mk('text',80,170,800,110,{fs:54,b:1,a:'center',html:'Kichwa cha wasilisho'}),mk('text',80,300,800,60,{a:'center',c:'#595959',html:'Kichwa kidogo'})]:k=='tc'?[mk('text',60,40,840,80,{fs:40,b:1,html:'Kichwa cha slaidi'}),mk('text',60,140,840,340,{fs:26,html:'• Hoja ya kwanza<br>• Hoja ya pili<br>• Hoja ya tatu'})]:[];
const S=()=>P.slides[cur],el=id=>S().els.find(e=>e.id==id);
function flush(){const a=document.activeElement;if(a&&a.classList&&a.classList.contains('in')&&a.isContentEditable)a.blur()}
function snap(){flush();hist.push(JSON.stringify(P));if(hist.length>30)hist.shift();fut=[]}
function undo(){flush();if(!hist.length)return;fut.push(JSON.stringify(P));P=JSON.parse(hist.pop());cur=Math.min(cur,P.slides.length-1);sel=null;render()}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(P));P=JSON.parse(fut.pop());cur=Math.min(cur,P.slides.length-1);sel=null;render()}
const persist=()=>{try{localStorage.pp=JSON.stringify(P)}catch(e){}};
function fit(){const st=$('stage');sc=Math.max(.1,Math.min((st.clientWidth-32)/960,(st.clientHeight-32)/540));$('slw').style.width=960*sc+'px';$('slw').style.height=540*sc+'px';sl.style.transform=`scale(${sc})`}
function stage(){fit();sl.style.background=S().bg;sl.innerHTML=slideHTML(S(),1)}
function thumbs(){const t=$('th');t.innerHTML='';P.slides.forEach((s,i)=>{const d=document.createElement('div');d.className='th'+(i==cur?' on':'');d.draggable=true;d.innerHTML=`<div class="tin" style="background:${s.bg}">${slideHTML(s)}</div><b>${i+1}</b>`;d.onclick=()=>{flush();cur=i;sel=null;render()};d.ondragstart=()=>dragS=i;d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();if(dragS==null||dragS==i)return;snap();const[x]=P.slides.splice(dragS,1);P.slides.splice(i,0,x);cur=i;dragS=null;render()};t.appendChild(d)})}
function sync(){const o=sel&&el(sel);if(o){$('fs').value=o.fs;$('ff').value=o.ff||'Segoe UI'}}
function render(){stage();thumbs();sync();$('st').textContent=`Slaidi ${cur+1} ya ${P.slides.length}`;persist()}
function pick(id){sel=id;sl.querySelectorAll('.el').forEach(x=>{const on=x.dataset.id==id,h=x.querySelector(':scope>.rh');x.classList.toggle('sel',on);if(h&&!on)h.remove();if(on&&!h)x.insertAdjacentHTML('beforeend','<div class="rh"></div>')});sync()}
sl.onmousedown=e=>{if(e.target.isContentEditable)return;const d=e.target.closest('.el');flush();if(!d){pick(null);return}const o=el(d.dataset.id);pick(o.id);drag={m:e.target.classList.contains('rh')?'r':'m',x:e.clientX,y:e.clientY,ox:o.x,oy:o.y,ow:o.w,oh:o.h,moved:false};e.preventDefault()};
document.addEventListener('mousemove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)/sc,dy=(e.clientY-drag.y)/sc;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<3)return;if(!drag.moved){const o=el(sel);const keep={x:o.x,y:o.y,w:o.w,h:o.h};Object.assign(o,{x:drag.ox,y:drag.oy,w:drag.ow,h:drag.oh});snap();Object.assign(o,keep);drag.moved=true}
const o=el(sel);if(drag.m=='m'){o.x=Math.round(drag.ox+dx);o.y=Math.round(drag.oy+dy)}else{o.w=Math.max(30,Math.round(drag.ow+dx));o.h=Math.max(20,Math.round(drag.oh+dy))}
const d=sl.querySelector(`[data-id="${sel}"]`);d.style.left=o.x+'px';d.style.top=o.y+'px';d.style.width=o.w+'px';d.style.height=o.h+'px'});
document.addEventListener('mouseup',()=>{if(drag&&drag.moved){thumbs();persist()}drag=null});
sl.ondblclick=e=>{const d=e.target.closest('.el');if(!d||d.querySelector('img'))return;const o=el(d.dataset.id),inn=d.querySelector('.in');snap();inn.contentEditable=true;inn.focus();const r=document.createRange();r.selectNodeContents(inn);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);inn.onblur=()=>{o.html=inn.innerHTML;inn.contentEditable=false;thumbs();persist()}};
function setP(k,v){if(!sel)return;snap();el(sel)[k]=v;stage();thumbs();persist()}
function fmt(k){const a=document.activeElement;if(a&&a.isContentEditable){document.execCommand(k=='b'?'bold':'italic');return}if(!sel)return;snap();const o=el(sel);o[k]=!o[k];stage();thumbs();persist()}
function addE(t){snap();const o=t=='text'?mk('text',280,220,400,70,{html:'Maandishi mapya'}):t=='line'?mk('rect',280,270,400,4,{fill:'#000000'}):mk(t,330,170,300,200,{fill:'#4472c4',c:'#ffffff',a:'center'});S().els.push(o);sel=o.id;render()}
function delE(){if(!sel)return;snap();S().els=S().els.filter(e=>e.id!=sel);sel=null;render()}
function ord(d){if(!sel)return;snap();const a=S().els,i=a.findIndex(e=>e.id==sel),j=d>0?Math.min(a.length-1,i+1):Math.max(0,i-1);[a[i],a[j]]=[a[j],a[i]];render()}
function cp(cut){if(!sel)return;clip=JSON.parse(JSON.stringify(el(sel)));if(cut)delE()}
function pst(){if(!clip)return;snap();clip.x+=20;clip.y+=20;const o={...JSON.parse(JSON.stringify(clip)),id:uid()};S().els.push(o);sel=o.id;render()}
function addImg(src){const im=new Image();im.onload=()=>{const k=Math.min(1,600/im.width,400/im.height);snap();const o=mk('img',100,80,Math.round(im.width*k),Math.round(im.height*k),{src});S().els.push(o);sel=o.id;render()};im.src=src}
fimg.onchange=()=>{const f=fimg.files[0];if(!f)return;const r=new FileReader();r.onload=()=>addImg(r.result);r.readAsDataURL(f);fimg.value=''};
document.addEventListener('paste',e=>{if(e.target.isContentEditable||/INPUT/.test(e.target.tagName))return;for(const it of e.clipboardData.items)if(it.type.startsWith('image')){const r=new FileReader();r.onload=()=>addImg(r.result);r.readAsDataURL(it.getAsFile());e.preventDefault();return}pst()});
function addS(k){if(!k)return;snap();P.slides.splice(cur+1,0,{bg:'#ffffff',els:layout(k)});cur++;sel=null;render()}
function dupS(){snap();const c=JSON.parse(JSON.stringify(S()));c.els.forEach(e=>e.id=uid());P.slides.splice(cur+1,0,c);cur++;sel=null;render()}
function delS(){snap();if(P.slides.length>1){P.slides.splice(cur,1);cur=Math.max(0,cur-1)}else P.slides[0]={bg:'#ffffff',els:[]};sel=null;render()}
function mvS(d){const j=cur+d;if(j<0||j>=P.slides.length)return;snap();const[s]=P.slides.splice(cur,1);P.slides.splice(j,0,s);cur=j;render()}
function bg(v){snap();S().bg=v;render()}
function newP(){if(!confirm('Anza wasilisho jipya? La sasa litafutwa.'))return;P=def();cur=0;sel=null;hist=[];fut=[];render()}
const def=()=>({slides:[{bg:'#ffffff',els:layout('t')}]});
const dl=(n,m,d)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)};
function save(){flush();persist();dl('wasilisho.json','application/json',JSON.stringify(P))}
fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.slides||!x.slides.length)throw 0;snap();P=x;cur=0;sel=null;render()}catch(e){alert('Faili si sahihi')}};r.readAsText(f);fi.value=''};
function exp(t){if(!t)return;flush();if(t=='json')return save();if(t=='pptx')return pptx();
if(t=='pdf'){$('pr').innerHTML=P.slides.map(s=>`<div class="slide" style="background:${s.bg}">${slideHTML(s)}</div>`).join('');return print()}
const h=`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wasilisho</title><style>body{margin:0;background:#000;overflow:hidden}.slide{position:absolute;width:960px;height:540px;transform-origin:0 0;overflow:hidden}.el{position:absolute;box-sizing:border-box;overflow:hidden}.shp{display:flex;align-items:center;justify-content:center}.in{width:100%;white-space:pre-wrap;word-break:break-word}</style></head><body><script>let sel=null,i=0;const D=${JSON.stringify(P.slides).replace(/</g,'\\u003c')};const css=${css};const inner=${inner};const slideHTML=${slideHTML};function show(){const s=D[i],k=Math.min(innerWidth/960,innerHeight/540);document.body.innerHTML='<div class="slide" style="background:'+s.bg+';transform:scale('+k+');left:'+(innerWidth-960*k)/2+'px;top:'+(innerHeight-540*k)/2+'px">'+slideHTML(s)+'</div>'}onkeydown=e=>{if(['ArrowRight',' ','Enter','PageDown'].includes(e.key))i=Math.min(D.length-1,i+1);else if(['ArrowLeft','PageUp'].includes(e.key))i=Math.max(0,i-1);else return;show()};onclick=()=>{i=(i+1)%D.length;show()};onresize=show;show();<\/script></body></html>`;
dl('wasilisho.html','text/html',h)}
function pptx(){if(!window.PptxGenJS)return alert('Inahitaji intaneti kupakia maktaba ya PptxGenJS. Tumia HTML/PDF/JSON nje ya mtandao.');const p=new PptxGenJS();p.layout='LAYOUT_16x9';const hx=c=>(c||'').replace('#','');
P.slides.forEach(s=>{const x=p.addSlide();x.background={color:hx(s.bg)||'FFFFFF'};s.els.forEach(e=>{const o={x:e.x/96,y:e.y/96,w:e.w/96,h:e.h/96};if(e.t=='img'){x.addImage({data:e.src,...o});return}
const d=document.createElement('div');d.innerHTML=(e.html||'').replace(/<br\s*\/?>|<\/div>|<\/p>/gi,'\n');const f={fontSize:Math.round(e.fs*.75),fontFace:e.ff||'Segoe UI',color:hx(e.c)||'000000',bold:!!e.b,italic:!!e.i,align:e.a||'left',valign:e.t=='text'?'top':'middle',margin:0};if(e.fill)f.fill={color:hx(e.fill)};
if(e.t=='text')x.addText(d.textContent,{...o,...f});else x.addText(d.textContent,{...o,...f,shape:e.t=='ellipse'?p.ShapeType.ellipse:p.ShapeType.rect})})});p.writeFile({fileName:'wasilisho.pptx'})}
function present(){flush();pi=cur;const p=$('pres');p.style.display='block';showP();if(p.requestFullscreen)p.requestFullscreen().catch(()=>{})}
function showP(){const s=P.slides[pi],k=Math.min(innerWidth/960,innerHeight/540);$('pres').innerHTML=`<div class="slide" style="background:${s.bg};transform:scale(${k});left:${(innerWidth-960*k)/2}px;top:${(innerHeight-540*k)/2}px">${slideHTML(s)}</div>`}
function endP(){$('pres').style.display='none';if(document.fullscreenElement)document.exitFullscreen();cur=pi;sel=null;render()}
const go=d=>{pi=Math.max(0,Math.min(P.slides.length-1,pi+d));showP()};
$('pres').onclick=()=>pi<P.slides.length-1?go(1):endP();
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&$('pres').style.display=='block')endP()});
addEventListener('resize',()=>{if($('pres').style.display=='block')showP();else fit()});
$('rb').addEventListener('mousedown',e=>{if(e.target.tagName=='BUTTON')e.preventDefault()});
document.addEventListener('keydown',e=>{const k=e.key;if($('pres').style.display=='block'){e.preventDefault();if(['ArrowRight',' ','Enter','PageDown','ArrowDown'].includes(k))go(1);else if(['ArrowLeft','PageUp','ArrowUp'].includes(k))go(-1);else if(k=='Escape')endP();return}
const t=e.target;if(t.isContentEditable){if(k=='Escape')t.blur();return}if(/INPUT|SELECT/.test(t.tagName))return;const ctrl=e.ctrlKey||e.metaKey,x=k.toLowerCase();
if(ctrl){const m={z:undo,y:redo,s:save,c:()=>cp(0),x:()=>cp(1),v:()=>{},d:()=>{if(sel){cp(0);pst()}}};if(m[x]){if(x!='v')e.preventDefault();m[x]()}return}
if(k=='F5'){e.preventDefault();present()}else if(k=='Delete'||k=='Backspace'){e.preventDefault();delE()}
else if(k=='PageDown'||(!sel&&(k=='ArrowDown'||k=='ArrowRight'))){if(cur<P.slides.length-1){cur++;render()}}
else if(k=='PageUp'||(!sel&&(k=='ArrowUp'||k=='ArrowLeft'))){if(cur>0){cur--;render()}}
else if(sel&&k.startsWith('Arrow')){e.preventDefault();snap();const o=el(sel),n=e.shiftKey?10:1;if(k=='ArrowUp')o.y-=n;if(k=='ArrowDown')o.y+=n;if(k=='ArrowLeft')o.x-=n;if(k=='ArrowRight')o.x+=n;stage();thumbs();persist()}});
try{P=JSON.parse(localStorage.pp)}catch(e){}if(!P||!P.slides||!P.slides.length)P=def();render();
</script></body></html>
